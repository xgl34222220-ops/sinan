name: Repair v5.6.1 patch workflow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v5.6.1-recency-learning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair indentation-sensitive replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v5.6.1-recency-learning.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          replace_required(
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt",
              """                            learningStore.profile(
                                      snapshot.lottery.apiKey,
                                      config.id,
                                      activeModel,
                                      prediction.position,
                                  )
          """,
              """                            learningStore.profile(
                                      snapshot.lottery.apiKey,
                                      config.id,
                                      learningStrategy,
                                      prediction.position,
                                  )
          """,
          )
'''
          new = '''          replace_required(
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt",
              """                        val resolvedLearning = reply.prediction?.let { prediction ->
                            learningStore.profile(
                                snapshot.lottery.apiKey,
                                config.id,
                                activeModel,
                                prediction.position,
                            )
                        } ?: learningProfile
          """,
              """                        val resolvedLearning = reply.prediction?.let { prediction ->
                            learningStore.profile(
                                snapshot.lottery.apiKey,
                                config.id,
                                learningStrategy,
                                prediction.position,
                            )
                        } ?: learningProfile
          """,
          )
'''
          if old not in text:
              raise SystemExit('target replacement block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/repair-v5.6.1-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair v5.6.1 verification workflow"
          git push origin HEAD:${{ github.head_ref }}
