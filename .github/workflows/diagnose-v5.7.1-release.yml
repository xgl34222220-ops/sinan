name: Diagnose Tianji v5.7.1 release

on:
  push:
    branches: [main]
    paths:
      - DIAGNOSE_V571_TRIGGER.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect signed release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          TAG_COMMIT="$(git rev-list -n1 v5.7.1)"
          RUN_JSON="$(gh run list --workflow release.yml --commit "$TAG_COMMIT" --limit 5 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url)"
          mkdir -p ci-v571
          printf '%s\n' "$RUN_JSON" > ci-v571/RELEASE_RUNS.json
          RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"$RUN_JSON")"
          if [[ -n "$RUN_ID" ]]; then
            gh run view "$RUN_ID" --json databaseId,status,conclusion,event,headSha,jobs,url > ci-v571/RELEASE_RUN_DETAIL.json
            STATUS="$(jq -r '.status' ci-v571/RELEASE_RUN_DETAIL.json)"
            CONCLUSION="$(jq -r '.conclusion // ""' ci-v571/RELEASE_RUN_DETAIL.json)"
            if [[ "$STATUS" == completed && "$CONCLUSION" != success ]]; then
              gh run view "$RUN_ID" --log-failed > ci-v571/RELEASE_FAILED_LOG.txt || true
            else
              rm -f ci-v571/RELEASE_FAILED_LOG.txt
            fi
          else
            printf '{"error":"no release.yml run found","tag_commit":"%s"}\n' "$TAG_COMMIT" > ci-v571/RELEASE_RUN_DETAIL.json
          fi
          rm -f DIAGNOSE_V571_TRIGGER.txt
          rm -f .github/workflows/diagnose-v5.7.1-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v571/RELEASE_RUNS.json ci-v571/RELEASE_RUN_DETAIL.json
          [[ ! -e ci-v571/RELEASE_FAILED_LOG.txt ]] || git add -- ci-v571/RELEASE_FAILED_LOG.txt
          git rm --ignore-unmatch -- DIAGNOSE_V571_TRIGGER.txt .github/workflows/diagnose-v5.7.1-release.yml
          git commit -m 'ci: record Tianji v5.7.1 signed release diagnostics'
          git push origin HEAD:main
