name: Apply v6.5 final cleanup

on:
  push:
    branches:
      - feature/v6.5-ui-final-polish-2

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v6.5-ui-final-polish-2
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Final UI cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          console = Path('server/app/console_v3.py')
          s = console.read_text(encoding='utf-8')
          token = '''/* v6.5 UI Final Polish 2: shared density + semantic token layer */
          .tianji-console-v620{--v65-card-radius:18px;--v65-control-radius:14px;--v65-gap:9px}
          .tianji-console-v620 .card,.tianji-console-v620 .lottery-card{border-radius:var(--v65-card-radius)}
          .tianji-console-v620 .btn,.tianji-console-v620 .icon-btn,.tianji-console-v620 .status{border-radius:var(--v65-control-radius)}
          .tianji-console-v620 .v620-realtime-card{border-radius:var(--v65-card-radius)}
          .tianji-console-v620 .v630-health-pill{font-size:11px}
          '''
          # Remove accidental duplicate if present.
          if token + token in s:
              s = s.replace(token + token, token, 1)
          mobile_anchor = '''@media(max-width:520px){
          '''
          mobile_density = '''@media(max-width:520px){
            .tianji-console-v620 .section{margin-top:10px}
            .tianji-console-v620 .card-pad{padding:14px}
            .tianji-console-v620 .metric{padding:11px;border-radius:16px}
            .tianji-console-v620 .lottery-main,.tianji-console-v620 .overview-card{padding:14px}
            .tianji-console-v620 .switch-row{padding:10px 11px;border-radius:14px}
            .tianji-console-v620 .model-choice{min-height:54px;padding:9px 10px;border-radius:14px}
            .tianji-console-v620 .profile-card{padding:10px;border-radius:14px}
            .tianji-console-v620 .provider-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--ai),var(--primary2))}
            .tianji-console-v620 .quick-current{font-size:16px}
          '''
          if mobile_density not in s:
              if mobile_anchor not in s:
                  raise SystemExit('mobile media anchor missing')
              s = s.replace(mobile_anchor, mobile_density, 1)
          console.write_text(s, encoding='utf-8')

          push = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62PushAlertCenter.kt')
          p = push.read_text(encoding='utf-8')
          old = '''                Text(
                    "${alerts.size} 条历史通知 · ${alerts.count { !it.isRead }} 条未读",
                    color = colors.textDim,
                    fontSize = 11.sp,
                    fontWeight = FontWeight.Medium,
                )'''
          new = '''                Text(
                    "预测、预警与恢复",
                    color = colors.textDim,
                    fontSize = 11.sp,
                    fontWeight = FontWeight.Medium,
                )'''
          if old in p:
              p = p.replace(old, new, 1)
          elif '"预测、预警与恢复"' not in p:
              raise SystemExit('notification subtitle target missing')
          push.write_text(p, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/console_v3.py app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62PushAlertCenter.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: finish v6.5 mobile UI cleanup"
          git push origin HEAD:feature/v6.5-ui-final-polish-2
