name: Fix and release Tianji v5.4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tianji-v5.4.6-ai-timeout-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore stable AI prompt and apply bounded execution
        shell: bash
        run: |
          set -euo pipefail
          AI_FILE='app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt'
          git checkout b78d191f30e9df78dd537e3798dfcf1a76737b01 -- "$AI_FILE"

          python3 <<'PY'
          from pathlib import Path

          ai = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt')
          text = ai.read_text(encoding='utf-8')

          replacements = [
              (
                  '必须先横向比较position 1至10的全部已核验统计，再选择证据最充分的一个名次。不得默认、照抄或偏向position=1；名次选择必须由本次数据决定。',
                  '必须横向比较position 1至10的全部已核验统计，选择本次数据证据最充分的名次；不得默认、回避或偏向任何固定名次。'
              ),
              (
                  '你是独立概率排序模型。输入含真实开奖、由客户端逐期计算并核验的统计表，以及不含候选结果的本地模型质量摘要。本地盲测候选已被刻意隐藏。遗漏、近20期次数和大小连开必须以 verified_position_statistics 为唯一事实来源，不得自行心算或改写。你必须先比较position 1至10的全部统计，再选择证据最充分的一个名次；不得默认选择第1名，也不得因为字段顺序或历史示例偏向任何固定名次。随后按号码1至10顺序输出10个非负原始评分，每项至少保留6位小数。六码、七码和最终号码排序均由客户端根据原始scores确定。只输出 required_json_schema 指定的 position 与 scores，不要解释、不要Markdown，不承诺准确率、盈利或必中。',
                  '你是独立、严谨的开奖概率排序模型，不得虚构从业年限、专家经历或未提供的数据。输入包含真实开奖、客户端逐期计算并核验的统计表，以及不含候选结果的本地模型质量摘要。本地盲测候选已被刻意隐藏。遗漏、近20期次数和大小连开必须以 verified_position_statistics 为唯一事实来源，不得自行心算或改写。先横向比较position 1至10的全部统计，再选择本次数据证据最充分的名次；不得默认、回避或偏向任何固定名次。随后按号码1至10顺序输出10个非负原始评分，每项至少保留6位小数，并确保第6与第7候选边界能够区分。六码、七码及最终排序均由客户端根据原始scores确定。只输出 required_json_schema 指定的 position 与 scores，不要解释、不要Markdown，不承诺准确率、盈利或必中。'
              ),
              (
                  'maxTokens = if (primaryDecision.expectsReasoning) 8_192 else 640,',
                  'maxTokens = if (primaryDecision.expectsReasoning) 4_096 else 640,'
              ),
              (
                  'readTimeoutMs = if (primaryDecision.expectsReasoning) 90_000 else 35_000,',
                  'readTimeoutMs = if (primaryDecision.expectsReasoning) 60_000 else 30_000,'
              ),
              (
                  'maxTokens = 800,\n                readTimeoutMs = 40_000,',
                  'maxTokens = 640,\n                readTimeoutMs = 20_000,'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          if 'analysis_method_rule' in text or '证据接近时应保持scores接近' in text:
              raise SystemExit('v5.4.5 conflicting prompt rule still present')

          ai.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          gradle_text = gradle.read_text(encoding='utf-8')
          if 'versionCode = 22' not in gradle_text or 'versionName = "5.4.5"' not in gradle_text:
              raise SystemExit('Unexpected current app version')
          gradle_text = gradle_text.replace('versionCode = 22', 'versionCode = 23', 1)
          gradle_text = gradle_text.replace('versionName = "5.4.5"', 'versionName = "5.4.6"', 1)
          gradle.write_text(gradle_text, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = readme_text.replace('- 版本：5.4.5', '- 版本：5.4.6', 1)
          marker = '## v5.4.5 重点优化\n'
          section = '''## v5.4.6 重点修复

- 回退 v5.4.5 过重且相互冲突的多窗口强制提示词，恢复稳定的独立概率排序流程。
- 保留真实接口历史、60/120期窗口、十个名次横向比较和不偏向固定名次规则。
- 明确要求第6与第7候选边界可区分，减少无效同分输出与格式重试。
- 深度推理输出上限由8192降至4096，正式请求最长60秒，普通请求30秒，纠错重试20秒。
- 目标期已开奖后仍不会把迟到结果计入真实成绩，避免事后预测污染验证记录。

'''
          if marker not in readme_text:
              raise SystemExit('README v5.4.5 marker not found')
          readme_text = readme_text.replace(marker, section + marker, 1)
          readme.write_text(readme_text, encoding='utf-8')

          Path('RELEASE_NOTES_v5.4.6.md').write_text('''# 天机 v5.4.6

- 修复 v5.4.5 更换 AI 角色后预测耗时过长、重复重试并最终失败的回归。
- 删除会让评分过度接近、与第6/第7边界校验冲突的强制分析规则。
- 恢复简洁、独立、无固定名次偏向的历史数据概率排序提示词。
- 深度请求最长60秒、普通请求30秒；格式纠错最多再请求一次且最长20秒。
- 保留60/120期历史、六码/七码客户端排序、真实目标期校验和迟到结果不计分保护。
''', encoding='utf-8')
          PY

          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "5.4.6"' app/build.gradle.kts
          ! grep -q 'analysis_method_rule' "$AI_FILE"
          ! grep -q '证据接近时应保持scores接近' "$AI_FILE"
          grep -q 'readTimeoutMs = if (primaryDecision.expectsReasoning) 60_000 else 30_000' "$AI_FILE"
          grep -q 'readTimeoutMs = 20_000' "$AI_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable release signing certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.TIANJI_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE_FILE="$RUNNER_TEMP/tianji-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          {
            echo "TIANJI_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "TIANJI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "TIANJI_KEY_ALIAS=$KEY_ALIAS"
            echo "TIANJI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit test and build signed Release APK
        shell: bash
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature and package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-assets/signature.txt
          grep -qi 'f492329ea2492439e20c8339bd29975f10fb6f71578212ab73a6857bc6e46133' release-assets/signature.txt
          cp "$APK" release-assets/Tianji-v5.4.6-release.apk
          cd release-assets
          sha256sum Tianji-v5.4.6-release.apk > Tianji-v5.4.6-release-SHA256.txt
          cat Tianji-v5.4.6-release-SHA256.txt

      - name: Commit verified v5.4.6 source to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt app/build.gradle.kts README.md RELEASE_NOTES_v5.4.6.md
          git commit -m '天机 v5.4.6：修复 AI 超时、冲突提示词与重复失败'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.4.6-Stable-APK
          path: |
            release-assets/Tianji-v5.4.6-release.apk
            release-assets/Tianji-v5.4.6-release-SHA256.txt
            release-assets/signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish formal v5.4.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v5.4.6 >/dev/null 2>&1; then
            gh release upload v5.4.6 \
              release-assets/Tianji-v5.4.6-release.apk \
              release-assets/Tianji-v5.4.6-release-SHA256.txt \
              --clobber
            gh release edit v5.4.6 \
              --target "$COMMIT_SHA" \
              --title '天机 v5.4.6 正式版' \
              --notes-file RELEASE_NOTES_v5.4.6.md
          else
            gh release create v5.4.6 \
              --target "$COMMIT_SHA" \
              --title '天机 v5.4.6 正式版' \
              --notes-file RELEASE_NOTES_v5.4.6.md \
              release-assets/Tianji-v5.4.6-release.apk \
              release-assets/Tianji-v5.4.6-release-SHA256.txt
          fi
          gh release view v5.4.6 --json tagName,name,isDraft,isPrerelease,url
