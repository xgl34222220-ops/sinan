name: Finalize Tianji v5.7.2 nativev5 release

on:
  push:
    branches: [main]
    paths: [FINALIZE_NATIVEV5_V572_TRIGGER.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: tianji-nativev5-v5.7.2-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify existing signed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA='1a19b17dd361e4fc2fc4a0347bc2322c844d7ee4'
          APK_SHA256='a5422183527efd628f7a5e7099257faabf667518b1141633bb557c9570bec512'
          CERT_SHA256='89125c40d4f9a88cf5847f34ef2a1506ad5bed093ef7ed7cbbe568b570738d12'
          ARTIFACT_ID='8880537524'
          mkdir -p /tmp/tianji-nativev5-dist
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/tianji-nativev5-apk.zip
          unzip -q /tmp/tianji-nativev5-apk.zip -d /tmp/tianji-nativev5-dist
          cd /tmp/tianji-nativev5-dist
          test -s Tianji-v5.7.2-nativev5-release.apk
          test "$(sha256sum Tianji-v5.7.2-nativev5-release.apk | awk '{print $1}')" = "$APK_SHA256"
          grep -q "package: name='com.tianji.probabilitylab.nativev5'" APK_BADGING.txt
          grep -q "versionCode='39'" APK_BADGING.txt
          grep -q "versionName='5.7.2'" APK_BADGING.txt
          grep -q 'Verified using v2 scheme.*true' APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' APK_VERIFY.txt
          grep -qi "$CERT_SHA256" APK_VERIFY.txt
          grep -qi "$CERT_SHA256" SIGNING_CERT_SHA256.txt
          grep -Fxq "$SOURCE_SHA" RELEASE_SOURCE_SHA.txt
          grep -q "$APK_SHA256" Tianji-v5.7.2-nativev5-SHA256.txt
          cd "$GITHUB_WORKSPACE"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git show ${SOURCE_SHA}:app/build.gradle.kts | sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' | head -n1)" = 'com.tianji.probabilitylab.nativev5'
          test "$(git show ${SOURCE_SHA}:app/build.gradle.kts | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n1)" = '39'
          test "$(git show ${SOURCE_SHA}:app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n1)" = '5.7.2'
          git show "${SOURCE_SHA}:RELEASE_NOTES_v5.7.2.md" > /tmp/RELEASE_NOTES_v5.7.2.md
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Create immutable tag and formal GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --tags --force
          if git rev-parse --verify refs/tags/v5.7.2 >/dev/null 2>&1; then
            test "$(git rev-list -n1 v5.7.2)" = "$SOURCE_SHA"
          else
            git tag -a v5.7.2 "$SOURCE_SHA" -m '天机 v5.7.2 · nativev5 新永久签名版'
            git push origin refs/tags/v5.7.2
          fi
          if gh release view v5.7.2 >/dev/null 2>&1; then
            gh release upload v5.7.2 /tmp/tianji-nativev5-dist/* --clobber
            gh release edit v5.7.2 \
              --title '天机 v5.7.2 · 新正式签名版' \
              --notes-file /tmp/RELEASE_NOTES_v5.7.2.md \
              --draft=false \
              --prerelease=false
          else
            gh release create v5.7.2 \
              --verify-tag \
              --title '天机 v5.7.2 · 新正式签名版' \
              --notes-file /tmp/RELEASE_NOTES_v5.7.2.md \
              /tmp/tianji-nativev5-dist/*
          fi
          gh release view v5.7.2 --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == "v5.7.2" and (.isDraft | not) and (.isPrerelease | not)) | .tagName' \
            | grep -Fxq v5.7.2
          ASSETS="$(gh release view v5.7.2 --json assets --jq '.assets[].name')"
          for asset in \
            Tianji-v5.7.2-nativev5-release.apk \
            Tianji-v5.7.2-nativev5-SHA256.txt \
            APK_VERIFY.txt \
            APK_BADGING.txt \
            SIGNING_CERT_SHA256.txt \
            PACKAGE_MIGRATION.txt \
            RELEASE_SOURCE_SHA.txt; do
            grep -Fxq "$asset" <<<"$ASSETS"
          done

      - name: Record verified release and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          mkdir -p ci-nativev5
          cat > ci-nativev5/RELEASE_STATUS.txt <<EOF
          status=success
          version_name=5.7.2
          version_code=39
          package_name=com.tianji.probabilitylab.nativev5
          tag=v5.7.2
          source_sha=${SOURCE_SHA}
          signing_cert_sha256=${CERT_SHA256}
          apk_sha256=${APK_SHA256}
          apk=Tianji-v5.7.2-nativev5-release.apk
          release_published=true
          backup_delivered_to_private_session=true
          signing_key_artifact_id=8880536983
          recovery_password_artifact_id=8880537212
          apk_artifact_id=8880537524
          cloud_base_url=https://tianji-xgl.duckdns.org
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-nativev5/RELEASE_STATUS.txt
          git rm --ignore-unmatch \
            FINALIZE_NATIVEV5_V572_TRIGGER.txt \
            .github/workflows/finalize-nativev5-v5.7.2.yml \
            PUBLISH_NATIVEV5_V572_TRIGGER.txt \
            .github/workflows/publish-nativev5-v5.7.2.yml \
            DIAG_NATIVEV5_V572_TRIGGER.txt \
            .github/workflows/diag-nativev5-v5.7.2.yml \
            ci-nativev5/PUBLISH_RUNS.json \
            ci-nativev5/PUBLISH_DETAIL.json \
            ci-nativev5/PUBLISH_FAILED_LOG.txt \
            ci-v572/RELEASE_BLOCKED.txt
          git commit -m 'chore: record verified Tianji v5.7.2 nativev5 release'
          git push origin HEAD:main
