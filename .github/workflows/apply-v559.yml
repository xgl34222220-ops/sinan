name: Apply Tianji v5.5.9 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v5.5.9-background-speed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fix patch preflight
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v559.py')
          text = path.read_text(encoding='utf-8')
          old = '''text = replace_once(
              text,
              '\"${config.analysisMode.label} · ${AiReasoningEngine.resolve(config).displayLabel}\",',
              '\"${config.analysisMode.label} · ${AiReasoningEngine.resolveForecast(config).displayLabel}\",',
              "formal status label",
          )'''
          new = '''old_formal_label = '\"${config.analysisMode.label} · ${AiReasoningEngine.resolve(config).displayLabel}\",'
          new_formal_label = '\"${config.analysisMode.label} · ${AiReasoningEngine.resolveForecast(config).displayLabel}\",'
          if text.count(old_formal_label) != 2:
              raise RuntimeError(f"formal status label: expected 2 matches, found {text.count(old_formal_label)}")
          text = text.replace(old_formal_label, new_formal_label, 2)'''
          if old not in text:
              raise SystemExit('preflight target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply source patch
        run: python3 tools/apply_v559.py

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '天机 v5.5.9：限时预测、后台任务与对话档案重构'
          git push origin HEAD:${{ github.head_ref }}
