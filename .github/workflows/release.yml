name: Tianji Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'RELEASE_NOTES_v*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          RELEASE_TAG="v$VERSION"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "$RELEASE_TAG" = "$GITHUB_REF_NAME"
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore and verify protected signing identity
        shell: bash
        env:
          TIANJI_KEYSTORE_BASE64: ${{ secrets.TIANJI_KEYSTORE_BASE64 }}
          TIANJI_KEYSTORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          TIANJI_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          TIANJI_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_BASE64"
          test -n "$TIANJI_KEYSTORE_PASSWORD"
          test -n "$TIANJI_KEY_ALIAS"
          test -n "$TIANJI_KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$TIANJI_KEYSTORE_BASE64" | base64 --decode > .signing/tianji-release.jks
          test -s .signing/tianji-release.jks
          keytool -list \
            -keystore .signing/tianji-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc \
            -keystore .signing/tianji-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" \
            -file .signing/tianji-release-cert.pem
          EXPECTED_CERT_SHA256='5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed'
          ACTUAL_CERT_SHA256="$(
            openssl x509 -in .signing/tianji-release-cert.pem -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          printf 'SHA256 certificate digest: %s\n' "$ACTUAL_CERT_SHA256" \
            > .signing/CERT_SHA256.txt

      - name: Test and build signed APK
        shell: bash
        env:
          TIANJI_KEYSTORE_FILE: ${{ github.workspace }}/.signing/tianji-release.jks
          TIANJI_KEYSTORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          TIANJI_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          TIANJI_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist
          APK="dist/Tianji-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" | tee dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' \
            dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging "$APK" | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev5'" dist/APK_BADGING.txt
          grep -q "versionName='$VERSION'" dist/APK_BADGING.txt
          cp .signing/CERT_SHA256.txt dist/SIGNING_CERT_SHA256.txt
          sha256sum "$APK" > "dist/Tianji-v${VERSION}-SHA256.txt"
          unzip -t "$APK" >/dev/null

      - name: Create release tag after main merge
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "天机 $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${RELEASE_TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES=README.md
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "天机 $RELEASE_TAG" \
              --notes-file "$NOTES" \
              dist/*
          fi

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-release-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
