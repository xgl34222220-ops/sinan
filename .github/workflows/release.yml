name: Tianji Release

on:
  push:
    branches: [main]
    paths:
      - 'RELEASE_NOTES_v5.9.4.md'
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-v5.9.4-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test "$VERSION" = '5.9.4'
          test "$VERSION_CODE" = '46'
          test "$APP_ID" = 'com.tianji.probabilitylab.nativev5'
          printf 'VERSION=%s\nVERSION_CODE=%s\nAPP_ID=%s\nRELEASE_TAG=v%s\n' \
            "$VERSION" "$VERSION_CODE" "$APP_ID" "$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore protected nativev5 signing identity
        shell: bash
        env:
          TIANJI_KEYSTORE_BASE64: ${{ secrets.TIANJI_KEYSTORE_BASE64 }}
          TIANJI_KEYSTORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          TIANJI_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          TIANJI_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_BASE64"
          test -n "$TIANJI_KEYSTORE_PASSWORD"
          test -n "$TIANJI_KEY_ALIAS"
          test -n "$TIANJI_KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$TIANJI_KEYSTORE_BASE64" | base64 --decode > .signing/tianji-nativev5-release.jks
          test -s .signing/tianji-nativev5-release.jks
          keytool -list \
            -keystore .signing/tianji-nativev5-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc \
            -keystore .signing/tianji-nativev5-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" \
            -file .signing/tianji-nativev5-release-cert.pem
          CERT_SHA256="$(
            openssl x509 -in .signing/tianji-nativev5-release-cert.pem -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          test -n "$CERT_SHA256"
          printf 'TIANJI_KEYSTORE_FILE=%s\n' "$GITHUB_WORKSPACE/.signing/tianji-nativev5-release.jks" >> "$GITHUB_ENV"
          printf 'TIANJI_KEYSTORE_PASSWORD=%s\n' "$TIANJI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'TIANJI_KEY_ALIAS=%s\n' "$TIANJI_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'TIANJI_KEY_PASSWORD=%s\n' "$TIANJI_KEY_PASSWORD" >> "$GITHUB_ENV"
          printf 'CERT_SHA256=%s\n' "$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Verify upgrade certificate against latest published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG='v5.9.3'
          if ! gh release view "$PREVIOUS_TAG" >/dev/null 2>&1; then
            PREVIOUS_TAG='v5.9.2'
          fi
          mkdir -p previous-release
          gh release download "$PREVIOUS_TAG" --pattern '*.apk' --dir previous-release
          PREVIOUS_APK="$(find previous-release -type f -name '*.apk' | head -n1)"
          test -n "$PREVIOUS_APK"
          PREVIOUS_CERT_SHA256="$(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$PREVIOUS_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          )"
          test -n "$PREVIOUS_CERT_SHA256"
          test "$CERT_SHA256" = "$PREVIOUS_CERT_SHA256"
          printf 'Previous release: %s\nSHA256 certificate digest: %s\n' \
            "$PREVIOUS_TAG" "$CERT_SHA256" > .signing/CERT_SHA256.txt

      - name: Test and build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist
          APK="dist/Tianji-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Tianji-v${VERSION}-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" > dist/APK_VERIFY.txt
          cat dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          APK_CERT_SHA256="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/APK_VERIFY.txt \
              | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
          )"
          test "$APK_CERT_SHA256" = "$CERT_SHA256"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" > dist/APK_BADGING.txt
          grep -q "package: name='$APP_ID'" dist/APK_BADGING.txt
          grep -q "versionCode='$VERSION_CODE'" dist/APK_BADGING.txt
          grep -q "versionName='$VERSION'" dist/APK_BADGING.txt
          cp .signing/CERT_SHA256.txt dist/SIGNING_CERT_SHA256.txt
          sha256sum "$APK" > "dist/Tianji-v${VERSION}-SHA256.txt"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "天机 $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "天机 $RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "天机 $RELEASE_TAG" \
              --notes-file "$NOTES" \
              dist/*
          fi

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-release-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
