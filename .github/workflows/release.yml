name: Tianji Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore signing key from protected secrets
        shell: bash
        env:
          TIANJI_KEYSTORE_BASE64: ${{ secrets.TIANJI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$TIANJI_KEYSTORE_BASE64" | base64 --decode > .signing/tianji-release.jks
          test -s .signing/tianji-release.jks

      - name: Verify version, test and build signed APK
        shell: bash
        env:
          TIANJI_KEYSTORE_FILE: ${{ github.workspace }}/.signing/tianji-release.jks
          TIANJI_KEYSTORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          TIANJI_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          TIANJI_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "v$VERSION" = "$GITHUB_REF_NAME"
          fi
          gradle --no-daemon --stacktrace \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist
          APK="dist/Tianji-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" | tee dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging "$APK" | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionName='$VERSION'" dist/APK_BADGING.txt
          sha256sum "$APK" > "dist/Tianji-v${VERSION}-SHA256.txt"
          unzip -t "$APK" >/dev/null

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES=README.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "天机 $GITHUB_REF_NAME" \
            --notes-file "$NOTES" \
            dist/*

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
