name: Apply Tianji v5.5.6 lightweight core restore

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.5.6-early-result
          fetch-depth: 0

      - name: Apply lightweight core restore
        run: python3 scripts/apply_v5_5_6_restore_fast_core.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Prepare verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Tianji-v5.5.6-debug.apk
          sha256sum dist/Tianji-v5.5.6-debug.apk > dist/Tianji-v5.5.6-debug-SHA256.txt
          unzip -t dist/Tianji-v5.5.6-debug.apk >/dev/null

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.6-restored-fast-core
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v5.5.6-restore-fast-core.yml scripts/apply_v5_5_6_restore_fast_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            RELEASE_NOTES_v5.5.6.md \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiReasoning.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiReasoningFallbackTest.kt
          git add -u -- .github/workflows scripts
          git commit -m '天机 v5.5.6：恢复轻量核心预测并保留结果早停'
          git push origin HEAD:feature/v5.5.6-early-result
