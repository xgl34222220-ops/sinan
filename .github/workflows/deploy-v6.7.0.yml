name: Tianji v6.7.0 Server Deploy

on:
  workflow_run:
    workflows: ["Tianji Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tianji-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.TIANJI_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.TIANJI_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.TIANJI_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.TIANJI_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.TIANJI_DEPLOY_PATH || '/opt/tianji' }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Gate deployment to v6.7.0 only
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ "$VERSION" == '6.7.0' ]]; then
            echo 'SHOULD_DEPLOY=true' >> "$GITHUB_ENV"
          else
            echo 'SHOULD_DEPLOY=false' >> "$GITHUB_ENV"
            echo "Skipping one-shot v6.7.0 deploy for version $VERSION"
          fi

      - name: Require protected deployment secrets
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing TIANJI_DEPLOY_HOST" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing TIANJI_DEPLOY_USER" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing TIANJI_DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "$EXPECTED_SHA" || { echo "Missing release SHA" >&2; exit 1; }

      - name: Configure ephemeral SSH identity
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tianji_deploy_key
          chmod 600 ~/.ssh/tianji_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact released commit
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_script '%q ' bash -s -- "$DEPLOY_PATH" "$EXPECTED_SHA"
          ssh \
            -i ~/.ssh/tianji_deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_script" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          EXPECTED_SHA="$2"
          cd "$DEPLOY_PATH"
          test -d .git || { echo "Not a git checkout: $DEPLOY_PATH" >&2; exit 1; }
          test -z "$(git status --porcelain)" || {
            echo "Deployment checkout has local changes; refusing to overwrite them." >&2
            git status --short
            exit 1
          }
          git fetch --prune origin main
          git cat-file -e "$EXPECTED_SHA^{commit}" || {
            echo "Released commit is not available from origin/main history: $EXPECTED_SHA" >&2
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "Released commit is not an ancestor of current origin/main" >&2
            exit 1
          }
          git checkout --detach "$EXPECTED_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo "Failed to checkout exact released SHA." >&2
            echo "Expected: $EXPECTED_SHA" >&2
            echo "Actual:   $ACTUAL_SHA" >&2
            exit 1
          }
          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps
          for attempt in 1 2 3 4 5 6; do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()" >/dev/null 2>&1; then
              echo "Tianji v6.7.0 production health check passed at $ACTUAL_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Tianji health check failed after deploy" >&2
          docker compose logs --tail=160 api worker >&2 || true
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/tianji_deploy_key
