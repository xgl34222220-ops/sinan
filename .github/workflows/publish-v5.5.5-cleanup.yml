name: Publish Tianji v5.5.5 and clean repository

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: tianji-v5.5.5-formal-release
  cancel-in-progress: false

jobs:
  publish-and-clean:
    if: github.head_ref == 'ops/publish-v5.5.5-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    steps:
      - name: Checkout verified main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test, lint and build release candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "5.5.5"' app/build.gradle.kts
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          cp "$UNSIGNED_APK" "$RUNNER_TEMP/Tianji-v5.5.5-unsigned.apk"
          unzip -t "$RUNNER_TEMP/Tianji-v5.5.5-unsigned.apk" >/dev/null

      - name: Restore or generate the long-term formal signing identity
        id: signing
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.TIANJI_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing" "$RUNNER_TEMP/signing-backup" dist
          KEYSTORE="$RUNNER_TEMP/signing/tianji-release.jks"

          if [[ -n "$SECRET_KEYSTORE_BASE64" && -n "$SECRET_STORE_PASSWORD" && -n "$SECRET_KEY_ALIAS" && -n "$SECRET_KEY_PASSWORD" ]]; then
            printf '%s' "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            GENERATED=false
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="tianji-release"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -dname 'CN=Tianji Release, OU=Tianji, O=xgl34222220-ops, L=Unknown, ST=Unknown, C=CN' \
              -noprompt
            GENERATED=true
          fi

          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          export APKSIGNER_STORE_PASSWORD="$STORE_PASSWORD"
          export APKSIGNER_KEY_PASSWORD="$KEY_PASSWORD"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:APKSIGNER_STORE_PASSWORD \
            --key-pass env:APKSIGNER_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist/Tianji-v5.5.5-release.apk \
            "$RUNNER_TEMP/Tianji-v5.5.5-unsigned.apk"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs dist/Tianji-v5.5.5-release.apk \
            | tee dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging dist/Tianji-v5.5.5-release.apk \
            | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionCode='30'" dist/APK_BADGING.txt
          grep -q "versionName='5.5.5'" dist/APK_BADGING.txt
          sha256sum dist/Tianji-v5.5.5-release.apk > dist/Tianji-v5.5.5-SHA256.txt
          unzip -t dist/Tianji-v5.5.5-release.apk >/dev/null

          cp RELEASE_NOTES_v5.5.5.md dist/RELEASE_NOTES.md
          if [[ "$GENERATED" == true ]]; then
            printf '%s\n' '' '## 签名迁移说明' '' \
              '本正式版启用新的长期正式签名。由于旧版签名私钥已不存在，已安装旧签名版本的设备需要先备份应用数据并卸载旧版，再安装本版本；从 v5.5.5 开始后续版本将使用本次正式签名，可直接覆盖升级。' \
              >> dist/RELEASE_NOTES.md
            cp "$KEYSTORE" "$RUNNER_TEMP/signing-backup/tianji-release-v5.5.5.jks"
            base64 -w 0 "$KEYSTORE" > "$RUNNER_TEMP/signing-backup/TIANJI_KEYSTORE_BASE64.txt"
            printf '%s\n' \
              "TIANJI_KEYSTORE_PASSWORD=$STORE_PASSWORD" \
              "TIANJI_KEY_ALIAS=$KEY_ALIAS" \
              "TIANJI_KEY_PASSWORD=$KEY_PASSWORD" \
              > "$RUNNER_TEMP/signing-backup/SIGNING-CREDENTIALS.txt"
            printf '%s\n' \
              '这是天机从 v5.5.5 开始使用的长期正式签名私钥备份。' \
              '请离线保存，任何人获得此文件和密码都能签署可覆盖安装的应用。' \
              '将 TIANJI_KEYSTORE_BASE64.txt 的完整内容和 SIGNING-CREDENTIALS.txt 中的三项值分别写入同名 GitHub Actions Secrets。' \
              > "$RUNNER_TEMP/signing-backup/README.txt"
          fi

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"

      - name: Preserve verified formal release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.5-formal-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Preserve new signing identity for immediate private backup
        if: steps.signing.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.5-signing-backup-PRIVATE
          path: ${{ runner.temp }}/signing-backup/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish v5.5.5 before removing old releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TARGET_TAG="v5.5.5"
          MAIN_SHA="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$MAIN_SHA"

          gh release delete "$TARGET_TAG" --repo "$REPO" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TARGET_TAG" >/dev/null 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TARGET_TAG" "$MAIN_SHA" -m '天机 v5.5.5 正式版'
          git push origin "refs/tags/$TARGET_TAG"

          gh release create "$TARGET_TAG" \
            --repo "$REPO" \
            --verify-tag \
            --latest \
            --title '天机 v5.5.5 正式版' \
            --notes-file dist/RELEASE_NOTES.md \
            dist/Tianji-v5.5.5-release.apk \
            dist/Tianji-v5.5.5-SHA256.txt \
            dist/APK_VERIFY.txt \
            dist/APK_BADGING.txt

          gh release view "$TARGET_TAG" --repo "$REPO" \
            --json tagName,name,isDraft,isPrerelease,assets \
            --jq 'select(.tagName == "v5.5.5" and .isDraft == false and .isPrerelease == false and (.assets | length) >= 4)'

      - name: Delete every previous release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TARGET_TAG="v5.5.5"

          mapfile -t RELEASE_TAGS < <(
            gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName'
          )
          for tag in "${RELEASE_TAGS[@]}"; do
            [[ -z "$tag" || "$tag" == "$TARGET_TAG" ]] && continue
            gh release delete "$tag" --repo "$REPO" --yes
          done

          mapfile -t ALL_TAGS < <(
            git ls-remote --tags --refs origin \
              | awk '{sub("refs/tags/", "", $2); print $2}'
          )
          for tag in "${ALL_TAGS[@]}"; do
            [[ -z "$tag" || "$tag" == "$TARGET_TAG" ]] && continue
            git push origin ":refs/tags/$tag"
          done

          test "$(gh release list --repo "$REPO" --limit 100 --json tagName --jq 'length')" = 1
          test "$(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[0].tagName')" = "$TARGET_TAG"
          test "$(git ls-remote --tags --refs origin | wc -l | tr -d ' ')" = 1

      - name: Delete every non-default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          DEFAULT_BRANCH="$(gh api "repos/$REPO" --jq '.default_branch')"
          test "$DEFAULT_BRANCH" = main

          mapfile -t BRANCHES < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}'
          )
          for branch in "${BRANCHES[@]}"; do
            [[ -z "$branch" || "$branch" == "$DEFAULT_BRANCH" ]] && continue
            git push origin --delete "$branch"
          done

          REMAINING="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')"
          test "$REMAINING" = "$DEFAULT_BRANCH"
          echo "Only default branch remains: $DEFAULT_BRANCH"
