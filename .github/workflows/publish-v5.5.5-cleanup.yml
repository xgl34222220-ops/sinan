name: Publish Tianji v5.5.5 and clean repository

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: tianji-v5.5.5-formal-release
  cancel-in-progress: false

jobs:
  publish-and-clean:
    if: github.head_ref == 'ops/publish-v5.5.5-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Checkout verified main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore protected release signing key
        shell: bash
        env:
          TIANJI_KEYSTORE_BASE64: ${{ secrets.TIANJI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_BASE64"
          mkdir -p .signing
          printf '%s' "$TIANJI_KEYSTORE_BASE64" | base64 --decode > .signing/tianji-release.jks
          test -s .signing/tianji-release.jks

      - name: Test, lint and build signed formal APK
        shell: bash
        env:
          TIANJI_KEYSTORE_FILE: ${{ github.workspace }}/.signing/tianji-release.jks
          TIANJI_KEYSTORE_PASSWORD: ${{ secrets.TIANJI_KEYSTORE_PASSWORD }}
          TIANJI_KEY_ALIAS: ${{ secrets.TIANJI_KEY_ALIAS }}
          TIANJI_KEY_PASSWORD: ${{ secrets.TIANJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_PASSWORD"
          test -n "$TIANJI_KEY_ALIAS"
          test -n "$TIANJI_KEY_PASSWORD"
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "5.5.5"' app/build.gradle.kts
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tianji-v5.5.5-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs dist/Tianji-v5.5.5-release.apk \
            | tee dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging dist/Tianji-v5.5.5-release.apk \
            | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionCode='30'" dist/APK_BADGING.txt
          grep -q "versionName='5.5.5'" dist/APK_BADGING.txt
          sha256sum dist/Tianji-v5.5.5-release.apk > dist/Tianji-v5.5.5-SHA256.txt
          unzip -t dist/Tianji-v5.5.5-release.apk >/dev/null

      - name: Preserve verified formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.5-formal-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Delete previous releases and tags, then publish v5.5.5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TARGET_TAG="v5.5.5"
          MAIN_SHA="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$MAIN_SHA"

          mapfile -t RELEASE_TAGS < <(
            gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName'
          )
          for tag in "${RELEASE_TAGS[@]}"; do
            [[ -z "$tag" ]] && continue
            echo "Deleting old release: $tag"
            gh release delete "$tag" --repo "$REPO" --yes
          done

          mapfile -t ALL_TAGS < <(
            git ls-remote --tags --refs origin \
              | awk '{sub("refs/tags/", "", $2); print $2}'
          )
          for tag in "${ALL_TAGS[@]}"; do
            [[ -z "$tag" ]] && continue
            echo "Deleting old tag: $tag"
            git push origin ":refs/tags/$tag"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TARGET_TAG" "$MAIN_SHA" -m "天机 v5.5.5 正式版"
          git push origin "refs/tags/$TARGET_TAG"

          gh release create "$TARGET_TAG" \
            --repo "$REPO" \
            --verify-tag \
            --latest \
            --title '天机 v5.5.5 正式版' \
            --notes-file RELEASE_NOTES_v5.5.5.md \
            dist/Tianji-v5.5.5-release.apk \
            dist/Tianji-v5.5.5-SHA256.txt \
            dist/APK_VERIFY.txt \
            dist/APK_BADGING.txt

          gh release view "$TARGET_TAG" --repo "$REPO" --json tagName,name,isDraft,isPrerelease,assets

      - name: Delete every non-default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          DEFAULT_BRANCH="$(gh api "repos/$REPO" --jq '.default_branch')"
          test "$DEFAULT_BRANCH" = "main"
          mapfile -t BRANCHES < <(
            git ls-remote --heads origin \
              | awk '{sub("refs/heads/", "", $2); print $2}'
          )
          for branch in "${BRANCHES[@]}"; do
            [[ -z "$branch" || "$branch" == "$DEFAULT_BRANCH" ]] && continue
            echo "Deleting branch: $branch"
            git push origin --delete "$branch"
          done

          REMAINING="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')"
          test "$REMAINING" = "$DEFAULT_BRANCH"
          echo "Only default branch remains: $DEFAULT_BRANCH"
