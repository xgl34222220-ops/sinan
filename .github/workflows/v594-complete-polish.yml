name: Complete Tianji v5.9.4 UI Polish

on:
  push:
    branches:
      - feature/v5.9.4-ui-unification
    paths:
      - .github/workflows/v594-complete-polish.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.4-ui-unification
          fetch-depth: 0

      - name: Apply remaining App and Console polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def update(path, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              revised = transform(text)
              if revised == text:
                  raise SystemExit(f'no changes produced for {path}')
              p.write_text(revised, encoding='utf-8')

          def shell(text):
              text = text.replace(
                  'import androidx.compose.foundation.layout.height\n',
                  'import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n',
                  1,
              )
              text = text.replace('.height(58.dp)', '.heightIn(min = 58.dp)', 1)
              text = text.replace('.height(64.dp)', '.heightIn(min = 64.dp)', 1)
              text = text.replace('.height(48.dp)', '.heightIn(min = 48.dp)', 1)
              text = text.replace('.height(47.dp)', '.heightIn(min = 47.dp)', 1)
              return text
          update('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppShellV2.kt', shell)

          def ai_panel(text):
              marker = '''    val evaluation = remember(state.aiForecasts, state.aiProfileAudits) {
                  AiConsensusEngine.evaluateForecasts(state.aiForecasts, state.aiProfileAudits)
              }
          '''
              replacement = marker + '    var showAllStatuses by rememberSaveable { mutableStateOf(false) }\n'
              if marker not in text:
                  raise SystemExit('AI panel state marker not found')
              text = text.replace(marker, replacement, 1)
              pattern = re.compile(r'''            if \(state\.aiStatuses\.isNotEmpty\(\)\) \{.*?            \}\n\n            evaluation\.consensus''', re.S)
              block = '''            if (state.aiStatuses.isNotEmpty()) {
                  val statuses = state.aiStatuses.values.toList()
                  val running = statuses.count {
                      it.state == AiConnectionState.ANALYZING || it.state == AiConnectionState.TESTING
                  }
                  val failed = statuses.count { it.state == AiConnectionState.FAILED }
                  val completed = statuses.count { it.state == AiConnectionState.CONNECTED }
                  Spacer(Modifier.height(12.dp))
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clip(RoundedCornerShape(13.dp))
                          .background(colors.surfaceStrong)
                          .border(1.dp, colors.line, RoundedCornerShape(13.dp))
                          .padding(horizontal = 10.dp, vertical = 8.dp),
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text(
                          "运行 $running · 完成 $completed · 失败 $failed",
                          color = if (failed > 0) colors.red else colors.textSoft,
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.weight(1f),
                      )
                      if (statuses.size > 3) {
                          Text(
                              if (showAllStatuses) "收起" else "查看全部 ${statuses.size} 项",
                              color = colors.accent,
                              fontSize = 10.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier
                                  .clip(CircleShape)
                                  .clickable { showAllStatuses = !showAllStatuses }
                                  .padding(horizontal = 8.dp, vertical = 5.dp),
                          )
                      }
                  }
                  val visibleStatuses = if (showAllStatuses) statuses else statuses.take(3)
                  visibleStatuses.forEach { status ->
                      val tint = when (status.state) {
                          AiConnectionState.CONNECTED -> colors.green
                          AiConnectionState.FAILED -> colors.red
                          AiConnectionState.ANALYZING, AiConnectionState.TESTING -> colors.accent
                          else -> colors.amber
                      }
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(vertical = 5.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          Box(Modifier.size(7.dp).clip(CircleShape).background(tint))
                          Spacer(Modifier.width(8.dp))
                          Text(
                              status.message,
                              color = colors.textSoft,
                              fontSize = 11.sp,
                              maxLines = if (showAllStatuses) 2 else 1,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.weight(1f),
                          )
                          if (status.state == AiConnectionState.ANALYZING ||
                              status.state == AiConnectionState.TESTING
                          ) {
                              Text(
                                  "取消",
                                  color = colors.amber,
                                  fontSize = 10.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier
                                      .clip(CircleShape)
                                      .clickable { onCancel(status.profileId) }
                                      .padding(horizontal = 8.dp, vertical = 5.dp),
                              )
                          }
                      }
                  }
              }

              evaluation.consensus'''
              text, count = pattern.subn(block, text, count=1)
              if count != 1:
                  raise SystemExit(f'AI status block replacement count={count}')
              return text
          update('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt', ai_panel)

          def archive(text):
              text = text.replace(
                  'import androidx.compose.material3.Icon\n',
                  'import androidx.compose.material3.Icon\nimport androidx.compose.material3.OutlinedTextField\nimport androidx.compose.material3.OutlinedTextFieldDefaults\n',
                  1,
              )
              enum_marker = '''private enum class ArchiveSettlementFilter(val label: String) {
                  ALL("全部"),
                  PENDING("待开奖"),
                  HIT("已命中"),
                  MISSED("未命中"),
              }
          '''
              source_enum = enum_marker + '''
          private enum class ArchiveSourceFilter(val label: String) {
              ALL("全部来源"),
              CONSENSUS("AI 共识"),
              AI("独立 AI"),
              NATIVE("本地模型"),
          }
          '''
              if enum_marker not in text:
                  raise SystemExit('archive enum marker not found')
              text = text.replace(enum_marker, source_enum, 1)
              state_marker = '''    var settlementFilterName by rememberSaveable(state.lottery.apiKey) {
                  mutableStateOf(ArchiveSettlementFilter.ALL.name)
              }
          '''
              state_replacement = state_marker + '''    var sourceFilterName by rememberSaveable(state.lottery.apiKey) {
              mutableStateOf(ArchiveSourceFilter.ALL.name)
          }
          var periodQuery by rememberSaveable(state.lottery.apiKey) { mutableStateOf("") }
          '''
              if state_marker not in text:
                  raise SystemExit('archive state marker not found')
              text = text.replace(state_marker, state_replacement, 1)
              selected_marker = '''    val settlementFilter = ArchiveSettlementFilter.entries.firstOrNull {
                  it.name == settlementFilterName
              } ?: ArchiveSettlementFilter.ALL
          '''
              selected_replacement = selected_marker + '''    val sourceFilter = ArchiveSourceFilter.entries.firstOrNull {
              it.name == sourceFilterName
          } ?: ArchiveSourceFilter.ALL
          val periodNeedle = periodQuery.trim()
          '''
              if selected_marker not in text:
                  raise SystemExit('archive selected marker not found')
              text = text.replace(selected_marker, selected_replacement, 1)
              old_filters = '''    val consensusRecords = state.aiConsensusRecords.filter {
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit)
              }
              val aiRecords = state.aiRecords.filter {
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit)
              }
              val nativeRecords = state.records.filter {
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit)
              }
          '''
              new_filters = '''    val consensusRecords = state.aiConsensusRecords.filter {
              (sourceFilter == ArchiveSourceFilter.ALL || sourceFilter == ArchiveSourceFilter.CONSENSUS) &&
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit) &&
                  (periodNeedle.isEmpty() || it.targetPeriod.contains(periodNeedle, ignoreCase = true))
          }
          val aiRecords = state.aiRecords.filter {
              (sourceFilter == ArchiveSourceFilter.ALL || sourceFilter == ArchiveSourceFilter.AI) &&
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit) &&
                  (periodNeedle.isEmpty() || it.targetPeriod.contains(periodNeedle, ignoreCase = true))
          }
          val nativeRecords = state.records.filter {
              (sourceFilter == ArchiveSourceFilter.ALL || sourceFilter == ArchiveSourceFilter.NATIVE) &&
                  archiveMatchesFilter(settlementFilter, it.top6Hit, it.top7Hit) &&
                  (periodNeedle.isEmpty() || it.targetPeriod.contains(periodNeedle, ignoreCase = true))
          }
          '''
              if old_filters not in text:
                  raise SystemExit('archive record filter marker not found')
              text = text.replace(old_filters, new_filters, 1)
              pattern = re.compile(r'''        item\("archive-filters"\) \{.*?        \}\n\n        if \(consensusRecords''', re.S)
              controls = '''        item("archive-filters") {
                  Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = periodQuery,
                          onValueChange = { periodQuery = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          placeholder = { Text("搜索目标期，例如 20260805123") },
                          shape = RoundedCornerShape(14.dp),
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedBorderColor = colors.accent,
                              unfocusedBorderColor = colors.lineStrong,
                              focusedTextColor = colors.text,
                              unfocusedTextColor = colors.text,
                              focusedContainerColor = colors.surfaceStrong,
                              unfocusedContainerColor = colors.surfaceStrong,
                          ),
                      )
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .horizontalScroll(rememberScrollState()),
                          horizontalArrangement = Arrangement.spacedBy(7.dp),
                      ) {
                          ArchiveSourceFilter.entries.forEach { option ->
                              val active = option == sourceFilter
                              Text(
                                  option.label,
                                  color = if (active) colors.accent else colors.textSoft,
                                  fontSize = 11.sp,
                                  fontWeight = if (active) FontWeight.Bold else FontWeight.Medium,
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(if (active) colors.accentSoft else colors.surfaceStrong)
                                      .border(
                                          1.dp,
                                          if (active) colors.accent.copy(alpha = 0.24f) else colors.line,
                                          RoundedCornerShape(12.dp),
                                      )
                                      .clickable { sourceFilterName = option.name }
                                      .padding(horizontal = 12.dp, vertical = 8.dp),
                              )
                          }
                      }
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .horizontalScroll(rememberScrollState()),
                          horizontalArrangement = Arrangement.spacedBy(7.dp),
                      ) {
                          ArchiveSettlementFilter.entries.forEach { option ->
                              val active = option == settlementFilter
                              Text(
                                  option.label,
                                  color = if (active) colors.accent else colors.textSoft,
                                  fontSize = 11.sp,
                                  fontWeight = if (active) FontWeight.Bold else FontWeight.Medium,
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(12.dp))
                                      .background(if (active) colors.accentSoft else colors.surfaceStrong)
                                      .border(
                                          1.dp,
                                          if (active) colors.accent.copy(alpha = 0.24f) else colors.line,
                                          RoundedCornerShape(12.dp),
                                      )
                                      .clickable { settlementFilterName = option.name }
                                      .padding(horizontal = 12.dp, vertical = 8.dp),
                              )
                          }
                      }
                  }
              }

              if (consensusRecords'''
              text, count = pattern.subn(controls, text, count=1)
              if count != 1:
                  raise SystemExit(f'archive control replacement count={count}')
              return text
          update('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt', archive)

          def console(text):
              marker = "  label('logoutBtn','退出登录');label('runBtn','立即同步开奖与任务');"
              replacement = marker + "\n  const logoutButton=document.getElementById('logoutBtn');\n  logoutButton?.addEventListener('click',event=>{if(!confirm('确认退出天机控制台？')){event.preventDefault();event.stopImmediatePropagation()}},true);"
              if marker not in text:
                  raise SystemExit('console aria marker not found')
              return text.replace(marker, replacement, 1)
          update('server/app/console_v594.js', console)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Android
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Validate console JavaScript
        run: node --check server/app/console_v594.js

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate server
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v594-complete.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit completed polish and remove workflow
        run: |
          rm -- .github/workflows/v594-complete-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppShellV2.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt \
            server/app/console_v594.js \
            .github/workflows/v594-complete-polish.yml
          git commit -m "feat: complete v5.9.4 UI polish"
          git push origin HEAD:feature/v5.9.4-ui-unification
