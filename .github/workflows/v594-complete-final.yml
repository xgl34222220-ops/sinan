name: Final Tianji v5.9.4 Polish

on:
  push:
    branches:
      - feature/v5.9.4-ui-unification
    paths:
      - .github/workflows/v594-complete-final.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.4-ui-unification
          fetch-depth: 0

      - name: Apply final polish
        run: python3 tools/apply_v594_complete.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Android
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Validate JavaScript
        run: node --check server/app/console_v594.js

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate server
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v594-final-polish.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit final polish and clean migration files
        run: |
          rm -- tools/apply_v594_complete.py
          rm -- .github/workflows/v594-complete-polish.yml
          rm -- .github/workflows/v594-complete-polish-v2.yml
          rm -- .github/workflows/v594-complete-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppShellV2.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt \
            server/app/console_v594.js \
            tools/apply_v594_complete.py \
            .github/workflows/v594-complete-polish.yml \
            .github/workflows/v594-complete-polish-v2.yml \
            .github/workflows/v594-complete-final.yml
          git commit -m "feat: complete v5.9.4 UI polish"
          git push origin HEAD:feature/v5.9.4-ui-unification
