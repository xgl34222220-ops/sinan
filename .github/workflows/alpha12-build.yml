name: Build Sinan alpha12 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore alpha11 source and apply alpha12 patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties dist build.log
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8793741893/zip" \
            --output /tmp/alpha11-source.zip
          unzip -q /tmp/alpha11-source.zip -d .

          cat overlay/alpha12-parts/part* > /tmp/alpha12.patch.xz.b64
          echo '7343919aa6b6ca6739262a15f5cbf1787d3623a8be9169784bb63ae73a1808d9  /tmp/alpha12.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/alpha12.patch.xz.b64 > /tmp/alpha12.patch.xz
          echo 'ea0fe9f96a0290569a3a6df112e0dc42d5d387e5b432de17602be7f1bf060f09  /tmp/alpha12.patch.xz' | sha256sum -c -
          xz -dc /tmp/alpha12.patch.xz > /tmp/alpha12.patch
          echo 'fa5df5e222eee47e95fc6c8bbdaafd1ef3dd23c1336f4c0f8010f4054d4649c9  /tmp/alpha12.patch' | sha256sum -c -
          patch -p1 --forward --batch < /tmp/alpha12.patch

          test -f app/src/main/assets/box/dashboard/index.html
          test "$(grep -c 'setDomain("127.0.0.1")' app/src/main/java/io/github/xgl34222220/sinan/ui/screens/WebUiScreen.kt)" -eq 1
          test "$(grep -c 'fun testGroupLatencies' app/src/main/java/io/github/xgl34222220/sinan/SinanViewModel.kt)" -eq 1
          test "$(grep -c 'bottom = 112.dp' app/src/main/java/io/github/xgl34222220/sinan/ui/screens/PanelScreen.kt)" -ge 1

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'GRADLE_INIT'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.force(
                      'org.jetbrains.kotlin:kotlin-stdlib:1.9.24',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24',
                      'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  )
              }
          }
          GRADLE_INIT

          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Sinan-0.5.0-alpha12-release.apk
          sha256sum dist/Sinan-0.5.0-alpha12-release.apk > dist/Sinan-0.5.0-alpha12-SHA256.txt
          unzip -t dist/Sinan-0.5.0-alpha12-release.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-build-log-alpha12
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-reconstructed-source-alpha12
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-0.5.0-alpha12-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
