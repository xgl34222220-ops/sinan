name: Validate Tianji v5.9.4 UI

on:
  push:
    branches:
      - feature/v5.9.4-ui-unification
    paths:
      - .github/workflows/v594-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.4-ui-unification
          fetch-depth: 0

      - name: Apply final import fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt')
          text = path.read_text(encoding='utf-8')
          needle = 'import androidx.compose.foundation.shape.RoundedCornerShape\n'
          replacement = 'import androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\n'
          if 'import androidx.compose.foundation.shape.CircleShape\n' not in text:
              if needle not in text:
                  raise SystemExit('RoundedCornerShape import not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Android
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate server
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v594-ci.db
        run: |
          bash -n deploy/*.sh
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v
          cp .env.example .env
          docker compose config >/dev/null
          docker build --tag tianji-server-v594-ci server

      - name: Commit validated import and remove one-time workflow
        run: |
          rm -- .github/workflows/v594-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt \
            .github/workflows/v594-validate.yml
          git commit -m "fix: finalize and validate v5.9.4 UI"
          git push origin HEAD:feature/v5.9.4-ui-unification
