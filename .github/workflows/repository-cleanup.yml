name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: tianji-one-time-repository-cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete unused branches and old versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          keep_tag() {
            case "$1" in
              v5.9.3|v5.9.2|v5.9.1) return 0 ;;
              *) return 1 ;;
            esac
          }

          echo 'Collecting branches...'
          mapfile -t branches < <(
            gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name'
          )
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done

          echo 'Collecting releases...'
          mapfile -t releases < <(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | "\(.id)\t\(.tag_name)"'
          )
          for entry in "${releases[@]}"; do
            release_id="${entry%%$'\t'*}"
            tag="${entry#*$'\t'}"
            if keep_tag "$tag"; then
              echo "Keeping release: $tag"
              continue
            fi
            echo "Deleting release: $tag ($release_id)"
            gh api -X DELETE "repos/$GH_REPO/releases/$release_id"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done

          echo 'Removing orphaned old tags...'
          mapfile -t tags < <(
            gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name'
          )
          for tag in "${tags[@]}"; do
            if keep_tag "$tag"; then
              continue
            fi
            echo "Deleting tag: $tag"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
          done

          mapfile -t remaining_branches < <(
            gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name'
          )
          if [[ "${#remaining_branches[@]}" -ne 1 || "${remaining_branches[0]}" != "main" ]]; then
            printf 'Unexpected remaining branches:\n%s\n' "${remaining_branches[*]}" >&2
            exit 1
          fi

          unexpected_releases="$(
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' \
              | grep -Ev '^(v5\.9\.3|v5\.9\.2|v5\.9\.1)$' || true
          )"
          if [[ -n "$unexpected_releases" ]]; then
            printf 'Unexpected remaining releases:\n%s\n' "$unexpected_releases" >&2
            exit 1
          fi

          unexpected_tags="$(
            gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name' \
              | grep -Ev '^(v5\.9\.3|v5\.9\.2|v5\.9\.1)$' || true
          )"
          if [[ -n "$unexpected_tags" ]]; then
            printf 'Unexpected remaining tags:\n%s\n' "$unexpected_tags" >&2
            exit 1
          fi

          echo 'Repository cleanup completed.'
