name: Tianji Repository Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only main and latest three stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Resolving the latest three stable releases..."
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          jq -r '
            map(select(.draft == false and .prerelease == false))
            | sort_by(.published_at // .created_at)
            | reverse
            | .[:3]
            | .[].tag_name
          ' /tmp/releases.json > /tmp/keep-tags.txt

          keep_count="$(grep -cve '^$' /tmp/keep-tags.txt || true)"
          if [ "$keep_count" -ne 3 ]; then
            echo "Expected exactly three stable releases, found ${keep_count}. Refusing destructive cleanup."
            cat /tmp/keep-tags.txt || true
            exit 1
          fi

          echo "Keeping stable releases:"
          cat /tmp/keep-tags.txt

          echo "Deleting all other GitHub Releases..."
          jq -r '.[] | [.id, .tag_name] | @tsv' /tmp/releases.json |
          while IFS=$'\t' read -r release_id tag_name; do
            if grep -Fxq "$tag_name" /tmp/keep-tags.txt; then
              echo "KEEP release ${tag_name}"
            else
              echo "DELETE release ${tag_name} (${release_id})"
              gh api --method DELETE "repos/${REPOSITORY}/releases/${release_id}"
            fi
          done

          echo "Deleting all tags except the three kept stable versions..."
          gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/" --jq '.[].ref' |
          sed 's#^refs/tags/##' |
          while IFS= read -r tag_name; do
            [ -n "$tag_name" ] || continue
            if grep -Fxq "$tag_name" /tmp/keep-tags.txt; then
              echo "KEEP tag ${tag_name}"
            else
              echo "DELETE tag ${tag_name}"
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${tag_name}"
            fi
          done

          echo "Deleting all branches except main..."
          gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch_name; do
            [ -n "$branch_name" ] || continue
            if [ "$branch_name" = "main" ]; then
              echo "KEEP branch main"
            else
              echo "DELETE branch ${branch_name}"
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch_name}"
            fi
          done

          remaining_branches="$(gh api --paginate "repos/${REPOSITORY}/branches?per_page=100" --jq '.[].name')"
          remaining_releases="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '.[] | [.tag_name, .prerelease] | @tsv')"
          remaining_tags="$(gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/" --jq '.[].ref' | sed 's#^refs/tags/##')"

          {
            echo "## Repository cleanup completed"
            echo
            echo "### Remaining branches"
            echo '```'
            printf '%s\n' "$remaining_branches"
            echo '```'
            echo
            echo "### Remaining releases"
            echo '```'
            printf '%s\n' "$remaining_releases"
            echo '```'
            echo
            echo "### Remaining tags"
            echo '```'
            printf '%s\n' "$remaining_tags"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$remaining_branches" = "main"
          test "$(printf '%s\n' "$remaining_releases" | grep -cve '^$')" -eq 3
          test "$(printf '%s\n' "$remaining_tags" | grep -cve '^$')" -eq 3
