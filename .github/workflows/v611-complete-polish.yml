name: Tianji v6.1.1 Complete Polish

on:
  push:
    branches:
      - improve/v6.1.1-complete-polish
    paths:
      - .github/workflows/v611-complete-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: improve/v6.1.1-complete-polish
          fetch-depth: 0

      - name: Apply product, UI and delivery improvements
        run: |
          set -euo pipefail
          python tools/apply-v611-polish.py
          python tools/check-version-consistency.py
          python tools/check-ui-contract.py
          python -m compileall -q server/app server/tests

      - name: Commit generated improvements
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete v6.1.1 UI delivery and operations polish"
          git push origin HEAD:improve/v6.1.1-complete-polish
