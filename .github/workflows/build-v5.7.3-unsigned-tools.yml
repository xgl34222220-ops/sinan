name: Build Tianji v5.7.3 unsigned package

on:
  push:
    branches: [main]
    paths: [BUILD_V573_UNSIGNED_TRIGGER.txt]

permissions:
  contents: read

concurrency:
  group: tianji-v573-unsigned-tools
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.tianji.probabilitylab.nativev5"' app/build.gradle.kts
          grep -Fq 'versionCode = 40' app/build.gradle.kts
          grep -Fq 'versionName = "5.7.3"' app/build.gradle.kts
          grep -Fq '<string name="app_name">天机</string>' app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist/tools/lib
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Tianji-v5.7.3-nativev5-unsigned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" dist/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" dist/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dist/tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" dist/tools/lib/
          chmod +x dist/tools/apksigner dist/tools/zipalign dist/tools/aapt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging dist/Tianji-v5.7.3-nativev5-unsigned.apk | head -n 12 | tee dist/UNSIGNED_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev5'" dist/UNSIGNED_BADGING.txt
          grep -q "versionCode='40'" dist/UNSIGNED_BADGING.txt
          grep -q "versionName='5.7.3'" dist/UNSIGNED_BADGING.txt
          grep -q "application-label:'天机'" dist/UNSIGNED_BADGING.txt
          sha256sum dist/Tianji-v5.7.3-nativev5-unsigned.apk > dist/UNSIGNED_SHA256.txt
          git rev-parse HEAD > dist/SOURCE_SHA.txt

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: tianji-v5.7.3-unsigned-tools
          path: dist/
          retention-days: 2
          if-no-files-found: error
