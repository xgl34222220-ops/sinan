name: Build Sinan alpha11 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Reconstruct and build alpha11
        shell: bash
        run: |
          set -euo pipefail
          cat overlay/alpha11-ci-b64/part* > /tmp/alpha11-ci.sh.xz.b64
          base64 --decode /tmp/alpha11-ci.sh.xz.b64 > /tmp/alpha11-ci.sh.xz
          echo 'ab372a1c450131f8b82c283b7691906517a18d661443c6934d808aba130414b3  /tmp/alpha11-ci.sh.xz' | sha256sum -c -
          xz -dc /tmp/alpha11-ci.sh.xz > /tmp/alpha11-ci.sh
          echo 'ae1f11dd9917cad87a0b96f410aa512e2e3fa76c088499689ca37f9fadece039  /tmp/alpha11-ci.sh' | sha256sum -c -
          chmod +x /tmp/alpha11-ci.sh
          /tmp/alpha11-ci.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-build-log-alpha11
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-reconstructed-source-alpha11
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-0.5.0-alpha11-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
