name: Commit validated Tianji v5.5.8 patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply-v5.5.8.py
      - .github/workflows/apply-v5.5.8.yml
      - .github/workflows/commit-v5.5.8.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tianji-v5.5.8-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.5.8-stream-recovery
          fetch-depth: 0

      - name: Apply already validated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-v5.5.8.py
          rm -f .github/workflows/commit-v5.5.8.yml
          git diff --check
          grep -q 'versionName = "5.5.8"' app/build.gradle.kts
          grep -q '_tianji_stream_interrupted' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt
          grep -q 'AiErrorMessages.userFacing' app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt
          test ! -e .github/scripts/apply-v5.5.8.py
          test ! -e .github/workflows/apply-v5.5.8.yml
          test ! -e .github/workflows/commit-v5.5.8.yml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '天机 v5.5.8：断流恢复与过程卡片收口'
          git push origin HEAD:fix/v5.5.8-stream-recovery
