name: Publish Tianji v5.5.8 formal release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v5.5.8-formal.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: tianji-v5.5.8-formal-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout publication bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select clean v5.5.8 source commit
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_SHA="$(git rev-parse HEAD)"
          SOURCE_SHA="$(git rev-parse HEAD^)"
          printf 'BOOTSTRAP_SHA=%s\n' "$BOOTSTRAP_SHA" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
          git checkout --detach "$SOURCE_SHA"
          grep -q 'versionCode = 33' app/build.gradle.kts
          grep -q 'versionName = "5.5.8"' app/build.gradle.kts
          test -f RELEASE_NOTES_v5.5.8.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore protected formal signing backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .signing-backup .signing
          gh run download 30777002592 \
            --name Tianji-v5.5.5-signing-backup-PRIVATE \
            --dir .signing-backup
          test -s .signing-backup/tianji-release-v5.5.5.jks
          test -s .signing-backup/SIGNING-CREDENTIALS.txt
          cp .signing-backup/tianji-release-v5.5.5.jks .signing/tianji-release.jks

          while IFS='=' read -r KEY VALUE; do
            case "$KEY" in
              TIANJI_KEYSTORE_PASSWORD|TIANJI_KEY_ALIAS|TIANJI_KEY_PASSWORD)
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$GITHUB_ENV"
                ;;
            esac
          done < .signing-backup/SIGNING-CREDENTIALS.txt
          printf 'TIANJI_KEYSTORE_FILE=%s/.signing/tianji-release.jks\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Verify signing continuity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TIANJI_KEYSTORE_PASSWORD:-}"
          test -n "${TIANJI_KEY_ALIAS:-}"
          test -n "${TIANJI_KEY_PASSWORD:-}"
          keytool -list \
            -keystore "$TIANJI_KEYSTORE_FILE" \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc \
            -keystore "$TIANJI_KEYSTORE_FILE" \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" \
            -file .signing/tianji-release-cert.pem
          ACTUAL_CERT_SHA256="$(
            openssl x509 -in .signing/tianji-release-cert.pem -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          EXPECTED_CERT_SHA256='5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed'
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          printf 'SHA256 certificate digest: %s\n' "$ACTUAL_CERT_SHA256" > .signing/CERT_SHA256.txt

      - name: Test, lint and build signed formal APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleRelease

          mkdir -p dist
          APK='dist/Tianji-v5.5.8-release.apk'
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" | tee dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging "$APK" | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionCode='33'" dist/APK_BADGING.txt
          grep -q "versionName='5.5.8'" dist/APK_BADGING.txt
          cp .signing/CERT_SHA256.txt dist/SIGNING_CERT_SHA256.txt
          sha256sum "$APK" > dist/Tianji-v5.5.8-SHA256.txt
          unzip -t "$APK" >/dev/null

      - name: Create tag and formal GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin refs/tags/v5.5.8 >/dev/null 2>&1; then
            echo 'v5.5.8 tag already exists unexpectedly' >&2
            exit 1
          fi
          git tag -a v5.5.8 "$SOURCE_SHA" -m '天机 v5.5.8 正式版'
          git push origin v5.5.8
          gh release create v5.5.8 \
            --verify-tag \
            --title '天机 v5.5.8' \
            --notes-file RELEASE_NOTES_v5.5.8.md \
            dist/*

          ASSETS="$(gh release view v5.5.8 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.5.8-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.5.8-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.8-formal-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-time publication workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard "$BOOTSTRAP_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v5.5.8-formal.yml
          git commit -m 'chore: remove one-time v5.5.8 publication workflow'
          git push --force-with-lease="refs/heads/main:$BOOTSTRAP_SHA" origin HEAD:main
