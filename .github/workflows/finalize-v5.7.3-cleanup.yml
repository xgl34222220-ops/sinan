name: Finalize Tianji v5.7.3 and clean repository

on:
  push:
    branches: [main]
    paths: [FINALIZE_V573_TRIGGER.txt]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: tianji-v5.7.3-final-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_ARTIFACT_ID: '8881647069'
      EXPECTED_ALIGNED_SHA256: '2415333ed514df0db47b7866dc14aa2e0056e697206b714f8d08b5ff1e4c33a9'
      EXPECTED_PATCH_SHA256: 'a35f23da2e58e87329bc091cb1733ea32e7f6bef99f1a8c8751197a92de5155f'
      EXPECTED_APK_SHA256: '2b4aef83ef2c06f82a850179020121dcde12f5a6111e814c0173f70d36991e1d'
      EXPECTED_CERT_SHA256: '89125c40d4f9a88cf5847f34ef2a1506ad5bed093ef7ed7cbbe568b570738d12'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify permanent-signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v zstd >/dev/null
          rm -rf /tmp/tianji-build /tmp/tianji-release
          mkdir -p /tmp/tianji-build /tmp/tianji-release
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BUILD_ARTIFACT_ID}/zip" \
            > /tmp/tianji-build/artifact.zip
          unzip -q /tmp/tianji-build/artifact.zip -d /tmp/tianji-build/files
          TOOLS=/tmp/tianji-build/files/ci-signing-tools
          UNSIGNED=/tmp/tianji-build/files/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/tianji-build/Tianji-v5.7.3-nativev5-aligned.apk
          PATCH=/tmp/tianji-build/Tianji-v5.7.3-signed.zstpatch
          APK=/tmp/tianji-release/Tianji-v5.7.3-nativev5-release.apk
          test -s "$UNSIGNED"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          test -x "$TOOLS/aapt"
          test -s "$TOOLS/lib64/libc++.so"
          export LD_LIBRARY_PATH="$TOOLS/lib64"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/zipalign" -c -p 4 "$ALIGNED"
          echo "${EXPECTED_ALIGNED_SHA256}  ${ALIGNED}" | sha256sum -c -
          base64 -d release-staging/Tianji-v5.7.3-signed.zstpatch.b64 > "$PATCH"
          echo "${EXPECTED_PATCH_SHA256}  ${PATCH}" | sha256sum -c -
          zstd -q -d --patch-from="$ALIGNED" "$PATCH" -o "$APK"
          echo "${EXPECTED_APK_SHA256}  ${APK}" | sha256sum -c -
          unzip -t "$APK" >/dev/null
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/tianji-release/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' /tmp/tianji-release/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' /tmp/tianji-release/APK_VERIFY.txt
          grep -qi "$EXPECTED_CERT_SHA256" /tmp/tianji-release/APK_VERIFY.txt
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/tianji-release/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev5'" /tmp/tianji-release/APK_BADGING.txt
          grep -q "versionCode='40'" /tmp/tianji-release/APK_BADGING.txt
          grep -q "versionName='5.7.3'" /tmp/tianji-release/APK_BADGING.txt
          grep -q "application-label:'天机'" /tmp/tianji-release/APK_BADGING.txt
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" 'Tianji-v5.7.3-nativev5-release.apk' > /tmp/tianji-release/Tianji-v5.7.3-nativev5-SHA256.txt
          printf '%s\n' "$EXPECTED_CERT_SHA256" > /tmp/tianji-release/SIGNING_CERT_SHA256.txt

      - name: Produce clean latest-only source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          cat > .github/workflows/android-ci.yml <<'EOF'
          name: Tianji Android CI

          on:
            push:
              branches: [main, 'feature/**']
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Set up Android SDK
                  uses: android-actions/setup-android@v3

                - name: Set up Gradle 8.13
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.13'

                - name: Install Android SDK 36
                  shell: bash
                  run: |
                    set -euo pipefail
                    yes | sdkmanager --licenses >/dev/null || true
                    sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

                - name: Unit tests, lint and builds
                  run: >-
                    gradle --no-daemon --stacktrace
                    :app:testDebugUnitTest
                    :app:testReleaseUnitTest
                    :app:lintDebug
                    :app:assembleDebug
                    :app:assembleRelease

                - name: Upload Debug APK and reports
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: Tianji-CI-${{ github.sha }}
                    path: |
                      app/build/outputs/apk/debug/app-debug.apk
                      app/build/reports/tests/
                      app/build/reports/lint-results-debug.html
                    if-no-files-found: warn
                    retention-days: 14
          EOF
          rm -rf release-staging ci-nativev5
          find . -maxdepth 1 -type d -name 'ci-v*' -exec rm -rf {} +
          find . -maxdepth 1 -type f -name 'RELEASE_NOTES_v*.md' ! -name 'RELEASE_NOTES_v5.7.3.md' -delete
          find . -maxdepth 1 -type f \( -name '*TRIGGER*.txt' -o -name 'VERIFY_*.txt' \) -delete
          rm -f \
            .github/workflows/build-v5.7.3-unsigned-tools.yml \
            .github/workflows/watch-v5.7.3-unsigned-build.yml \
            .github/workflows/finalize-v5.7.3-cleanup.yml
          git add -A
          git commit -m 'release: keep only Tianji v5.7.3 latest source'
          git push origin HEAD:main
          echo "CLEAN_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/tianji-release/RELEASE_SOURCE_SHA.txt

      - name: Create Tianji v5.7.3 formal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          gh release delete v5.7.3 --cleanup-tag --yes >/dev/null 2>&1 || true
          git push origin :refs/tags/v5.7.3 >/dev/null 2>&1 || true
          git tag -a v5.7.3 "$CLEAN_SOURCE_SHA" -m '天机 v5.7.3'
          git push origin refs/tags/v5.7.3
          gh release create v5.7.3 \
            --verify-tag \
            --title '天机 v5.7.3' \
            --notes-file RELEASE_NOTES_v5.7.3.md \
            /tmp/tianji-release/*
          ASSETS="$(gh release view v5.7.3 --json assets --jq '.assets[].name')"
          for asset in \
            Tianji-v5.7.3-nativev5-release.apk \
            Tianji-v5.7.3-nativev5-SHA256.txt \
            SIGNING_CERT_SHA256.txt \
            APK_VERIFY.txt \
            APK_BADGING.txt \
            RELEASE_SOURCE_SHA.txt; do
            grep -Fxq "$asset" <<<"$ASSETS"
          done

      - name: Delete every older release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = 'v5.7.3' ] && continue
            gh release delete "$tag" --cleanup-tag --yes || true
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = 'v5.7.3' ] && continue
            git push origin ":refs/tags/${tag}" || true
          done < <(git ls-remote --tags origin 'refs/tags/*' | awk '{print $2}' | sed -e 's#refs/tags/##' -e 's/\^{}//' | sort -u)

      - name: Close old pull requests and delete every non-main branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r number; do
            [ -z "$number" ] && continue
            gh pr close "$number" || true
          done < <(gh pr list --state open --limit 100 --json number --jq '.[].number')
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = 'main' ] && continue
            git push origin --delete "$branch" || true
          done < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')

      - name: Cancel redundant runs and delete temporary artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh run cancel "$run_id" || true
          done < <(gh run list --limit 100 --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId')
          sleep 3
          while IFS= read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
          done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')

      - name: Verify latest-only repository state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          test "$RELEASES" = 'v5.7.3'
          BRANCHES="$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)"
          test "$BRANCHES" = 'main'
          TAGS="$(git ls-remote --tags origin 'refs/tags/*' | awk '{print $2}' | sed -e 's#refs/tags/##' -e 's/\^{}//' | sort -u)"
          test "$TAGS" = 'v5.7.3'
          gh release view v5.7.3 --json isDraft,isPrerelease,tagName,name --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v5.7.3" and .name == "天机 v5.7.3")' >/dev/null
