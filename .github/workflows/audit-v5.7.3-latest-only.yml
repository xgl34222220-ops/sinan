name: Audit Tianji v5.7.3 latest-only state

on:
  pull_request:
    branches: [main]
    paths: [AUDIT_V573_STATE.txt]

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit releases, tags and branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASES="$(gh release list --repo '${{ github.repository }}' --limit 100 --json tagName --jq '.[].tagName' | sort -u)"
          TAGS="$(git ls-remote --tags 'https://github.com/${{ github.repository }}.git' 'refs/tags/*' | awk '{print $2}' | sed -e 's#refs/tags/##' -e 's/\^{}//' | sort -u)"
          BRANCHES="$(git ls-remote --heads 'https://github.com/${{ github.repository }}.git' | awk '{sub("refs/heads/", "", $2); print $2}' | sort)"
          printf 'RELEASES<<EOF\n%s\nEOF\n' "$RELEASES"
          printf 'TAGS<<EOF\n%s\nEOF\n' "$TAGS"
          printf 'BRANCHES<<EOF\n%s\nEOF\n' "$BRANCHES"
          test "$RELEASES" = 'v5.7.3'
          test "$TAGS" = 'v5.7.3'
          test "$(printf '%s\n' "$BRANCHES" | grep -vcE '^(main|tmp/observe-v573-final)$')" = '0'
          gh release view v5.7.3 --repo '${{ github.repository }}' --json isDraft,isPrerelease,tagName,name,assets --jq '{isDraft,isPrerelease,tagName,name,assets:[.assets[].name]}'
