name: Apply Telegram Full Events

on:
  push:
    branches: ['feature/v5.9.9-telegram-full-events-v2']
    paths:
      - 'tools/apply_telegram_full_events.py'
      - 'tools/fix_telegram_event_queue.py'
      - 'server/app/telegram_events.py'
      - 'server/tests/test_telegram_events.py'
      - '.github/workflows/apply-telegram-full-events.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-telegram-full-events
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.9-telegram-full-events-v2
          fetch-depth: 0

      - name: Apply integration
        run: |
          python tools/apply_telegram_full_events.py
          python tools/fix_telegram_event_queue.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate backend
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-telegram-events.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            server/app/service.py \
            server/app/telegram_alerts.py \
            server/app/telegram_events.py
          if git diff --cached --quiet; then
            echo 'No generated integration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep Telegram event queue draining'
          git push origin HEAD:feature/v5.9.9-telegram-full-events-v2
