name: Build Sinan alpha10 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and build alpha10
        shell: bash
        run: |
          set -euo pipefail
          cat overlay/alpha10-ci-b64/part00 > /tmp/alpha10-ci.sh.xz.b64
          base64 --decode /tmp/alpha10-ci.sh.xz.b64 > /tmp/alpha10-ci.sh.xz
          echo '548c093bc36afac9bbff527e26db3b2b6ca0bcada2d8df099cafc64216ece6ea  /tmp/alpha10-ci.sh.xz' | sha256sum -c -
          xz -dc /tmp/alpha10-ci.sh.xz > /tmp/alpha10-ci.sh
          echo 'd26f8a47801be36d1f8d1754695691721df8ec6feb74ffb00101bc46c9e7732d  /tmp/alpha10-ci.sh' | sha256sum -c -
          chmod +x /tmp/alpha10-ci.sh
          /tmp/alpha10-ci.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-build-log-alpha10
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-reconstructed-source-alpha10
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-0.5.0-alpha10-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
