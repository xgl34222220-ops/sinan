name: Apply Tianji v5.5.5 auditable chat

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.5.5-auditable-fast-output
          fetch-depth: 0

      - name: Apply v5.5.5 patches
        run: |
          set -euo pipefail
          python3 scripts/apply_v5_5_5_audit_output.py
          python3 scripts/apply_v5_5_5_conversation_window.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-v5.5.5-auditable-chat.yml \
            scripts/apply_v5_5_5_audit_output.py \
            scripts/apply_v5_5_5_conversation_window.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            README.md \
            RELEASE_NOTES_v5.5.5.md \
            app/build.gradle.kts \
            app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiConversationTimeline.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiExplanationPolicy.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/Screens.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiConversationTimelineTest.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiExplanationPolicyTest.kt
          git add -u -- .github/workflows scripts
          git commit -m '天机 v5.5.5：中文多因素审计与可视化分析对话'
          git push origin HEAD:fix/v5.5.5-auditable-fast-output
