name: Apply Tianji Android cloud integration once

on:
  push:
    branches: [feature/cloud-backend-v1]
    paths:
      - .github/workflows/apply-cloud-app-integration-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-backend-v1
          fetch-depth: 0

      - name: Patch AppController cloud fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt")
          text = path.read_text()

          replacements = [
              (
                  "import com.tianji.probabilitylab.nativev4.data.LotteryApi\n",
                  "import com.tianji.probabilitylab.nativev4.data.CloudForecastApi\n"
                  "import com.tianji.probabilitylab.nativev4.data.LotteryApi\n",
              ),
              (
                  "    private val api = LotteryApi()\n",
                  "    private val api = LotteryApi()\n"
                  "    private val cloudApi = CloudForecastApi()\n",
              ),
              (
                  "        api.cancelActiveRequests()\n        remoteAiAnalyzer.cancelActiveRequests()\n",
                  "        api.cancelActiveRequests()\n"
                  "        cloudApi.cancelActiveRequests()\n"
                  "        remoteAiAnalyzer.cancelActiveRequests()\n",
              ),
              (
                  "        val aiRecords = database.loadAiForecasts(lottery)\n"
                  "        val learningRecords = database.loadSettledAiForecastsForLearning(lottery)\n",
                  "        val localAiRecords = database.loadAiForecasts(lottery)\n"
                  "        val cloudAiRecords = runCatching { cloudApi.fetchForecasts(lottery) }\n"
                  "            .getOrDefault(emptyList())\n"
                  "        val aiRecords = (cloudAiRecords + localAiRecords)\n"
                  "            .distinctBy { record ->\n"
                  "                listOf(\n"
                  "                    record.profileId,\n"
                  "                    record.targetPeriod,\n"
                  "                    record.model,\n"
                  "                    record.position.toString(),\n"
                  "                ).joinToString(\"|\")\n"
                  "            }\n"
                  "            .sortedByDescending { it.createdAtEpochMs }\n"
                  "        val learningRecords = database.loadSettledAiForecastsForLearning(lottery)\n",
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"Expected AppController fragment not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-cloud-app-integration-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt
          git commit -m "feat(android): sync cloud forecasts with local fallback"
          git push origin HEAD:feature/cloud-backend-v1
