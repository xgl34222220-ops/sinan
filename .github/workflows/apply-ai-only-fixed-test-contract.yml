name: Apply AI-only fixed235780 test contract

on: push

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: align AI-only fixed235780 tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/ai-only-fixed235780-output
      - name: Align legacy Telegram tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/tests/test_telegram_events.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'self.assertIn("01、02、03、04、05、06", message)',
              'self.assertIn("02、03、05、07、08、10", message)',
          )
          s = s.replace(
              '            self.settle(target, 10)\n',
              '            self.settle(target, 4)\n',
              1,
          )
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-ai-only-fixed-test-contract.yml').unlink()
          PY
          git config user.name xgl34222220-ops
          git config user.email xgl34222220@gmail.com
          git add -A
          git commit -m 'test: align Telegram AI expectations with fixed235780'
          git push origin hotfix/ai-only-fixed235780-output
