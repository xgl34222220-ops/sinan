name: Patch server AI ensemble

on:
  push:
    branches: ['fix/server-ai-position-collapse-v2']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[server-ai-ensemble-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-ai-position-collapse-v2
          fetch-depth: 0
      - name: Apply server AI ensemble patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_server_ai_ensemble.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/app/ai.py server/app/service.py
          git commit -m 'fix(server): replace first-position-prone AI with anonymous ensemble [server-ai-ensemble-patched]'
          git push origin HEAD:fix/server-ai-position-collapse-v2
