name: Bump Adaptive Service Version

on:
  push:
    branches:
      - fix/adaptive-deploy-proof
    paths:
      - tools/bump_adaptive_service_version.py
      - .github/workflows/bump-adaptive-service-version.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/adaptive-deploy-proof
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Bump service version
        run: python tools/bump_adaptive_service_version.py
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run server tests
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Commit business files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add server/app/service.py server/tests/test_adaptive_deploy_version.py
          git diff --cached --check
          git commit -m "fix(server): 标记自适应原子修复版本 1.7.1"
          git push origin HEAD:fix/adaptive-deploy-proof
