name: Tianji v5.9.0 Release Dispatcher

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: tianji-v5.9.0-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 59 && github.event.comment.body == '/release-v5.9.0')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          if gh release view v5.9.0 --repo "$REPO" >/dev/null 2>&1; then
            echo 'v5.9.0 is already published.'
            exit 0
          fi
          ACTIVE="$(
            gh run list --repo "$REPO" --workflow release.yml --branch main \
              --json status --limit 20 \
              --jq '[.[] | select(.status != "completed")] | length'
          )"
          if [[ "$ACTIVE" != "0" ]]; then
            echo 'A release workflow is already active.'
            exit 0
          fi
          gh workflow run release.yml --repo "$REPO" --ref main
          echo 'Tianji v5.9.0 release workflow dispatched.'
