name: Apply Tianji v5.9.9 Telegram Alerts

on:
  push:
    branches: ['feature/v5.9.9-telegram-alerts']
    paths:
      - 'tools/apply_v599_telegram_alerts.py'
      - 'server/app/telegram_alerts.py'
      - 'server/tests/test_telegram_alerts.py'
      - '.github/workflows/v599-telegram-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-v599-telegram-alerts
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.9-telegram-alerts
          fetch-depth: 0

      - name: Apply Telegram integration
        run: python tools/apply_v599_telegram_alerts.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate cloud backend
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v599.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            .env.example \
            server/app/config.py \
            server/app/push_alerts.py
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deliver prediction alerts through Telegram'
          git push origin HEAD:feature/v5.9.9-telegram-alerts
