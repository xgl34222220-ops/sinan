name: Apply console and Telegram fast path

on:
  push:
    branches:
      - feature/fixed-pool-235780-position
    paths:
      - tools/apply-console-telegram-fast.py
      - .github/workflows/apply-console-telegram-fast.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/fixed-pool-235780-position
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Apply console and Telegram patch
        run: python tools/apply-console-telegram-fast.py

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Compile backend
        run: python -m compileall -q server/app

      - name: Run backend tests
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-console-telegram.db
        run: python -m unittest discover -s server/tests -v

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add server/app/console_v594.js server/app/console_v3.py server/app/service.py server/app/push_alerts.py server/app/telegram_events.py server/app/telegram_alerts.py server/tests/test_telegram_events.py server/tests/test_console_delivery_simplification.py
          git commit -m 'feat(server): simplify console and prioritize alerts'
          git rm tools/apply-console-telegram-fast.py .github/workflows/apply-console-telegram-fast.yml
          git commit -m 'chore: remove console Telegram patch helpers'
          git push origin HEAD:feature/fixed-pool-235780-position
