name: Apply chat markdown rendering fix

on:
  push:
    branches: [feature/v5.5.6-early-result]
    paths:
      - .github/workflows/apply-chat-markdown-rendering.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v5.5.6-early-result

      - name: Add lightweight Markdown renderer
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/tianji/probabilitylab/nativev4/ui/ChatMarkdownText.kt <<'KOTLIN'
          package com.tianji.probabilitylab.nativev4.ui

          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.TextUnit

          private val headingPattern = Regex("""^\s{0,3}(#{1,6})\s+(.+)$""")
          private val bulletPattern = Regex("""^\s*[-*+]\s+(.+)$""")
          private val quotePattern = Regex("""^\s*>\s?(.*)$""")
          private val horizontalRulePattern = Regex("""^\s*(?:-{3,}|\*{3,}|_{3,})\s*$""")

          @Composable
          internal fun ChatMarkdownText(
              text: String,
              color: Color,
              fontSize: TextUnit,
              lineHeight: TextUnit,
              modifier: Modifier = Modifier,
          ) {
              val rendered = remember(text) { parseChatMarkdown(text) }
              Text(
                  text = rendered,
                  color = color,
                  fontSize = fontSize,
                  lineHeight = lineHeight,
                  fontWeight = FontWeight.Normal,
                  modifier = modifier,
              )
          }

          internal fun parseChatMarkdown(raw: String): AnnotatedString = buildAnnotatedString {
              val lines = raw.replace("\r\n", "\n").replace('\r', '\n').split('\n')
              lines.forEachIndexed { index, line ->
                  appendMarkdownLine(line)
                  if (index != lines.lastIndex) append('\n')
              }
          }

          private fun AnnotatedString.Builder.appendMarkdownLine(line: String) {
              if (horizontalRulePattern.matches(line)) {
                  append("────────────")
                  return
              }

              val heading = headingPattern.matchEntire(line)
              if (heading != null) {
                  withStyle(SpanStyle(fontWeight = FontWeight.Bold)) {
                      appendInlineMarkdown(heading.groupValues[2])
                  }
                  return
              }

              val quote = quotePattern.matchEntire(line)
              if (quote != null) {
                  append("▍ ")
                  withStyle(SpanStyle(fontStyle = FontStyle.Italic)) {
                      appendInlineMarkdown(quote.groupValues[1])
                  }
                  return
              }

              val bullet = bulletPattern.matchEntire(line)
              if (bullet != null) {
                  append("• ")
                  appendInlineMarkdown(bullet.groupValues[1])
                  return
              }

              appendInlineMarkdown(line)
          }

          private fun AnnotatedString.Builder.appendInlineMarkdown(source: String) {
              var index = 0
              while (index < source.length) {
                  when {
                      source[index] == '\\' && index + 1 < source.length -> {
                          append(source[index + 1])
                          index += 2
                      }
                      source.startsWith("**", index) || source.startsWith("__", index) -> {
                          val marker = source.substring(index, index + 2)
                          val end = source.indexOf(marker, index + 2)
                          if (end >= index + 2) {
                              withStyle(SpanStyle(fontWeight = FontWeight.Bold)) {
                                  append(source.substring(index + 2, end))
                              }
                              index = end + 2
                          } else {
                              // Streaming output may temporarily end after an opening marker.
                              // Hide the incomplete marker instead of flashing raw asterisks.
                              index += 2
                          }
                      }
                      source[index] == '`' -> {
                          val end = source.indexOf('`', index + 1)
                          if (end > index + 1) {
                              withStyle(SpanStyle(fontFamily = FontFamily.Monospace)) {
                                  append(source.substring(index + 1, end))
                              }
                              index = end + 1
                          } else {
                              index++
                          }
                      }
                      source[index] == '*' || source[index] == '_' -> {
                          val marker = source[index]
                          val end = source.indexOf(marker, index + 1)
                          if (end > index + 1) {
                              withStyle(SpanStyle(fontStyle = FontStyle.Italic)) {
                                  append(source.substring(index + 1, end))
                              }
                              index = end + 1
                          } else {
                              append(marker)
                              index++
                          }
                      }
                      source[index] == '[' -> {
                          val labelEnd = source.indexOf(']', index + 1)
                          val urlStart = if (labelEnd >= 0) source.indexOf('(', labelEnd + 1) else -1
                          val urlEnd = if (urlStart == labelEnd + 1) source.indexOf(')', urlStart + 1) else -1
                          if (labelEnd > index && urlStart == labelEnd + 1 && urlEnd > urlStart) {
                              withStyle(SpanStyle(fontWeight = FontWeight.Medium)) {
                                  append(source.substring(index + 1, labelEnd))
                              }
                              index = urlEnd + 1
                          } else {
                              append(source[index])
                              index++
                          }
                      }
                      else -> {
                          append(source[index])
                          index++
                      }
                  }
              }
          }
          KOTLIN

          mkdir -p app/src/test/java/com/tianji/probabilitylab/nativev4/ui
          cat > app/src/test/java/com/tianji/probabilitylab/nativev4/ui/ChatMarkdownTextTest.kt <<'KOTLIN'
          package com.tianji.probabilitylab.nativev4.ui

          import androidx.compose.ui.text.font.FontWeight
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ChatMarkdownTextTest {
              @Test
              fun boldMarkersAreRenderedWithoutRawAsterisks() {
                  val rendered = parseChatMarkdown("**④ 号码 9**\n**注意：** 不承诺必中")
                  assertEquals("④ 号码 9\n注意： 不承诺必中", rendered.text)
                  assertTrue(rendered.spanStyles.any { it.item.fontWeight == FontWeight.Bold })
              }

              @Test
              fun blockSyntaxBecomesReadablePlainStructure() {
                  val rendered = parseChatMarkdown("- 最近20期5次\n> 仅代表历史相对频次\n---")
                  assertEquals("• 最近20期5次\n▍ 仅代表历史相对频次\n────────────", rendered.text)
              }

              @Test
              fun unfinishedStreamingBoldMarkerDoesNotFlashStars() {
                  val rendered = parseChatMarkdown("当前结果：**号码 9")
                  assertEquals("当前结果：号码 9", rendered.text)
              }
          }
          KOTLIN

          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AiChatDialog.kt')
          text = path.read_text()
          old = '''            Text(
              visible,
              color = if (message.content.isBlank()) colors.textDim else colors.textSoft,
              fontSize = 15.sp,
              lineHeight = 23.sp,
              fontWeight = FontWeight.Normal,
          )'''
          new = '''            ChatMarkdownText(
              text = visible,
              color = if (message.content.isBlank()) colors.textDim else colors.textSoft,
              fontSize = 15.sp,
              lineHeight = 23.sp,
          )'''
          if old not in text:
              raise SystemExit('AI reply Text block not found; refusing an unsafe replacement')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit verified source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AiChatDialog.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/ChatMarkdownText.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ui/ChatMarkdownTextTest.kt
          git commit -m 'fix(chat): render AI Markdown without raw markers'
          git push origin HEAD:feature/v5.5.6-early-result
