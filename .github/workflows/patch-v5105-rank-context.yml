name: Patch v5.10.5 rank context

on:
  push:
    branches: ['fix/v5.10.5-ai-rank-context']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v5105-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.10.5-ai-rank-context
          fetch-depth: 0
      - name: Apply v5.10.5 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v5105_rank_context.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt \
                  app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatArchiveStore.kt \
                  app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt \
                  app/build.gradle.kts
          git commit -m 'fix(ai): isolate rank turns and verify numeric facts [v5105-patched]'
          git push origin HEAD:fix/v5.10.5-ai-rank-context
