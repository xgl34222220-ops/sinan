name: Fix AI Model Regex Escaping

on:
  push:
    branches:
      - feature/ai-compatible-auto-recovery

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[regex-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-compatible-auto-recovery
          fetch-depth: 0

      - name: Repair Kotlin raw regex strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = [i for i, line in enumerate(lines) if 'val marker = Regex(' in line and 'available' in line]
          split = [i for i, line in enumerate(lines) if '.split(Regex(' in line and '[,，、;；]' in line]
          if len(marker) != 1 or len(split) != 1:
              raise SystemExit(f'regex repair anchors invalid: marker={marker}, split={split}')
          lines[marker[0]] = '    val marker = Regex("""(?i)(?:可用模型|available\\s+models?)\\s*[:：]""").find(text) ?: return emptyList()'
          lines[split[0]] = '        .split(Regex("""\\s+/\\s+|[,，、;；]"""))'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/fix-ai-regex-escaping.yml
          git diff --check

      - name: Commit regex repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt
          git add -u -- .github/workflows/fix-ai-regex-escaping.yml
          git diff --cached --check
          git commit -m "fix(android): use raw strings for model regex [regex-fixed]"
          git push origin HEAD:feature/ai-compatible-auto-recovery
