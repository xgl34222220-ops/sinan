name: Diagnose Tianji v5.7.2 release

on:
  push:
    branches: [main]
    paths: [DIAG_V572_RELEASE_TRIGGER.txt]

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inventory all Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-v572
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > ci-v572/ARTIFACT_PAGES.json
          jq '[.[].artifacts[] | {id,name,expired,created_at,expires_at,size_in_bytes,workflow_run}]' \
            ci-v572/ARTIFACT_PAGES.json > ci-v572/ALL_ARTIFACTS.json
          jq '[.[] | select(.expired | not)]' \
            ci-v572/ALL_ARTIFACTS.json > ci-v572/ALL_NON_EXPIRED_ARTIFACTS.json
          jq '[.[] | select(((.name | ascii_downcase) | test("sign|keystore|backup|credential|release-key|jks")))]' \
            ci-v572/ALL_ARTIFACTS.json > ci-v572/POTENTIAL_SIGNING_ARTIFACTS.json
          jq '[.[] | select(.id == 8842385591)]' \
            ci-v572/ALL_ARTIFACTS.json > ci-v572/EXPIRED_BACKUP_REFERENCE.json
          BACKUP_NAME="$(jq -r '.[0].name // empty' ci-v572/EXPIRED_BACKUP_REFERENCE.json)"
          jq --arg name "$BACKUP_NAME" \
            '[.[] | select((.expired | not) and (.name == $name))]' \
            ci-v572/ALL_ARTIFACTS.json > ci-v572/NON_EXPIRED_SAME_BACKUP_NAME.json

          gh run list --workflow recover-publish-v5.7.2.yml --limit 5 \
            --json databaseId,status,conclusion,event,headSha,url,createdAt \
            > ci-v572/RECOVERY_RUNS.json || true
          RECOVERY_ID="$(jq -r '.[0].databaseId // empty' ci-v572/RECOVERY_RUNS.json)"
          if [[ -n "$RECOVERY_ID" ]]; then
            gh run view "$RECOVERY_ID" --json databaseId,status,conclusion,event,headSha,url,jobs \
              > ci-v572/RECOVERY_DETAIL.json
            if [[ "$(jq -r '.status' ci-v572/RECOVERY_DETAIL.json)" == completed && \
                  "$(jq -r '.conclusion' ci-v572/RECOVERY_DETAIL.json)" != success ]]; then
              gh run view "$RECOVERY_ID" --log-failed > ci-v572/RECOVERY_FAILED_LOG.txt || true
            fi
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            ci-v572/ARTIFACT_PAGES.json \
            ci-v572/ALL_ARTIFACTS.json \
            ci-v572/ALL_NON_EXPIRED_ARTIFACTS.json \
            ci-v572/POTENTIAL_SIGNING_ARTIFACTS.json \
            ci-v572/EXPIRED_BACKUP_REFERENCE.json \
            ci-v572/NON_EXPIRED_SAME_BACKUP_NAME.json \
            ci-v572/RECOVERY_RUNS.json
          for file in ci-v572/RECOVERY_DETAIL.json ci-v572/RECOVERY_FAILED_LOG.txt; do
            [[ -f "$file" ]] && git add -- "$file"
          done
          git commit -m 'ci: record Tianji v5.7.2 artifact inventory'
          git push origin HEAD:main
