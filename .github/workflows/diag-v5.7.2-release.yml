name: Diagnose Tianji v5.7.2 release

on:
  push:
    branches: [main]
    paths: [DIAG_V572_RELEASE_TRIGGER.txt]

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record release workflow state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-v572
          gh run list --workflow publish-v5.7.2.yml --limit 5 \
            --json databaseId,status,conclusion,event,headSha,url,createdAt \
            > ci-v572/PUBLISH_RUNS.json || true
          gh run list --workflow recover-publish-v5.7.2.yml --limit 5 \
            --json databaseId,status,conclusion,event,headSha,url,createdAt \
            > ci-v572/RECOVERY_RUNS.json || true
          gh run list --workflow release.yml --limit 10 \
            --json databaseId,status,conclusion,event,headSha,url,createdAt \
            > ci-v572/SIGNED_RELEASE_RUNS.json || true

          PUBLISH_ID="$(jq -r '.[0].databaseId // empty' ci-v572/PUBLISH_RUNS.json)"
          if [[ -n "$PUBLISH_ID" ]]; then
            gh run view "$PUBLISH_ID" --json databaseId,status,conclusion,event,headSha,url,jobs \
              > ci-v572/PUBLISH_DETAIL.json
            if [[ "$(jq -r '.status' ci-v572/PUBLISH_DETAIL.json)" == completed && \
                  "$(jq -r '.conclusion' ci-v572/PUBLISH_DETAIL.json)" != success ]]; then
              gh run view "$PUBLISH_ID" --log-failed > ci-v572/PUBLISH_FAILED_LOG.txt || true
            fi
          fi

          RECOVERY_ID="$(jq -r '.[0].databaseId // empty' ci-v572/RECOVERY_RUNS.json)"
          if [[ -n "$RECOVERY_ID" ]]; then
            gh run view "$RECOVERY_ID" --json databaseId,status,conclusion,event,headSha,url,jobs \
              > ci-v572/RECOVERY_DETAIL.json
            if [[ "$(jq -r '.status' ci-v572/RECOVERY_DETAIL.json)" == completed && \
                  "$(jq -r '.conclusion' ci-v572/RECOVERY_DETAIL.json)" != success ]]; then
              gh run view "$RECOVERY_ID" --log-failed > ci-v572/RECOVERY_FAILED_LOG.txt || true
            fi
          fi

          RELEASE_ID="$(jq -r '[.[] | select(.headSha != "")][0].databaseId // empty' ci-v572/SIGNED_RELEASE_RUNS.json)"
          if [[ -n "$RELEASE_ID" ]]; then
            gh run view "$RELEASE_ID" --json databaseId,status,conclusion,event,headSha,url,jobs \
              > ci-v572/SIGNED_RELEASE_DETAIL.json
            if [[ "$(jq -r '.status' ci-v572/SIGNED_RELEASE_DETAIL.json)" == completed && \
                  "$(jq -r '.conclusion' ci-v572/SIGNED_RELEASE_DETAIL.json)" != success ]]; then
              gh run view "$RELEASE_ID" --log-failed > ci-v572/SIGNED_RELEASE_FAILED_LOG.txt || true
            fi
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v572/PUBLISH_RUNS.json ci-v572/RECOVERY_RUNS.json ci-v572/SIGNED_RELEASE_RUNS.json
          for file in \
            ci-v572/PUBLISH_DETAIL.json ci-v572/PUBLISH_FAILED_LOG.txt \
            ci-v572/RECOVERY_DETAIL.json ci-v572/RECOVERY_FAILED_LOG.txt \
            ci-v572/SIGNED_RELEASE_DETAIL.json ci-v572/SIGNED_RELEASE_FAILED_LOG.txt; do
            [[ -f "$file" ]] && git add -- "$file"
          done
          git commit -m 'ci: record Tianji v5.7.2 release diagnostics'
          git push origin HEAD:main
