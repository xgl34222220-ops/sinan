name: Build Sinan Ledger alpha1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and restore source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source/ledger-alpha1.tar.xz.b64 > /tmp/sinan-ledger-alpha1.tar.xz
          echo 'a6fc781868cf5332ee3a74190a9ec1492f6730aab1ef41fb685769e63c5c5b96  /tmp/sinan-ledger-alpha1.tar.xz' | sha256sum -c -
          rm -rf app build.gradle settings.gradle gradle.properties
          tar -xJf /tmp/sinan-ledger-alpha1.tar.xz -C .
          grep -q "applicationId 'io.github.xgl34222220.sinanledger'" app/build.gradle
          grep -q 'class PaymentNotificationListener' app/src/main/java/io/github/xgl34222220/sinanledger/service/PaymentNotificationListener.kt
          grep -q "org.jetbrains.kotlin.plugin.compose.*2.4.0" build.gradle
          grep -q 'versionName .0.1.0-alpha1.' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sinan-Ledger-0.1.0-alpha1.apk
          sha256sum dist/Sinan-Ledger-0.1.0-alpha1.apk > dist/Sinan-Ledger-0.1.0-alpha1-SHA256.txt
          unzip -t dist/Sinan-Ledger-0.1.0-alpha1.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha1-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha1-source
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
            README.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-0.1.0-alpha1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
