name: Build Sinan Ledger alpha2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and audit alpha2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties README.md dist build.log
          base64 --decode source/ledger-alpha2.tar.xz.b64 > /tmp/sinan-ledger-alpha2.tar.xz
          echo 'ff115b748bd3719318b83239e36182873e00fc7a9123ae8127379682fe144efe  /tmp/sinan-ledger-alpha2.tar.xz' | sha256sum -c -
          tar -xJf /tmp/sinan-ledger-alpha2.tar.xz -C .

          grep -q "versionName '0.1.0-alpha2'" app/build.gradle
          grep -q 'miuix-ui-android:0.9.3' app/build.gradle
          grep -q 'miuix-preference-android:0.9.3' app/build.gradle
          grep -q 'miuix-icons-android:0.9.3' app/build.gradle
          grep -q 'miuix-squircle-android:0.9.3' app/build.gradle
          ! grep -q 'androidx.compose.material3:material3' app/build.gradle

          UI_FILE=app/src/main/java/io/github/xgl34222220/sinanledger/ui/LedgerApp.kt
          THEME_FILE=app/src/main/java/io/github/xgl34222220/sinanledger/ui/theme/SinanLedgerTheme.kt
          grep -q 'top.yukonga.miuix.kmp.basic.Scaffold' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.basic.TopAppBar' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.basic.FloatingNavigationBar' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.basic.Card' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.basic.BasicComponent' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.preference.SwitchPreference' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.preference.ArrowPreference' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.overlay.OverlayDialog' "$UI_FILE"
          grep -q 'top.yukonga.miuix.kmp.basic.TextField' "$UI_FILE"
          grep -q 'ThemeController' "$THEME_FILE"
          ! grep -q 'androidx.compose.material3' "$UI_FILE"
          ! grep -q 'androidx.compose.material3' "$THEME_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sinan-Ledger-0.1.0-alpha2.apk
          sha256sum dist/Sinan-Ledger-0.1.0-alpha2.apk > dist/Sinan-Ledger-0.1.0-alpha2-SHA256.txt
          unzip -tq dist/Sinan-Ledger-0.1.0-alpha2.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha2-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha2-source
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
            README.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-0.1.0-alpha2
          path: dist/*
          if-no-files-found: error
          retention-days: 30
