name: Build Sinan Ledger alpha1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore alpha1 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties dist build.log
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8811035962/zip" \
            --output /tmp/ledger-alpha1-source.zip
          unzip -q -o /tmp/ledger-alpha1-source.zip -d .
          rm -rf app/build
          python - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/io/github/xgl34222220/sinanledger/ui/LedgerApp.kt")
          source = path.read_text(encoding="utf-8")
          old = "Modifier.padding(horizontal = 12.dp, top = 4.dp)"
          new = "Modifier.padding(start = 12.dp, top = 4.dp, end = 12.dp)"
          if old not in source:
              raise SystemExit("Expected SectionLabel padding expression not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          grep -q "applicationId 'io.github.xgl34222220.sinanledger'" app/build.gradle
          grep -q 'class PaymentNotificationListener' app/src/main/java/io/github/xgl34222220/sinanledger/service/PaymentNotificationListener.kt
          grep -q "org.jetbrains.kotlin.plugin.compose.*2.4.0" build.gradle
          grep -q 'versionName .0.1.0-alpha1.' app/build.gradle
          grep -q 'padding(start = 12.dp, top = 4.dp, end = 12.dp)' app/src/main/java/io/github/xgl34222220/sinanledger/ui/LedgerApp.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' --channel=3
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sinan-Ledger-0.1.0-alpha1.apk
          sha256sum dist/Sinan-Ledger-0.1.0-alpha1.apk > dist/Sinan-Ledger-0.1.0-alpha1-SHA256.txt
          unzip -t dist/Sinan-Ledger-0.1.0-alpha1.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha1-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-alpha1-source-fixed
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
            README.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-Ledger-0.1.0-alpha1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
