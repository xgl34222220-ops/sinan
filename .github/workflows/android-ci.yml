name: Tianji Android CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-free-chat-cleanup:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/fix/v5.10.2-free-chat' &&
      !contains(github.event.head_commit.message, '[free-chat-cleaned]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.10.2-free-chat
          fetch-depth: 0

      - name: Clean generated patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_free_chat_patch_v5102.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt
          git commit -m 'fix(ai): clean free chat transport arguments [free-chat-cleaned]'
          git push origin HEAD:fix/v5.10.2-free-chat

  verify:
    if: github.ref != 'refs/heads/fix/v5.10.2-free-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate shell and release workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/*.sh tools/*.sh
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/release.yml')"

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Upload Debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
