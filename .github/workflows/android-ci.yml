name: Tianji Android CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Prepare temporary release signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-signing-tools/lib ci-signing-tools/lib64
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" ci-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" ci-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" ci-signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" ci-signing-tools/lib/
          LIBCPP="$(find "$ANDROID_SDK_ROOT" -type f -name 'libc++.so' | head -n 1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" ci-signing-tools/lib64/libc++.so
          chmod +x ci-signing-tools/apksigner ci-signing-tools/zipalign ci-signing-tools/aapt

      - name: Upload APKs, tools and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            ci-signing-tools/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 2
