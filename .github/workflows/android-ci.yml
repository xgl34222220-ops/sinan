name: Tianji Android CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch_chat_message_actions:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply generated message UI patch
        run: |
          awk '/python3 - <<'\''PY'\''/{capture=1; next} /^          PY$/{capture=0} capture' \
            .github/workflows/patch-chat-message-actions.yml \
            | sed 's/^          //' > /tmp/patch_chat_actions.py
          python3 /tmp/patch_chat_actions.py

      - name: Commit patch to PR branch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AiChatDialog.kt
          git commit -m "feat: add copy read-aloud and repeat chat actions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Upload Debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
