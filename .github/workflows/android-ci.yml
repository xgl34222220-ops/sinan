name: Tianji Android CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending chat archive fix
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=.github/patches/chat_archive_v2.patch.gz.b64
          if [ ! -f "$PATCH_FILE" ]; then
            PATCH_FILE=.github/patches/chat_archive.patch.gz.b64
          fi
          if [ ! -f "$PATCH_FILE" ]; then
            echo 'No pending chat archive patch.'
            exit 0
          fi
          base64 --decode "$PATCH_FILE" | gzip --decompress > /tmp/chat_archive.patch
          git apply --check /tmp/chat_archive.patch
          git apply /tmp/chat_archive.patch
          git show f43095bdd677d9c96a79c1034376e4561bea0c75:.github/workflows/android-ci.yml > .github/workflows/android-ci.yml
          rm -f .github/patches/chat_archive.patch.gz.b64
          rm -f .github/patches/chat_archive_v2.patch.gz.b64
          rm -f .github/patches/trigger.txt
          rm -f .github/workflows/source-export.yml
          rm -f .github/workflows/apply-chat-archive.yml
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Commit verified chat archive fix
        if: github.event_name == 'push' && github.ref_name == 'feature/v5.5.6-early-result'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No pending source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): 可选具体模型并按目标期持久化对话候选'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
