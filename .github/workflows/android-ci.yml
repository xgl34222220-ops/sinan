name: Tianji Android CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianji-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate shell, release and UI contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/*.sh tools/*.sh
          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].each { |path| YAML.load_file(path) }"
          python tools/check-version-consistency.py
          python tools/check-ui-contract.py

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Render Compose preview screenshot baselines
        run: gradle --no-daemon --stacktrace :app:updateDebugScreenshotTest

      - name: Upload Debug APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tianji-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/src/screenshotTestDebug/reference/
            app/build/reports/screenshotTest/
          if-no-files-found: warn
          retention-days: 14
