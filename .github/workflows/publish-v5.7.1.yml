name: Publish Tianji v5.7.1 formal release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES_v5.7.1.md
      - .github/workflows/publish-v5.7.1.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: tianji-v5.7.1-formal-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate formal release target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test "$VERSION" = 5.7.1
          test "$VERSION_CODE" = 38
          test -f RELEASE_NOTES_v5.7.1.md
          grep -q 'displayName = "大数据规律"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          grep -q 'displayName = "走势分析"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          grep -q 'displayName = "综合预测"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          test -f server/app/web_console.py
          test -f server/tests/test_sync_regressions.py

      - name: Resolve immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --tags --force
          if git ls-remote --exit-code --tags origin refs/tags/v5.7.1 >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n1 v5.7.1)"
          else
            git tag -a v5.7.1 "$GITHUB_SHA" -m '天机 v5.7.1 正式版'
            git push origin refs/tags/v5.7.1
            TAG_COMMIT="$GITHUB_SHA"
          fi
          test "$(git show v5.7.1:app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n1)" = 5.7.1
          test "$(git show v5.7.1:app/build.gradle.kts | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n1)" = 38
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"

      - name: Dispatch signed release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow release.yml --commit "$TAG_COMMIT" --event workflow_dispatch --limit 1 --json databaseId,status --jq '.[0].databaseId // empty')"
          if [[ -z "$RUN_ID" ]]; then
            gh workflow run release.yml --ref v5.7.1
          fi
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow release.yml --commit "$TAG_COMMIT" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 3
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify formal release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v5.7.1 --json tagName,isDraft,isPrerelease,targetCommitish \
            --jq 'select(.tagName == "v5.7.1" and (.isDraft | not) and (.isPrerelease | not)) | .tagName' \
            | grep -Fxq v5.7.1
          ASSETS="$(gh release view v5.7.1 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.7.1-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.7.1-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"
          mkdir -p /tmp/tianji-v571
          gh release download v5.7.1 -p SIGNING_CERT_SHA256.txt -D /tmp/tianji-v571
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' \
            /tmp/tianji-v571/SIGNING_CERT_SHA256.txt

      - name: Record completed formal release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-v571
          cat > ci-v571/RELEASE_STATUS.txt <<EOF
          status=success
          version_name=5.7.1
          version_code=38
          tag=v5.7.1
          release_run_id=${RELEASE_RUN_ID}
          source_sha=${TAG_COMMIT}
          signing_cert_sha256=5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed
          apk=Tianji-v5.7.1-release.apk
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -f .github/workflows/publish-v5.7.1.yml
          rm -f ci-v571/RELEASE_RUNS.json ci-v571/RELEASE_RUN_DETAIL.json ci-v571/RELEASE_FAILED_LOG.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v571/RELEASE_STATUS.txt
          git rm --ignore-unmatch -- \
            .github/workflows/publish-v5.7.1.yml \
            ci-v571/RELEASE_RUNS.json \
            ci-v571/RELEASE_RUN_DETAIL.json \
            ci-v571/RELEASE_FAILED_LOG.txt
          git commit -m 'chore: record verified Tianji v5.7.1 formal release'
          git push origin HEAD:main
