name: Tianji Manual Server Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "只校验，或真正部署到 Production"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy
      ref:
        description: "要部署的远端分支（正式环境通常为 main）"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: tianji-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Validate deployment assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/*.sh tools/*.sh
          docker compose config --quiet
          python -m compileall -q server/app
          echo "Validated ref: $(git rev-parse HEAD)"

  deploy:
    if: ${{ inputs.mode == 'deploy' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.TIANJI_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.TIANJI_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.TIANJI_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.TIANJI_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.TIANJI_DEPLOY_PATH || '/opt/tianji' }}
      DEPLOY_REF: ${{ inputs.ref }}
    steps:
      - name: Require protected deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing TIANJI_DEPLOY_HOST" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing TIANJI_DEPLOY_USER" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing TIANJI_DEPLOY_SSH_KEY" >&2; exit 1; }
          case "$DEPLOY_REF" in
            *[!A-Za-z0-9._/-]*|'') echo "Unsafe deployment ref" >&2; exit 1 ;;
          esac

      - name: Configure ephemeral SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tianji_deploy_key
          chmod 600 ~/.ssh/tianji_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          printf -v remote_script '%q ' bash -s -- "$DEPLOY_PATH" "$DEPLOY_REF"
          ssh \
            -i ~/.ssh/tianji_deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_script" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          DEPLOY_REF="$2"
          cd "$DEPLOY_PATH"
          test -d .git || { echo "Not a git checkout: $DEPLOY_PATH" >&2; exit 1; }
          test -z "$(git status --porcelain)" || {
            echo "Deployment checkout has local changes; refusing to overwrite them." >&2
            git status --short
            exit 1
          }
          git fetch --prune origin "$DEPLOY_REF"
          git switch "$DEPLOY_REF"
          git pull --ff-only origin "$DEPLOY_REF"
          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
              echo "Tianji health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Tianji health check failed after deploy" >&2
          docker compose logs --tail=120 api worker >&2 || true
          exit 1
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/tianji_deploy_key
