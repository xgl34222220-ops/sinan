name: Validate Tianji v5.9.6 Bottom Navigation

on:
  push:
    branches:
      - hotfix/v5.9.6-bottom-nav-cloud-sources
    paths:
      - tools/apply_v596_correct_hotfix.py
      - .github/workflows/v596-bottom-nav-cloud-sources.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/v5.9.6-bottom-nav-cloud-sources
          fetch-depth: 0

      - name: Fetch helper branch
        run: git fetch origin hotfix/v5.9.6-chat-and-cloud-sources

      - name: Apply focused UI fix
        run: python3 tools/apply_v596_correct_hotfix.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run complete Android validation
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppShellV2.kt
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt
          git add -f app/src/main/java/com/tianji/probabilitylab/nativev4/data/CloudForecastApi.kt
          git commit -m "fix: prevent AI bottom nav clipping and split cloud sources"
          git push origin HEAD:hotfix/v5.9.6-bottom-nav-cloud-sources
