name: Finalize Tianji v5.9.4 Console

on:
  push:
    branches:
      - feature/v5.9.4-ui-unification
    paths:
      - .github/workflows/v594-js-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.4-ui-unification
          fetch-depth: 0

      - name: Prevent diagnostic observer feedback loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/app/console_v594.js')
          text = path.read_text(encoding='utf-8')
          old = "    rows.sort((a,b)=>(weight[a.dataset.severity]??3)-(weight[b.dataset.severity]??3)).forEach(row=>list.appendChild(row));"
          new = "    const sorted=[...rows].sort((a,b)=>(weight[a.dataset.severity]??3)-(weight[b.dataset.severity]??3));\n    if(sorted.some((row,index)=>row!==rows[index]))sorted.forEach(row=>list.appendChild(row));"
          if old not in text:
              raise SystemExit('diagnostic sort statement not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check server/app/console_v594.js

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate server regressions
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v594-final.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit final console fix and remove workflow
        run: |
          rm -- .github/workflows/v594-js-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/app/console_v594.js .github/workflows/v594-js-finalize.yml
          git commit -m "fix: stabilize v5.9.4 console interactions"
          git push origin HEAD:feature/v5.9.4-ui-unification
