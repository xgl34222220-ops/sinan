name: Apply chat page polish

on:
  push:
    branches:
      - ui/chat-page-polish-v5.9.10
    paths:
      - tools/apply-chat-page-polish.py
      - .github/workflows/apply-chat-page-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/chat-page-polish-v5.9.10
          fetch-depth: 0

      - name: Apply focused Compose changes
        run: python3 tools/apply-chat-page-polish.py

      - name: Remove one-shot migration files
        run: |
          rm -f tools/apply-chat-page-polish.py
          rm -f .github/workflows/apply-chat-page-polish.yml

      - name: Commit polished chat page
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ui: polish chat page and remove excess blank space'
          git push origin HEAD:ui/chat-page-polish-v5.9.10
