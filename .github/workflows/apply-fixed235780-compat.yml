name: Apply fixed235780 compat

on: push

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply fixed235780 compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/fixed235780-runtime-guard
      - name: Apply compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/app/fixed_target_runtime_guard.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'f"固定目标{fixed_target_bridge.TARGET_LABEL}，只预测十个名次谁更可能进入2/3/5/7/8/10。"',
              'f"固定目标六码{fixed_target_bridge.TARGET_LABEL}，只预测十个名次谁更可能进入2/3/5/7/8/10。"',
          )
          s = s.replace(
              'strategy_name = f"ai_fixed_{fixed_target_bridge.TARGET_LABEL}_stable_position_{selected.position + 1}"',
              'strategy_name = f"ai_fixed_{fixed_target_bridge.TARGET_LABEL}_position_{selected.position + 1}"',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('server/tests/test_fixed_target_runtime_guard.py')
          s = p.read_text(encoding='utf-8')
          old = '    def setUp(self) -> None:\n        now = int(time.time() * 1000)'
          new = '    def setUp(self) -> None:\n        telegram_events.initialize()\n        now = int(time.time() * 1000)'
          if old not in s:
              raise SystemExit('setUp marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/apply-fixed235780-compat.yml').unlink()
          PY
          git config user.name xgl34222220-ops
          git config user.email xgl34222220@gmail.com
          git add -A
          git commit -m 'fix: align fixed235780 guard with regression contracts'
          git push origin hotfix/fixed235780-runtime-guard
