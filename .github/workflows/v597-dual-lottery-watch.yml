name: Validate Tianji v5.9.7 Dual Lottery Watch

on:
  push:
    branches:
      - feature/v5.9.7-dual-lottery-miss-watch
    paths:
      - tools/apply_v597_dual_lottery_watch.py
      - .github/workflows/v597-dual-lottery-watch.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.7-dual-lottery-miss-watch
          fetch-depth: 0

      - name: Apply focused migration
        run: python3 tools/apply_v597_dual_lottery_watch.py

      - name: Validate console JavaScript
        run: node --check server/app/console_v594.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Android
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate server
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-v597-ci.db
        run: |
          python -m pip install -r server/requirements.txt
          python -m compileall -q server/app
          python -m unittest discover -s server/tests -v

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt \
            server/app/admin_insights.py \
            server/app/console_v594.js \
            server/app/console_v594.css \
            server/tests/test_prediction_miss_watch.py
          git commit -m "feat: preload both lotteries and add three-miss alerts"
          git push origin HEAD:feature/v5.9.7-dual-lottery-miss-watch
