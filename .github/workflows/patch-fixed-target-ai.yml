name: Patch fixed target AI

on:
  push:
    branches:
      - feature/fixed-pool-235780-position
    paths:
      - .github/workflows/patch-fixed-target-ai.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/fixed-pool-235780-position
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_fixed_target_ai.py
      - name: Commit changes and clean helper files
        run: |
          set -euo pipefail
          git config user.name xgl34222220-ops
          git config user.email xgl34222220@gmail.com
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/ContinualRemoteAiAnalyzer.kt
          git commit -m 'feat: aim app AI directly at fixed 235780 target'
          git rm .github/workflows/patch-fixed-target-ai.yml tools/patch_fixed_target_ai.py
          git commit -m 'chore: remove temporary fixed target patch helpers'
          git push origin HEAD:feature/fixed-pool-235780-position
