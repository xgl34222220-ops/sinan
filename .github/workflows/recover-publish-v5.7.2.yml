name: Recover and publish Tianji v5.7.2

on:
  push:
    branches: [main]
    paths: [RECOVER_PUBLISH_V572_TRIGGER.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: tianji-v5.7.2-recovery-publish
  cancel-in-progress: false

jobs:
  recover-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v4
        with:
          ref: v5.7.2
          fetch-depth: 0

      - name: Download protected signing backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .signing-backup .signing
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8842385591/zip" \
            > .signing-backup.zip
          unzip -q .signing-backup.zip -d .signing-backup
          test -s .signing-backup/tianji-release-v5.5.5.jks
          test -s .signing-backup/SIGNING-CREDENTIALS.txt
          cp .signing-backup/tianji-release-v5.5.5.jks .signing/tianji-release.jks
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          allowed = {
              'TIANJI_KEYSTORE_PASSWORD',
              'TIANJI_KEY_ALIAS',
              'TIANJI_KEY_PASSWORD',
          }
          for raw in Path('.signing-backup/SIGNING-CREDENTIALS.txt').read_text().splitlines():
              if not raw or '=' not in raw:
                  continue
              key, value = raw.split('=', 1)
              if key not in allowed:
                  continue
              print(f'::{"add-mask"}::{value}')
              marker = f'__TIANJI_{key}__'
              print(f'{key}<<{marker}')
              print(value)
              print(marker)
          PY
          rm -rf .signing-backup .signing-backup.zip

      - name: Verify restored signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TIANJI_KEYSTORE_PASSWORD"
          test -n "$TIANJI_KEY_ALIAS"
          test -n "$TIANJI_KEY_PASSWORD"
          keytool -list \
            -keystore .signing/tianji-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc \
            -keystore .signing/tianji-release.jks \
            -storepass "$TIANJI_KEYSTORE_PASSWORD" \
            -alias "$TIANJI_KEY_ALIAS" \
            -file .signing/tianji-release-cert.pem
          ACTUAL_CERT_SHA256="$(
            openssl x509 -in .signing/tianji-release-cert.pem -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          test "$ACTUAL_CERT_SHA256" = '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed'
          printf 'SHA256 certificate digest: %s\n' "$ACTUAL_CERT_SHA256" \
            > .signing/CERT_SHA256.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build signed formal APK
        shell: bash
        env:
          TIANJI_KEYSTORE_FILE: ${{ github.workspace }}/.signing/tianji-release.jks
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test "$VERSION" = 5.7.2
          test "$VERSION_CODE" = 39
          test "$GITHUB_REF_NAME" = main
          gradle --no-daemon --stacktrace \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease
          mkdir -p dist
          APK="dist/Tianji-v${VERSION}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify --verbose --print-certs "$APK" | tee dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' \
            dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            dump badging "$APK" | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionCode='39'" dist/APK_BADGING.txt
          grep -q "versionName='5.7.2'" dist/APK_BADGING.txt
          cp .signing/CERT_SHA256.txt dist/SIGNING_CERT_SHA256.txt
          sha256sum "$APK" > dist/Tianji-v5.7.2-SHA256.txt
          unzip -t "$APK" >/dev/null

      - name: Publish and verify GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.7.2 >/dev/null 2>&1; then
            gh release upload v5.7.2 dist/* --clobber
            gh release edit v5.7.2 \
              --title '天机 v5.7.2' \
              --notes-file RELEASE_NOTES_v5.7.2.md \
              --draft=false \
              --prerelease=false
          else
            gh release create v5.7.2 \
              --verify-tag \
              --title '天机 v5.7.2' \
              --notes-file RELEASE_NOTES_v5.7.2.md \
              dist/*
          fi
          ASSETS="$(gh release view v5.7.2 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.7.2-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.7.2-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"

      - name: Record verified formal release and clean temporary diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_SOURCE_SHA="$(git rev-list -n1 v5.7.2)"
          git checkout main
          git pull --ff-only origin main
          mkdir -p ci-v572
          cat > ci-v572/RELEASE_STATUS.txt <<EOF
          status=success
          version_name=5.7.2
          version_code=39
          tag=v5.7.2
          source_sha=${RELEASE_SOURCE_SHA}
          signing_cert_sha256=5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed
          apk=Tianji-v5.7.2-release.apk
          signing_source=protected_artifact_8842385591
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -f \
            .github/workflows/recover-publish-v5.7.2.yml \
            .github/workflows/publish-v5.7.2.yml \
            .github/workflows/diag-v5.7.2-release.yml \
            RECOVER_PUBLISH_V572_TRIGGER.txt \
            PUBLISH_V572_TRIGGER.txt \
            DIAG_V572_RELEASE_TRIGGER.txt \
            ci-v572/PUBLISH_RUNS.json \
            ci-v572/PUBLISH_DETAIL.json \
            ci-v572/PUBLISH_FAILED_LOG.txt \
            ci-v572/RECOVERY_RUNS.json \
            ci-v572/RECOVERY_DETAIL.json \
            ci-v572/RECOVERY_FAILED_LOG.txt \
            ci-v572/SIGNED_RELEASE_RUNS.json \
            ci-v572/SIGNED_RELEASE_DETAIL.json \
            ci-v572/SIGNED_RELEASE_FAILED_LOG.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v572/RELEASE_STATUS.txt
          git rm --ignore-unmatch -- \
            .github/workflows/recover-publish-v5.7.2.yml \
            .github/workflows/publish-v5.7.2.yml \
            .github/workflows/diag-v5.7.2-release.yml \
            RECOVER_PUBLISH_V572_TRIGGER.txt \
            PUBLISH_V572_TRIGGER.txt \
            DIAG_V572_RELEASE_TRIGGER.txt \
            ci-v572/PUBLISH_RUNS.json \
            ci-v572/PUBLISH_DETAIL.json \
            ci-v572/PUBLISH_FAILED_LOG.txt \
            ci-v572/RECOVERY_RUNS.json \
            ci-v572/RECOVERY_DETAIL.json \
            ci-v572/RECOVERY_FAILED_LOG.txt \
            ci-v572/SIGNED_RELEASE_RUNS.json \
            ci-v572/SIGNED_RELEASE_DETAIL.json \
            ci-v572/SIGNED_RELEASE_FAILED_LOG.txt
          git commit -m 'chore: record verified Tianji v5.7.2 formal release'
          git push origin HEAD:main
