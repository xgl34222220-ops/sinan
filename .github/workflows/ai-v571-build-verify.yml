name: Verify Tianji AI independence v5.7.1

on:
  push:
    branches:
      - fix/ai-true-independence-v5.7.1
    paths-ignore:
      - ci-v571/**
      - ai-v571-*.log
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-ai-v571-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-true-independence-v5.7.1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run Android verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            2>&1 | tee ai-v571-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write verification report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-v571
          code='${{ steps.verify.outputs.exit_code }}'
          if [[ "$code" == '0' ]]; then
            status='success'
            summary='AI isolation tests, Debug/Release unit tests, Android Lint, Debug APK and R8 Release APK passed.'
            rm -f ci-v571/ERROR_SUMMARY.txt ci-v571/BUILD_TAIL.txt
          else
            status='failure'
            summary="Android verification exited with code ${code:-unknown}."
            grep -E '(^e: |error: |FAILURE:|What went wrong:|Compilation error|Unresolved reference|Type mismatch|Missing class)' \
              ai-v571-build.log | tail -n 240 > ci-v571/ERROR_SUMMARY.txt || true
            tail -n 340 ai-v571-build.log > ci-v571/BUILD_TAIL.txt
          fi
          {
            echo "status=$status"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "formal_ai_input=raw_history_only"
            echo "independent_chat_native_position_leak=removed"
            echo "independent_chat_native_statistics=removed"
            echo "$summary"
          } > ci-v571/STATUS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-v571
          git commit -m "ci: record AI independence v5.7.1 verification ($status)" || true
          git push origin HEAD:fix/ai-true-independence-v5.7.1
