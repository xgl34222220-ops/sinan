name: Apply Adaptive Online Learning

on:
  push:
    branches:
      - feat/adaptive-online-learning
    paths:
      - tools/apply_adaptive_online_learning.py
      - .github/workflows/apply-adaptive-online-learning.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/adaptive-online-learning
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply adaptive learning migration
        run: python tools/apply_adaptive_online_learning.py
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile server
        run: python -m compileall -q server/app server/tests
      - name: Run complete server test suite
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Commit adaptive learning implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add server/app server/tests
          git diff --cached --check
          git commit -m "feat(server): 根据结算结果在线学习策略权重"
          git push origin HEAD:feat/adaptive-online-learning
