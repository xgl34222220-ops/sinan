name: Fix Legacy Settlement Override

on:
  push:
    branches:
      - fix/remove-legacy-settlement-override
    paths:
      - tools/fix_legacy_settlement_override.py
      - .github/workflows/fix-legacy-settlement-override.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remove-legacy-settlement-override
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python tools/fix_legacy_settlement_override.py
      - name: Install dependencies
        working-directory: server
        run: pip install -r requirements.txt
      - name: Run complete server tests
        working-directory: server
        run: |
          python -m compileall app tests
          python -m unittest discover -s tests -v
      - name: Commit business files
        run: |
          git config user.name "xgl34222220-ops"
          git config user.email "xgl34222220@gmail.com"
          git add server/app/runtime_optimizations.py server/app/service.py server/tests/test_runtime_optimizations.py docker-compose.yml
          git commit -m "fix(server): 移除旧结算逻辑对学习链路的覆盖"
          git push origin HEAD:fix/remove-legacy-settlement-override
