name: Diagnose v5.7.1 publish runs

on:
  push:
    branches: [main]
    paths: [DIAG_V571_2_TRIGGER.txt]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture workflow states
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-v571
          git fetch origin --tags --force
          TAG_COMMIT="$(git rev-list -n1 v5.7.1)"
          gh run list --workflow publish-v5.7.1.yml --limit 10 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url \
            > ci-v571/PUBLISH_RUNS.json || true
          gh run list --workflow release.yml --commit "$TAG_COMMIT" --limit 10 \
            --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url \
            > ci-v571/SIGNED_RUNS.json || true
          PUBLISH_ID="$(jq -r '.[0].databaseId // empty' ci-v571/PUBLISH_RUNS.json)"
          SIGNED_ID="$(jq -r '.[0].databaseId // empty' ci-v571/SIGNED_RUNS.json)"
          if [[ -n "$PUBLISH_ID" ]]; then
            gh run view "$PUBLISH_ID" --json databaseId,status,conclusion,event,headSha,jobs,url \
              > ci-v571/PUBLISH_DETAIL.json
            [[ "$(jq -r '.status' ci-v571/PUBLISH_DETAIL.json)" != completed || "$(jq -r '.conclusion' ci-v571/PUBLISH_DETAIL.json)" == success ]] \
              || gh run view "$PUBLISH_ID" --log-failed > ci-v571/PUBLISH_FAILED_LOG.txt || true
          fi
          if [[ -n "$SIGNED_ID" ]]; then
            gh run view "$SIGNED_ID" --json databaseId,status,conclusion,event,headSha,jobs,url \
              > ci-v571/SIGNED_DETAIL.json
            [[ "$(jq -r '.status' ci-v571/SIGNED_DETAIL.json)" != completed || "$(jq -r '.conclusion' ci-v571/SIGNED_DETAIL.json)" == success ]] \
              || gh run view "$SIGNED_ID" --log-failed > ci-v571/SIGNED_FAILED_LOG.txt || true
          fi
          rm -f DIAG_V571_2_TRIGGER.txt .github/workflows/diag-release-v571-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v571/PUBLISH_RUNS.json ci-v571/SIGNED_RUNS.json
          for f in ci-v571/PUBLISH_DETAIL.json ci-v571/SIGNED_DETAIL.json ci-v571/PUBLISH_FAILED_LOG.txt ci-v571/SIGNED_FAILED_LOG.txt; do
            [[ ! -e "$f" ]] || git add -- "$f"
          done
          git rm --ignore-unmatch -- DIAG_V571_2_TRIGGER.txt .github/workflows/diag-release-v571-2.yml
          git commit -m 'ci: record v5.7.1 publish run diagnostics'
          git push origin HEAD:main
