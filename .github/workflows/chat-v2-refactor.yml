name: Apply chat v2 refactor

on:
  push:
    branches:
      - feature/v5.5.6-early-result
    paths:
      - .github/scripts/apply_chat_v2.py
      - .github/workflows/chat-v2-refactor.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply_chat_v2.py
      - .github/workflows/chat-v2-refactor.yml

permissions:
  contents: write

concurrency:
  group: chat-v2-refactor
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.5.6-early-result
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply multi-conversation refactor
        run: python3 .github/scripts/apply_chat_v2.py

      - name: Fix generated context test interpolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiChatContextWindowTest.kt')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"第$index轮对话："', '"第${index}轮对话："')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot helpers
        run: rm -f .github/scripts/apply_chat_v2.py .github/workflows/chat-v2-refactor.yml

      - name: Run unit tests, lint and APK builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Commit verified sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatArchiveStore.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AiChatDialog.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiChatArchiveCodecTest.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiChatContextWindowTest.kt \
            .github/scripts/apply_chat_v2.py \
            .github/workflows/chat-v2-refactor.yml
          git commit -m "feat: add persistent multi-conversation analysis chat"
          git push origin HEAD:feature/v5.5.6-early-result

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.6-chat-v2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.6-chat-v2-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
