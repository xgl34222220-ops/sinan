name: Roll back blocked Tianji v5.7.2 release

on:
  push:
    branches: [main]
    paths: [ROLLBACK_BLOCKED_V572_TRIGGER.txt]

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove incomplete tag and temporary release automation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.7.2 >/dev/null 2>&1; then
            echo 'Refusing rollback because a GitHub Release now exists.' >&2
            exit 1
          fi
          git push origin ':refs/tags/v5.7.2' || true

          mkdir -p ci-v572
          cat > ci-v572/RELEASE_BLOCKED.txt <<'EOF'
          status=blocked
          version_name=5.7.2
          version_code=39
          source_sha=e193dd90e842cee831f137a3cf6bc2a3b81d8630
          expected_signing_cert_sha256=5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed
          release_published=false
          tag_rolled_back=true
          signing_secrets_available=false
          original_backup_artifact_id=8842385591
          original_backup_artifact_expired=true
          non_expired_matching_backup_found=false
          file_library_backup_found=false
          reason=original Android signing private key is unavailable; publishing with another key would break upgrade compatibility
          required_input=Tianji-v5.5.5-signing-backup-PRIVATE.zip or tianji-release-v5.5.5.jks plus SIGNING-CREDENTIALS.txt
          EOF

          rm -f \
            .github/workflows/publish-v5.7.2.yml \
            PUBLISH_V572_TRIGGER.txt \
            .github/workflows/recover-publish-v5.7.2.yml \
            RECOVER_PUBLISH_V572_TRIGGER.txt \
            .github/workflows/diag-v5.7.2-release.yml \
            DIAG_V572_RELEASE_TRIGGER.txt \
            .github/workflows/rollback-blocked-v5.7.2-release.yml \
            ROLLBACK_BLOCKED_V572_TRIGGER.txt \
            ci-v572/PUBLISH_RUNS.json \
            ci-v572/PUBLISH_DETAIL.json \
            ci-v572/PUBLISH_FAILED_LOG.txt \
            ci-v572/RECOVERY_RUNS.json \
            ci-v572/RECOVERY_DETAIL.json \
            ci-v572/RECOVERY_FAILED_LOG.txt \
            ci-v572/SIGNED_RELEASE_RUNS.json \
            ci-v572/SIGNED_RELEASE_DETAIL.json \
            ci-v572/SIGNED_RELEASE_FAILED_LOG.txt \
            ci-v572/ARTIFACTS.json \
            ci-v572/NON_EXPIRED_SIGNING_ARTIFACTS.json \
            ci-v572/ARTIFACT_PAGES.json \
            ci-v572/ALL_ARTIFACTS.json \
            ci-v572/ALL_NON_EXPIRED_ARTIFACTS.json \
            ci-v572/POTENTIAL_SIGNING_ARTIFACTS.json \
            ci-v572/EXPIRED_BACKUP_REFERENCE.json \
            ci-v572/NON_EXPIRED_SAME_BACKUP_NAME.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v572/RELEASE_BLOCKED.txt
          git rm --ignore-unmatch -- \
            .github/workflows/publish-v5.7.2.yml \
            PUBLISH_V572_TRIGGER.txt \
            .github/workflows/recover-publish-v5.7.2.yml \
            RECOVER_PUBLISH_V572_TRIGGER.txt \
            .github/workflows/diag-v5.7.2-release.yml \
            DIAG_V572_RELEASE_TRIGGER.txt \
            .github/workflows/rollback-blocked-v5.7.2-release.yml \
            ROLLBACK_BLOCKED_V572_TRIGGER.txt \
            ci-v572/PUBLISH_RUNS.json \
            ci-v572/PUBLISH_DETAIL.json \
            ci-v572/PUBLISH_FAILED_LOG.txt \
            ci-v572/RECOVERY_RUNS.json \
            ci-v572/RECOVERY_DETAIL.json \
            ci-v572/RECOVERY_FAILED_LOG.txt \
            ci-v572/SIGNED_RELEASE_RUNS.json \
            ci-v572/SIGNED_RELEASE_DETAIL.json \
            ci-v572/SIGNED_RELEASE_FAILED_LOG.txt \
            ci-v572/ARTIFACTS.json \
            ci-v572/NON_EXPIRED_SIGNING_ARTIFACTS.json \
            ci-v572/ARTIFACT_PAGES.json \
            ci-v572/ALL_ARTIFACTS.json \
            ci-v572/ALL_NON_EXPIRED_ARTIFACTS.json \
            ci-v572/POTENTIAL_SIGNING_ARTIFACTS.json \
            ci-v572/EXPIRED_BACKUP_REFERENCE.json \
            ci-v572/NON_EXPIRED_SAME_BACKUP_NAME.json
          git commit -m 'chore: record blocked Tianji v5.7.2 signing release'
          git push origin HEAD:main
