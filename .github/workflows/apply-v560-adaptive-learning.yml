name: Apply Tianji v5.6.0 adaptive learning

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tianji-v560-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.ref == 'feature/v5.6.0-adaptive-learning' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild and verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v560-patch/part0 tools/v560-patch/part1 tools/v560-patch/part2 tools/v560-patch/part3 tools/v560-patch/part4 \
            | base64 --decode \
            | xz --decompress \
            > /tmp/apply_v560_patch.py
          python3 -m py_compile /tmp/apply_v560_patch.py
          python3 /tmp/apply_v560_patch.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiConversationTimelineTest.kt')
          text = path.read_text(encoding='utf-8')
          old = 'assertEquals(24, events.size)'
          new = 'assertEquals(10, events.size)'
          if old not in text:
              raise SystemExit('timeline cap assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'versionCode = 35' app/build.gradle.kts
          grep -q 'versionName = "5.6.0"' app/build.gradle.kts
          test -f app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAdaptiveLearning.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/v560-patch
          rm -f .github/workflows/apply-v560-adaptive-learning.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'feat: add independent adaptive AI learning'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
