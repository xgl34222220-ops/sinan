name: Integrate and verify Tianji v5.7.1

on:
  push:
    branches:
      - feature/release-v5.7.1
    paths:
      - INTEGRATE_V571_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tianji-v571-release-integration
  cancel-in-progress: false

jobs:
  integrate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-v5.7.1
          fetch-depth: 0

      - name: Import verified AI changes without overwriting server fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/tianji-v5.7.1-three-personas --force
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git checkout origin/feature/tianji-v5.7.1-three-personas -- \
            app/build.gradle.kts \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiIndependenceContractTest.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiChatPersonaTest.kt \
            RELEASE_NOTES_v5.7.1.md
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace('- 版本：5.7.0 云端持续运行版', '- 版本：5.7.1 AI 真独立与三专家正式版')
          marker = '## v5.7.0 主要变化\n'
          section = '''## v5.7.1 AI 真独立与三专家\n\n- 正式 AI 只接收真实原始开奖历史，不再注入本机名次、候选、概率矩阵或预计算统计。\n- 独立对话不再默认使用本机模型选择的名次；只有主动选择参考本机或反向审计时才传入本机信息。\n- 十个重叠人设收敛为“大数据规律、走势分析、综合预测”三个专业角色。\n- 旧人设 ID 自动迁移，历史会话继续可用。\n- 保留 v5.7.0 云端持续运行、本地降级和最新管理后台修复。\n\n'''
          if section.strip() not in text:
              text = text.replace(marker, section + marker)
          path.write_text(text)
          PY

      - name: Verify integration scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "5.7.1"' app/build.gradle.kts
          grep -q 'displayName = "大数据规律"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          grep -q 'displayName = "走势分析"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          grep -q 'displayName = "综合预测"' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt
          test -f server/app/web_console.py
          test -f server/tests/test_web_console.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run Android full verification
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Run server verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q server
          python3 -m pip install -q -r server/requirements.txt
          python3 -m pytest -q server/tests

      - name: Record verified integration and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-v571
          cat > ci-v571/FINAL_STATUS.txt <<EOF
          status=success
          source_sha=$(git rev-parse HEAD)
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          version_name=5.7.1
          version_code=38
          persona_count=3
          personas=大数据规律,走势分析,综合预测
          ai_raw_history_isolation=passed
          legacy_persona_migration=passed
          android_debug_release_tests=passed
          android_lint_debug_release=passed
          android_debug_r8_release_build=passed
          server_compile_tests=passed
          latest_main_server_fixes=preserved
          EOF
          rm -f INTEGRATE_V571_TRIGGER.txt
          rm -f .github/workflows/integrate-v5.7.1-release.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            app/build.gradle.kts \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiFreeChat.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiIndependenceContractTest.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiChatPersonaTest.kt \
            RELEASE_NOTES_v5.7.1.md \
            README.md \
            ci-v571/FINAL_STATUS.txt
          git rm --ignore-unmatch -- INTEGRATE_V571_TRIGGER.txt .github/workflows/integrate-v5.7.1-release.yml
          git commit -m 'release: verify Tianji v5.7.1 AI independence and three personas'
          git push origin HEAD:feature/release-v5.7.1
