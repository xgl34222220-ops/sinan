name: Apply Tianji v5.5.8 stream recovery

on:
  push:
    branches:
      - fix/v5.5.8-stream-recovery
    paths:
      - .github/scripts/apply-v5.5.8.py
      - .github/workflows/apply-v5.5.8.yml

permissions:
  contents: write

concurrency:
  group: tianji-v5.5.8-stream-recovery
  cancel-in-progress: false

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.5.8-stream-recovery
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-v5.5.8.py
          git diff --check
          grep -q 'versionName = "5.5.8"' app/build.gradle.kts
          grep -q '_tianji_stream_interrupted' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt
          grep -q 'AiErrorMessages.userFacing' app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt
          test ! -e .github/scripts/apply-v5.5.8.py
          test ! -e .github/workflows/apply-v5.5.8.yml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test, lint and build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleRelease

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '天机 v5.5.8：断流恢复与过程卡片收口'
          git push origin HEAD:fix/v5.5.8-stream-recovery
