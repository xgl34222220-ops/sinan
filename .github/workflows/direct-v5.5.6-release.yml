name: Direct v5.5.6 signed release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-v5.5.6-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: tianji-v5.5.6-direct-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install SDK and restore v5.5.5 signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          mkdir -p .signing-backup .signing
          gh run download 30777002592 --name Tianji-v5.5.5-signing-backup-PRIVATE --dir .signing-backup
          cp .signing-backup/tianji-release-v5.5.5.jks .signing/tianji-release.jks
          while IFS='=' read -r KEY VALUE; do
            case "$KEY" in
              TIANJI_KEYSTORE_PASSWORD|TIANJI_KEY_ALIAS|TIANJI_KEY_PASSWORD)
                printf '%s=%s\n' "$KEY" "$VALUE" >> "$GITHUB_ENV"
                ;;
            esac
          done < .signing-backup/SIGNING-CREDENTIALS.txt
          printf 'TIANJI_KEYSTORE_FILE=%s/.signing/tianji-release.jks\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Verify identity, test and build formal APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)" = '5.5.6'
          test "$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)" = '31'
          keytool -exportcert -rfc -keystore "$TIANJI_KEYSTORE_FILE" -storepass "$TIANJI_KEYSTORE_PASSWORD" -alias "$TIANJI_KEY_ALIAS" -file .signing/cert.pem
          DIGEST="$(openssl x509 -in .signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$DIGEST" = '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed'
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tianji-v5.5.6-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Tianji-v5.5.6-release.apk | tee dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          grep -qi "$DIGEST" dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging dist/Tianji-v5.5.6-release.apk | head -n5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist/APK_BADGING.txt
          grep -q "versionCode='31'" dist/APK_BADGING.txt
          grep -q "versionName='5.5.6'" dist/APK_BADGING.txt
          printf 'SHA256 certificate digest: %s\n' "$DIGEST" > dist/SIGNING_CERT_SHA256.txt
          sha256sum dist/Tianji-v5.5.6-release.apk > dist/Tianji-v5.5.6-SHA256.txt
          unzip -t dist/Tianji-v5.5.6-release.apk >/dev/null

      - name: Publish v5.5.6 and remove all previous releases, tags and branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          if ! git ls-remote --exit-code --tags origin refs/tags/v5.5.6 >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v5.5.6 origin/main -m '天机 v5.5.6 正式版'
            git push origin refs/tags/v5.5.6
          fi
          if gh release view v5.5.6 >/dev/null 2>&1; then
            gh release edit v5.5.6 --title '天机 v5.5.6' --notes-file RELEASE_NOTES_v5.5.6.md --draft=false --prerelease=false
            gh release upload v5.5.6 dist/* --clobber
          else
            gh release create v5.5.6 --verify-tag --title '天机 v5.5.6' --notes-file RELEASE_NOTES_v5.5.6.md dist/*
          fi
          while IFS= read -r OLD; do
            [[ -z "$OLD" || "$OLD" == 'v5.5.6' ]] && continue
            gh release delete "$OLD" --yes
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          while IFS= read -r REF; do
            TAG="${REF#refs/tags/}"
            [[ -z "$TAG" || "$TAG" == 'v5.5.6' ]] && continue
            git push origin ":refs/tags/$TAG"
          done < <(git ls-remote --tags --refs origin | awk '{print $2}')
          while IFS= read -r REF; do
            BRANCH="${REF#refs/heads/}"
            [[ -z "$BRANCH" || "$BRANCH" == 'main' ]] && continue
            git push origin --delete "$BRANCH"
          done < <(git ls-remote --heads origin | awk '{print $2}')
          ASSETS="$(gh release view v5.5.6 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.5.6-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.5.6-SHA256.txt' <<<"$ASSETS"
          test "$(gh release list --limit 1000 --json tagName --jq 'length')" = '1'
          test "$(git ls-remote --tags --refs origin | wc -l | tr -d ' ')" = '1'
          test "$(git ls-remote --heads origin | wc -l | tr -d ' ')" = '1'

      - uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.5.6-formal-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
