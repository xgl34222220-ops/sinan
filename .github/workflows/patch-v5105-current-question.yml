name: Patch v5.10.5 current question

on:
  push:
    branches: ['fix/v5.10.5-ai-rank-context']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[current-question-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.10.5-ai-rank-context
          fetch-depth: 0
      - name: Apply current-question patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v5105_current_question.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt RELEASE_NOTES_v5.10.5.md
          git commit -m 'fix(ai): make the latest question authoritative [current-question-patched]'
          git push origin HEAD:fix/v5.10.5-ai-rank-context
