name: Apply one-shot UI layout cleanup

on:
  push:
    branches:
      - feat/ui-push-console-polish

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ui-push-console-polish
          fetch-depth: 0

      - name: Replace legacy bottom-bar reservations
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt": [
                  ("bottom = 96.dp", "bottom = 16.dp"),
                  (
                      "PaddingValues(12.dp, 12.dp, 12.dp, 96.dp)",
                      "PaddingValues(12.dp, 12.dp, 12.dp, 16.dp)",
                  ),
              ],
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt": [
                  (
                      "PaddingValues(12.dp, 10.dp, 12.dp, 88.dp)",
                      "PaddingValues(12.dp, 10.dp, 12.dp, 16.dp)",
                  ),
              ],
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt": [
                  (
                      "PaddingValues(12.dp, 12.dp, 12.dp, 96.dp)",
                      "PaddingValues(12.dp, 12.dp, 12.dp, 16.dp)",
                  ),
              ],
              "app/src/main/java/com/tianji/probabilitylab/nativev4/ui/Screens.kt": [
                  ("bottom = 124.dp", "bottom = 16.dp"),
              ],
          }

          for raw_path, rules in replacements.items():
              path = Path(raw_path)
              value = path.read_text(encoding="utf-8")
              original = value
              replaced = 0
              for old, new in rules:
                  count = value.count(old)
                  value = value.replace(old, new)
                  replaced += count
              if replaced == 0 or value == original:
                  raise SystemExit(f"expected layout reservation was not found in {raw_path}")
              path.write_text(value, encoding="utf-8")
              print(f"updated {raw_path}: {replaced} replacement(s)")
          PY

      - name: Commit exact replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ui
          git diff --cached --check
          git commit -m "refactor(app): remove manual bottom bar reservations"
          git push origin HEAD:feat/ui-push-console-polish
