name: Apply v6.5 UI polish

on:
  push:
    branches:
      - feature/v6.5-ui-final-polish-2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v6.5-ui-final-polish-2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply v6.5 UI patch
        run: |
          # Resolve literals shared by more than one visual component without weakening other guards.
          sed -i '/replace(SEG, "val shape = RoundedCornerShape(15.dp)"/d' scripts/v65_ui_polish.py
          sed -i 's/replace(STRATEGY, "SurfaceCard(radius = 21.dp)", "SurfaceCard(radius = 20.dp)", count=3)/replace(STRATEGY, "SurfaceCard(radius = 21.dp)", "SurfaceCard(radius = 20.dp)")/' scripts/v65_ui_polish.py
          sed -i 's/replace(STRATEGY, "Column(Modifier.padding(15.dp))", "Column(Modifier.padding(14.dp))", count=3)/replace(STRATEGY, "Column(Modifier.padding(15.dp))", "Column(Modifier.padding(14.dp))")/' scripts/v65_ui_polish.py
          sed -i 's/replace(CHAT, "shape = RoundedCornerShape(21.dp)", "shape = RoundedCornerShape(18.dp)", count=1)/replace(CHAT, "shape = RoundedCornerShape(21.dp)", "shape = RoundedCornerShape(18.dp)")/' scripts/v65_ui_polish.py
          python scripts/v65_ui_polish.py

      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/theme/TianjiTheme.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppHeader.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/MainBottomBar.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SegmentedControls.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsEntry.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedUiCommon.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62ArchiveScreen.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62ForecastScreen.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62PushAlertCenter.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AiChatDialog.kt \
            server/app/web_console.py \
            server/app/console_v3.py \
            server/tests/test_v620_experience.py
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
            exit 0
          fi
          git commit -m "feat: apply v6.5 UI final polish"
          git push origin HEAD:feature/v6.5-ui-final-polish-2
