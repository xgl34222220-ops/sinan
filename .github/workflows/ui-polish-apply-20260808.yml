name: Apply scoped UI polish

on:
  push:
    branches: [feature/ui-polish-v68-20260808]
    paths:
      - '.github/workflows/ui-polish-apply-20260808.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ui-polish-v68-20260808
          fetch-depth: 0

      - name: Apply v6.7-baseline UI polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected source in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  return
              p.write_text(text.replace(old, new), encoding='utf-8')

          forecast = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V67ForecastScreen.kt'
          replace_once(
              forecast,
              'import androidx.compose.runtime.mutableIntStateOf\n',
              'import androidx.compose.runtime.mutableIntStateOf\nimport androidx.compose.runtime.mutableLongStateOf\n',
          )
          replace_once(
              forecast,
              'private fun V67DualLotteryStrip(\n    selected: LotteryType,\n    realtime: Map<LotteryType, CloudRealtimeLottery>,\n    fallbackState: AppUiState,\n    onSelect: (LotteryType) -> Unit,\n) {\n    val colors = LocalTianjiColors.current\n',
              'private fun V67DualLotteryStrip(\n    selected: LotteryType,\n    realtime: Map<LotteryType, CloudRealtimeLottery>,\n    fallbackState: AppUiState,\n    onSelect: (LotteryType) -> Unit,\n) {\n    val colors = LocalTianjiColors.current\n    val nowEpochMs = rememberFreshnessNow()\n',
          )
          replace_once(
              forecast,
              '            val syncedAt = item?.syncedAtEpochMs ?: fallback?.sourceHealth?.syncedAtEpochMs\n            val fresh = syncedAt != null && System.currentTimeMillis() - syncedAt < 30_000L\n',
              '            val syncedAt = item?.syncedAtEpochMs ?: fallback?.sourceHealth?.syncedAtEpochMs\n            val fresh = syncedAt != null && nowEpochMs - syncedAt < 30_000L\n            val freshness = freshnessLabel(syncedAt, nowEpochMs)\n',
          )
          replace_once(
              forecast,
              '                Text(\n                    period,\n',
              '                Text(\n                    "${compactPeriodLabel(period)} · $freshness",\n',
          )
          replace_once(
              forecast,
              'private fun V67LiveBand(\n    state: AppUiState,\n    realtime: CloudRealtimeLottery?,\n    onRefreshAll: () -> Unit,\n) {\n    val colors = LocalTianjiColors.current\n',
              'private fun V67LiveBand(\n    state: AppUiState,\n    realtime: CloudRealtimeLottery?,\n    onRefreshAll: () -> Unit,\n) {\n    val colors = LocalTianjiColors.current\n    val nowEpochMs = rememberFreshnessNow()\n',
          )
          replace_once(
              forecast,
              '    val fresh = System.currentTimeMillis() - syncedAt < 30_000L\n',
              '    val fresh = nowEpochMs - syncedAt < 30_000L\n',
          )
          replace_once(
              forecast,
              '                        if (fresh) "双彩种实时同步" else "等待云端快照更新",\n',
              '                        if (fresh) "开奖快照已更新" else "等待云端快照更新",\n',
          )
          replace_once(
              forecast,
              '                    "${ageLabel(syncedAt)} · 目标 $nextPeriod",\n',
              '                    "${freshnessLabel(syncedAt, nowEpochMs)} · 目标 $nextPeriod",\n',
          )
          replace_all(forecast, 'fontSize = 9.sp', 'fontSize = 11.sp')
          replace_all(forecast, 'fontSize = 10.sp', 'fontSize = 11.sp')
          replace_once(
              forecast,
              'private fun ageLabel(epochMs: Long): String {\n    val seconds = ((System.currentTimeMillis() - epochMs).coerceAtLeast(0L) / 1_000L).toInt()\n    return when {\n        seconds < 3 -> "刚刚同步"\n        seconds < 60 -> "${seconds}秒前同步"\n        else -> "${seconds / 60}分钟前同步"\n    }\n}\n',
              '''@Composable\nprivate fun rememberFreshnessNow(): Long {\n    var nowEpochMs by remember { mutableLongStateOf(System.currentTimeMillis()) }\n    LaunchedEffect(Unit) {\n        while (true) {\n            delay(1_000L)\n            nowEpochMs = System.currentTimeMillis()\n        }\n    }\n    return nowEpochMs\n}\n\nprivate fun compactPeriodLabel(period: String): String =\n    if (period.length > 8) period.takeLast(8) else period\n\nprivate fun freshnessLabel(epochMs: Long?, nowEpochMs: Long): String {\n    if (epochMs == null) return "等待同步"\n    val seconds = ((nowEpochMs - epochMs).coerceAtLeast(0L) / 1_000L).toInt()\n    return when {\n        seconds < 3 -> "刚刚"\n        seconds < 60 -> "${seconds}秒前"\n        else -> "${seconds / 60}分钟前"\n    }\n}\n''',
          )

          bottom = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/MainBottomBar.kt'
          replace_all(bottom, 'fontSize = 10.sp', 'fontSize = 11.sp')
          replace_once(bottom, 'elevation = if (colors.isOled) 0.dp else 9.dp,', 'elevation = if (colors.isOled) 0.dp else 6.dp,')
          replace_once(bottom, 'color = colors.accent.copy(alpha = 0.10f),', 'color = colors.accent.copy(alpha = 0.07f),')

          header = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppHeader.kt'
          replace_all(header, 'fontSize = 9.sp', 'fontSize = 10.sp')

          push = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62PushAlertCenter.kt'
          replace_once(push, 'import androidx.compose.foundation.layout.Column\n', 'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.IntrinsicSize\n')
          replace_once(push, 'import androidx.compose.foundation.layout.fillMaxSize\n', 'import androidx.compose.foundation.layout.fillMaxHeight\nimport androidx.compose.foundation.layout.fillMaxSize\n')
          replace_once(
              push,
              '                    V62AlertChipRow(V62AlertFilter.entries, filter, V62AlertFilter::label) { filterName = it.name }\n                    if (showFilters) {\n                        V62AlertChipRow(V62AlertLottery.entries, lottery, V62AlertLottery::label) { lotteryName = it.name }\n',
              '                    V62AlertChipRow(\n                        listOf(V62AlertFilter.ALL, V62AlertFilter.UNREAD),\n                        filter,\n                        V62AlertFilter::label,\n                    ) { filterName = it.name }\n                    if (showFilters) {\n                        V62AlertChipRow(\n                            listOf(V62AlertFilter.PREDICTION, V62AlertFilter.RISK, V62AlertFilter.RECOVERY),\n                            filter,\n                            V62AlertFilter::label,\n                        ) { filterName = it.name }\n                        V62AlertChipRow(V62AlertLottery.entries, lottery, V62AlertLottery::label) { lotteryName = it.name }\n',
          )
          replace_once(
              push,
              '            .fillMaxWidth()\n            .clip(RoundedCornerShape(19.dp))\n            .background(if (focused) tint.copy(alpha = 0.11f) else colors.surface.copy(alpha = 0.82f))\n            .border(1.dp, if (focused) tint.copy(alpha = 0.28f) else colors.line, RoundedCornerShape(19.dp))\n',
              '            .fillMaxWidth()\n            .height(IntrinsicSize.Min)\n            .clip(RoundedCornerShape(19.dp))\n            .background(if (focused) tint.copy(alpha = 0.07f) else colors.surface.copy(alpha = 0.82f))\n            .border(1.dp, if (focused) tint.copy(alpha = 0.22f) else colors.line, RoundedCornerShape(19.dp))\n',
          )
          replace_once(push, '.height(118.dp)\n                .background(if (alert.isRead) colors.lineStrong else tint),', '.fillMaxHeight()\n                .background(if (alert.isRead) colors.lineStrong else tint),')
          replace_all(push, 'fontSize = 10.sp', 'fontSize = 11.sp')

          settings_entry = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsEntry.kt'
          replace_once(settings_entry, 'import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n')
          replace_once(
              settings_entry,
              '            .heightIn(min = 64.dp)\n            .clip(RoundedCornerShape(13.dp))\n            .semantics { role = Role.Button }\n            .clickable(onClick = onClick)\n            .padding(horizontal = 10.dp, vertical = 9.dp),\n',
              '            .heightIn(min = 68.dp)\n            .clip(RoundedCornerShape(16.dp))\n            .background(colors.surface.copy(alpha = if (colors.isDark) 0.64f else 0.88f))\n            .border(1.dp, colors.line, RoundedCornerShape(16.dp))\n            .semantics { role = Role.Button }\n            .clickable(onClick = onClick)\n            .padding(horizontal = 12.dp, vertical = 10.dp),\n',
          )

          settings = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt'
          replace_once(
              settings,
              ') {\n    LazyColumn(\n        modifier = modifier,\n        contentPadding = PaddingValues(12.dp, 12.dp, 12.dp, 16.dp),\n        verticalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        item {\n            SettingsEntry(\n                Icons.Rounded.Psychology,\n',
              ') {\n    val colors = LocalTianjiColors.current\n    LazyColumn(\n        modifier = modifier,\n        contentPadding = PaddingValues(12.dp, 12.dp, 12.dp, 16.dp),\n        verticalArrangement = Arrangement.spacedBy(10.dp),\n    ) {\n        item("settings-section-core") {\n            Text("核心能力", color = colors.textDim, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 4.dp, top = 2.dp))\n        }\n        item {\n            SettingsEntry(\n                Icons.Rounded.Psychology,\n',
          )
          replace_once(
              settings,
              '        item {\n            SettingsEntry(\n                Icons.Rounded.ColorLens,\n',
              '        item("settings-section-personal") {\n            Text("个性化", color = colors.textDim, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 4.dp, top = 4.dp))\n        }\n        item {\n            SettingsEntry(\n                Icons.Rounded.ColorLens,\n',
          )
          replace_once(
              settings,
              '        item {\n            SettingsEntry(\n                Icons.Rounded.History,\n',
              '        item("settings-section-more") {\n            Text("更多", color = colors.textDim, fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 4.dp, top = 4.dp))\n        }\n        item {\n            SettingsEntry(\n                Icons.Rounded.History,\n',
          )
          replace_all(settings, 'fontSize = 10.sp', 'fontSize = 11.sp')

          archive = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62ArchiveScreen.kt'
          replace_all(archive, 'fontSize = 9.sp', 'fontSize = 11.sp')
          replace_all(archive, 'fontSize = 10.sp', 'fontSize = 11.sp')

          strategy = 'app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt'
          replace_all(strategy, 'fontSize = 9.sp', 'fontSize = 11.sp')
          replace_all(strategy, 'fontSize = 10.sp', 'fontSize = 11.sp')
          PY

          git diff --check
          git diff --stat

      - name: Commit UI polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V67ForecastScreen.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/MainBottomBar.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppHeader.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62PushAlertCenter.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsEntry.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/V62ArchiveScreen.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedForecastStrategy.kt
          git diff --cached --check
          git commit -m 'ui: polish stable v6.7 visual hierarchy'
          git push origin HEAD:feature/ui-polish-v68-20260808
