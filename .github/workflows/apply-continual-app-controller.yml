name: Apply continual App AI wiring

on:
  push:
    branches:
      - fix/ai-independence-and-streaks
    paths:
      - .github/workflows/apply-continual-app-controller.yml

permissions:
  contents: write

jobs:
  wire-app-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ai-independence-and-streaks
          fetch-depth: 0
      - name: Switch AppController to continual analyzer
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/tianji/probabilitylab/nativev4/AppController.kt'
          sed -i \
            's/import com\.tianji\.probabilitylab\.nativev4\.ai\.RemoteAiAnalyzer/import com.tianji.probabilitylab.nativev4.ai.ContinualRemoteAiAnalyzer/' \
            "$file"
          sed -i \
            's/private val remoteAiAnalyzer = RemoteAiAnalyzer(appContext)/private val remoteAiAnalyzer = ContinualRemoteAiAnalyzer(appContext)/' \
            "$file"
          grep -q 'import com.tianji.probabilitylab.nativev4.ai.ContinualRemoteAiAnalyzer' "$file"
          grep -q 'private val remoteAiAnalyzer = ContinualRemoteAiAnalyzer(appContext)' "$file"
          ! grep -q 'import com.tianji.probabilitylab.nativev4.ai.RemoteAiAnalyzer' "$file"
          rm -- .github/workflows/apply-continual-app-controller.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file" .github/workflows/apply-continual-app-controller.yml
          git commit -m 'feat: enable continual learning for app AI forecasts'
          git push origin HEAD:fix/ai-independence-and-streaks
