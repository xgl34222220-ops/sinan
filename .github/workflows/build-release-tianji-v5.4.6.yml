name: Build and release Tianji v5.4.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-release-tianji-v5.4.6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable Tianji signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: tianji-release-signing-v1
          enableCrossOsArchive: false
          fail-on-cache-miss: true

      - name: Build and verify v5.4.6
        shell: bash
        run: |
          set -euo pipefail
          AI_FILE='app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt'
          test -s .signing/tianji-release.jks
          test -s .signing/password.txt
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "5.4.6"' app/build.gradle.kts
          ! grep -q 'analysis_method_rule' "$AI_FILE"
          ! grep -q '证据接近时应保持scores接近' "$AI_FILE"
          grep -q 'readTimeoutMs = if (primaryDecision.expectsReasoning) 60_000 else 30_000' "$AI_FILE"
          grep -q 'readTimeoutMs = 20_000' "$AI_FILE"

          export TIANJI_KEYSTORE_FILE="$GITHUB_WORKSPACE/.signing/tianji-release.jks"
          export TIANJI_KEYSTORE_PASSWORD="$(cat "$GITHUB_WORKSPACE/.signing/password.txt")"
          export TIANJI_KEY_ALIAS=tianji
          export TIANJI_KEY_PASSWORD="$TIANJI_KEYSTORE_PASSWORD"

          gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease 2>&1 | tee build-v5.4.6.log

          mkdir -p dist-v5.4.6
          cp app/build/outputs/apk/release/app-release.apk dist-v5.4.6/Tianji-v5.4.6-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist-v5.4.6/Tianji-v5.4.6-release.apk | tee dist-v5.4.6/APK_VERIFY.txt
          grep -qi 'f492329ea2492439e20c8339bd29975f10fb6f71578212ab73a6857bc6e46133' dist-v5.4.6/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging dist-v5.4.6/Tianji-v5.4.6-release.apk | head -n 5 | tee dist-v5.4.6/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" dist-v5.4.6/APK_BADGING.txt
          grep -q "versionCode='23' versionName='5.4.6'" dist-v5.4.6/APK_BADGING.txt
          sha256sum dist-v5.4.6/Tianji-v5.4.6-release.apk > dist-v5.4.6/Tianji-v5.4.6-release-SHA256.txt
          unzip -t dist-v5.4.6/Tianji-v5.4.6-release.apk >/dev/null

      - name: Upload stable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tianji-v5.4.6-Stable-APK
          path: dist-v5.4.6/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.4.6 >/dev/null 2>&1; then
            gh release upload v5.4.6 \
              dist-v5.4.6/Tianji-v5.4.6-release.apk \
              dist-v5.4.6/Tianji-v5.4.6-release-SHA256.txt \
              --clobber
            gh release edit v5.4.6 \
              --target "$(git rev-parse HEAD)" \
              --title '天机 v5.4.6 正式版' \
              --notes-file RELEASE_NOTES_v5.4.6.md
          else
            gh release create v5.4.6 \
              --target "$(git rev-parse HEAD)" \
              --title '天机 v5.4.6 正式版' \
              --notes-file RELEASE_NOTES_v5.4.6.md \
              dist-v5.4.6/Tianji-v5.4.6-release.apk \
              dist-v5.4.6/Tianji-v5.4.6-release-SHA256.txt
          fi
