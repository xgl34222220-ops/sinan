name: Apply two-miss Telegram prealert

on:
  push:
    branches:
      - feature/telegram-two-miss-prealert
    paths:
      - tools/apply_two_miss_prealert.py
      - .github/workflows/two-miss-prealert.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-two-miss-prealert
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply source changes
        run: python tools/apply_two_miss_prealert.py

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Compile backend
        run: python -m compileall -q server/app server/tests

      - name: Run backend tests
        working-directory: server
        run: python -m unittest discover -s tests -v

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/admin_insights.py server/app/push_alerts.py server/app/telegram_alerts.py server/tests/test_push_alerts.py server/tests/test_telegram_alerts.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: restore two-miss prealert before strong three-miss warning"
          git push origin HEAD:feature/telegram-two-miss-prealert
