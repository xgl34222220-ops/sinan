name: Build Sinan APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source and apply LuoShu UI overlay
        shell: bash
        run: |
          set -euo pipefail

          cp bootstrap/ui-fix.b64 /tmp/sinan-ui-fix.b64
          cp overlay/apply-alpha03-compile-fixes.py /tmp/apply-alpha03-compile-fixes.py
          cp overlay/alpha05-fix1.b64 /tmp/sinan-alpha05-fix1.b64
          echo "379a80da0a62512ffc34997e26b5d2e346b7ea8834fedaf38d34047c013e9b21  /tmp/sinan-alpha05-fix1.b64" | sha256sum -c -

          cat overlay/alpha03.part00 \
              overlay/alpha03.part01 \
              overlay/alpha03.part02 \
              overlay/alpha03.part03 \
              overlay/alpha03.part04 \
              overlay/alpha03.part05 \
              overlay/alpha03.part06 > /tmp/sinan-alpha03-overlay.b64
          echo "778c056b72491b2e537ad58ddd48f745b2db43cfc2919de117b6b8a631af8deb  /tmp/sinan-alpha03-overlay.b64" | sha256sum -c -

          cat overlay/alpha04.part00 \
              overlay/alpha04.part01 \
              overlay/alpha04.part02 \
              overlay/alpha04.part03 > /tmp/sinan-alpha04-overlay.b64
          echo "202d7b5da7a8b43817b71c9184f2c77a3cb220b6042d5f289f3ff2d86310b82f  /tmp/sinan-alpha04-overlay.b64" | sha256sum -c -

          cat overlay/alpha05.part00 \
              overlay/alpha05.part01 \
              overlay/alpha05.part02 \
              overlay/alpha05.part03 \
              overlay/alpha05.part04 > /tmp/sinan-alpha05-overlay.b64
          echo "e9e524960323d6654b268b964c8467ba6ebe517bf034de8b2ee8cc53780022e6  /tmp/sinan-alpha05-overlay.b64" | sha256sum -c -

          cat bootstrap/source.part00 \
              bootstrap/source.part01 \
              bootstrap/source.part02 \
              bootstrap/source.part03 > /tmp/sinan-source.b64
          echo "0b021fd12cdd6f8747342eea6e0ae0fd96bd1cb5ed15e85b00852bfe46b6db08  /tmp/sinan-source.b64" | sha256sum -c -
          base64 --decode /tmp/sinan-source.b64 > /tmp/sinan-source.tar.xz
          echo "a82e1417db3e606ae84eb80addf1f1cc5de78ccd9abce8dc72ed5bf786842069  /tmp/sinan-source.tar.xz" | sha256sum -c -

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/sinan-source.tar.xz -C .

          base64 --decode /tmp/sinan-ui-fix.b64 > /tmp/sinan-ui-fix.tar.xz
          echo "016f58ff39fd58d69b96898ea6f1d865addf79fb49562dfc881d08007d57ea37  /tmp/sinan-ui-fix.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sinan-ui-fix.tar.xz -C .

          base64 --decode /tmp/sinan-alpha03-overlay.b64 > /tmp/sinan-alpha03-overlay.tar.xz
          echo "fac980368aec81c2cad1695b7db4db067c95cd1f6bafbe2e45f4d23378e7062f  /tmp/sinan-alpha03-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sinan-alpha03-overlay.tar.xz -C .
          python3 /tmp/apply-alpha03-compile-fixes.py

          base64 --decode /tmp/sinan-alpha04-overlay.b64 > /tmp/sinan-alpha04-overlay.tar.xz
          echo "786c1f44b66f8376ab6fc6042e7ae3bd3732d4dc161b0aa203c3695c2479170c  /tmp/sinan-alpha04-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sinan-alpha04-overlay.tar.xz -C .

          base64 --decode /tmp/sinan-alpha05-overlay.b64 > /tmp/sinan-alpha05-overlay.tar.xz
          echo "dc526a16af94b7939486016a716fd79dd398e672187e218ebb90a17759deb7f4  /tmp/sinan-alpha05-overlay.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sinan-alpha05-overlay.tar.xz -C .

          base64 --decode /tmp/sinan-alpha05-fix1.b64 > /tmp/sinan-alpha05-fix1.tar.xz
          echo "1c3659877188c4403d16f593de70c59e390a86369cd5081e47287e443e874e7b  /tmp/sinan-alpha05-fix1.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sinan-alpha05-fix1.tar.xz -C .

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/io/github/xgl34222220/sinan/ui/SinanApp.kt
          test -f app/src/main/java/io/github/xgl34222220/sinan/ui/screens/WebUiScreen.kt
          test -f app/src/main/java/io/github/xgl34222220/sinan/DisplayPerformanceController.kt

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-reconstructed-source-alpha05
          path: |
            app
            build.gradle
            settings.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download pinned BoxProxy runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/boxctl/arm64-v8a
          curl -fL --retry 3 \
            https://github.com/boxproxy/boxproxy/releases/download/v0.0.1/boxctl-arm64-v8a \
            -o app/src/main/assets/boxctl/arm64-v8a/boxctl
          curl -fL --retry 3 \
            https://github.com/boxproxy/boxproxy/releases/download/v0.0.1/boxbpf-arm64-v8a \
            -o app/src/main/assets/boxctl/arm64-v8a/boxbpf
          chmod 755 app/src/main/assets/boxctl/arm64-v8a/boxctl app/src/main/assets/boxctl/arm64-v8a/boxbpf
          test -s app/src/main/assets/boxctl/arm64-v8a/boxctl
          test -s app/src/main/assets/boxctl/arm64-v8a/boxbpf

      - name: Build optimized installable APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-build-log-alpha05
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Sinan-0.4.0-alpha05-release.apk
          sha256sum dist/Sinan-0.4.0-alpha05-release.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-0.4.0-alpha05-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
