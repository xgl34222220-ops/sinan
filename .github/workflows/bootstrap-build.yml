name: Import Source and Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  issues:
    types: [ opened ]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct Android source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part00 \
              bootstrap/source.part01 \
              bootstrap/source.part02 \
              bootstrap/source.part03 > /tmp/sinan-source.b64
          echo "0b021fd12cdd6f8747342eea6e0ae0fd96bd1cb5ed15e85b00852bfe46b6db08  /tmp/sinan-source.b64" | sha256sum -c -
          base64 --decode /tmp/sinan-source.b64 > /tmp/sinan-source.tar.xz
          echo "a82e1417db3e606ae84eb80addf1f1cc5de78ccd9abce8dc72ed5bf786842069  /tmp/sinan-source.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/sinan-source.tar.xz -C .
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Apply Android compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e '/app:itemActiveIndicatorColor=/d' \
            -e '/app:itemActiveIndicatorEnabled=/d' \
            -e '/app:itemActiveIndicatorHeight=/d' \
            -e '/app:itemActiveIndicatorMarginHorizontal=/d' \
            -e '/app:itemRippleColor=/d' \
            app/src/main/res/layout/activity_main.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Download pinned BoxProxy runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/boxctl/arm64-v8a
          curl -fL --retry 3 \
            https://github.com/boxproxy/boxproxy/releases/download/v0.0.1/boxctl-arm64-v8a \
            -o app/src/main/assets/boxctl/arm64-v8a/boxctl
          curl -fL --retry 3 \
            https://github.com/boxproxy/boxproxy/releases/download/v0.0.1/boxbpf-arm64-v8a \
            -o app/src/main/assets/boxctl/arm64-v8a/boxbpf
          chmod 755 app/src/main/assets/boxctl/arm64-v8a/boxctl app/src/main/assets/boxctl/arm64-v8a/boxbpf
          test -s app/src/main/assets/boxctl/arm64-v8a/boxctl
          test -s app/src/main/assets/boxctl/arm64-v8a/boxbpf
          sha256sum app/src/main/assets/boxctl/arm64-v8a/boxctl app/src/main/assets/boxctl/arm64-v8a/boxbpf

      - name: Build installable debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sinan-0.4.0-alpha01-debug.apk
          sha256sum dist/Sinan-0.4.0-alpha01-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sinan-0.4.0-alpha01-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
