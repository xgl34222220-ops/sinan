name: Restore clean Tianji v5.5.1 hotfix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout clean hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.5.1-deepseek-json
          fetch-depth: 0

      - name: Restore only verified source files
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED_COMMIT=0d7cc5456dda20054c3e65b065cc60d78fcfc56b
          git checkout "$VERIFIED_COMMIT" -- \
            README.md \
            RELEASE_NOTES_v5.5.1.md \
            app/build.gradle.kts \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiReasoning.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiReasoningFallbackTest.kt
          cat > .gitignore <<'EOF'
          /.gradle/
          **/build/
          local.properties
          .idea/
          *.iml
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Unit tests, lint and builds
        run: >-
          gradle --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease

      - name: Commit clean verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-v5.5.1-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .gitignore \
            README.md \
            RELEASE_NOTES_v5.5.1.md \
            app/build.gradle.kts \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiReasoning.kt \
            app/src/test/java/com/tianji/probabilitylab/nativev4/ai/AiReasoningFallbackTest.kt
          git add -u -- .github/workflows
          git commit -m '天机 v5.5.1：保留 DeepSeek 真实思考并修复无预测'
          git push origin HEAD:fix/v5.5.1-deepseek-json
