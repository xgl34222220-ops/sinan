name: Observe final Tianji v5.7.3 publisher

on:
  pull_request:
    branches: [main]
    paths: [OBSERVE_PR_V573.txt]

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read final publisher run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(gh run list --repo '${{ github.repository }}' --limit 100 --json databaseId,name,status,conclusion,headSha,event,url,createdAt,updatedAt --jq '[.[] | select(.name == "Finalize Tianji v5.7.3 and clean repository")][0]')"
          printf 'FINALIZER_RESULT=%s\n' "$RESULT"
          RUN_ID="$(jq -r '.databaseId' <<<"$RESULT")"
          test "$RUN_ID" != null
          gh run view "$RUN_ID" --repo '${{ github.repository }}' --json databaseId,name,status,conclusion,headSha,event,url,jobs
