name: Publish Tianji v5.4.5 and clean branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v5.4.5-and-clean-branches.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify v5.4.5 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/8833770844/zip" > /tmp/tianji-v5.4.5.zip
          unzip -q /tmp/tianji-v5.4.5.zip -d release-assets
          test -s release-assets/Tianji-v5.4.5-release.apk
          test -s release-assets/Tianji-v5.4.5-release-SHA256.txt
          expected="$(awk 'NR==1 {print $1}' release-assets/Tianji-v5.4.5-release-SHA256.txt)"
          actual="$(sha256sum release-assets/Tianji-v5.4.5-release.apk | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$expected" = "$actual"

      - name: Publish v5.4.5 formal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v5.4.5 >/dev/null 2>&1; then
            gh release upload v5.4.5 \
              release-assets/Tianji-v5.4.5-release.apk \
              release-assets/Tianji-v5.4.5-release-SHA256.txt \
              --clobber
            gh release edit v5.4.5 \
              --target main \
              --title '天机 v5.4.5 正式版' \
              --notes-file RELEASE_NOTES_v5.4.5.md
          else
            gh release create v5.4.5 \
              --target main \
              --title '天机 v5.4.5 正式版' \
              --notes-file RELEASE_NOTES_v5.4.5.md \
              release-assets/Tianji-v5.4.5-release.apk \
              release-assets/Tianji-v5.4.5-release-SHA256.txt
          fi
          gh release view v5.4.5 --json tagName,name,isDraft,isPrerelease,url

      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "/repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            [ "$branch" = "main" ] && continue
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            echo "Deleting branch: $branch"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
          done
          sleep 3
          mapfile -t remaining < <(gh api --paginate "/repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branches: %s\n' "${remaining[*]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "main"
