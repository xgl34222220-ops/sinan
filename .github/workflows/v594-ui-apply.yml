name: Apply Tianji v5.9.4 UI

on:
  push:
    branches:
      - feature/v5.9.4-ui-unification
    paths:
      - tools/apply_v594_ui.py
      - .github/workflows/v594-ui-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5.9.4-ui-unification
          fetch-depth: 0

      - name: Apply UI migration
        run: python3 tools/apply_v594_ui.py

      - name: Remove one-time migration files
        run: |
          rm -- tools/apply_v594_ui.py
          rm -- .github/workflows/v594-ui-apply.yml

      - name: Commit generated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/AppShellV2.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/TianjiApp.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/Components.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/RefinedArchive.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt \
            app/src/main/java/com/tianji/probabilitylab/nativev4/ui/theme/TianjiTheme.kt \
            server/app/console_v3.py \
            server/app/console_v594.css \
            server/app/console_v594.js \
            tools/apply_v594_ui.py \
            .github/workflows/v594-ui-apply.yml
          git commit -m "feat: unify v5.9.4 App and Console UI"
          git push origin HEAD:feature/v5.9.4-ui-unification
