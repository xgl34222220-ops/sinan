name: Verify Tianji cloud backend

on:
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.env.example'
      - '.github/workflows/server-ci.yml'
  push:
    branches: [main, 'feature/**']
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.env.example'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Validate deployment scripts
        run: bash -n deploy/*.sh

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Compile backend
        run: python -m compileall -q server/app

      - name: Run unit tests
        env:
          PYTHONPATH: server
          TIANJI_DATABASE: ${{ runner.temp }}/tianji-ci.db
        run: python -m unittest discover -s server/tests -v

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build backend image
        run: docker build --tag tianji-server-ci server
