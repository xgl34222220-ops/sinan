name: Patch v5.10.3 target period

on:
  push:
    branches: ['fix/v5.10.3-target-period']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[target-period-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.10.3-target-period
          fetch-depth: 0

      - name: Apply target period patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_target_period_v5103.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt
          git commit -m 'fix(ai): lock prediction target period [target-period-patched]'
          git push origin HEAD:fix/v5.10.3-target-period
