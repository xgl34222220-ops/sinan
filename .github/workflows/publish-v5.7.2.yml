name: Publish Tianji v5.7.2 formal release

on:
  push:
    branches: [main]
    paths: [PUBLISH_V572_TRIGGER.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: tianji-v5.7.2-formal-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate formal release target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test "$VERSION" = 5.7.2
          test "$VERSION_CODE" = 39
          test -f RELEASE_NOTES_v5.7.2.md
          test -f ci-v572/STATUS.txt
          grep -q '^status=success$' ci-v572/STATUS.txt
          grep -q '^version_name=5.7.2$' ci-v572/STATUS.txt
          grep -q '^version_code=39$' ci-v572/STATUS.txt
          grep -q '模型只返回了思考流' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt
          grep -q '同模型限时核心收口' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiAnalysis.kt
          grep -q '正式预测自动省时' app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiReasoning.kt

      - name: Resolve immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main --tags --force
          SOURCE_SHA="$(git rev-parse origin/main)"
          if git ls-remote --exit-code --tags origin refs/tags/v5.7.2 >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n1 v5.7.2)"
            test "$TAG_COMMIT" = "$SOURCE_SHA"
          else
            git tag -a v5.7.2 "$SOURCE_SHA" -m '天机 v5.7.2 正式版'
            git push origin refs/tags/v5.7.2
            TAG_COMMIT="$SOURCE_SHA"
          fi
          test "$(git show v5.7.2:app/build.gradle.kts | sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' | head -n1)" = 5.7.2
          test "$(git show v5.7.2:app/build.gradle.kts | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n1)" = 39
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"

      - name: Wait for signed release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 80); do
            RUN_ID="$(gh run list --workflow release.yml --commit "$TAG_COMMIT" --limit 5 --json databaseId,event,status --jq '[.[] | select(.event == "push")][0].databaseId // empty')"
            [[ -n "$RUN_ID" ]] && break
            sleep 3
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          echo "RELEASE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Verify formal release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v5.7.2 --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == "v5.7.2" and (.isDraft | not) and (.isPrerelease | not)) | .tagName' \
            | grep -Fxq v5.7.2
          ASSETS="$(gh release view v5.7.2 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.7.2-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.7.2-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"
          mkdir -p /tmp/tianji-v572
          gh release download v5.7.2 -p SIGNING_CERT_SHA256.txt -p APK_BADGING.txt -D /tmp/tianji-v572
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' \
            /tmp/tianji-v572/SIGNING_CERT_SHA256.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev4'" /tmp/tianji-v572/APK_BADGING.txt
          grep -q "versionCode='39'" /tmp/tianji-v572/APK_BADGING.txt
          grep -q "versionName='5.7.2'" /tmp/tianji-v572/APK_BADGING.txt

      - name: Record completed formal release
        shell: bash
        run: |
          set -euo pipefail
          cat > ci-v572/RELEASE_STATUS.txt <<EOF
          status=success
          version_name=5.7.2
          version_code=39
          tag=v5.7.2
          release_run_id=${RELEASE_RUN_ID}
          source_sha=${TAG_COMMIT}
          signing_cert_sha256=5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed
          apk=Tianji-v5.7.2-release.apk
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          rm -f PUBLISH_V572_TRIGGER.txt .github/workflows/publish-v5.7.2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- ci-v572/RELEASE_STATUS.txt
          git rm --ignore-unmatch -- PUBLISH_V572_TRIGGER.txt .github/workflows/publish-v5.7.2.yml
          git commit -m 'chore: record verified Tianji v5.7.2 formal release'
          git push origin HEAD:main
