name: Tianji v5.7.1 workflow smoke

on:
  push:
    branches:
      - fix/ai-true-independence-v5.7.1
    paths-ignore:
      - ci-v571/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-true-independence-v5.7.1
          fetch-depth: 0
      - name: Write smoke result
        run: |
          mkdir -p ci-v571
          printf 'status=workflow_started\nsource_sha=%s\nchecked_at=%s\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > ci-v571/SMOKE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-v571/SMOKE.txt
          git commit -m 'ci: record v5.7.1 workflow smoke' || true
          git push origin HEAD:fix/ai-true-independence-v5.7.1
