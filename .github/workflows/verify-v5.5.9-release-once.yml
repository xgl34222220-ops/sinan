name: Verify Tianji v5.5.9 release once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v5.5.9-release-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: verify-tianji-v5.5.9-release
  cancel-in-progress: false

env:
  SOURCE_SHA: bac6b9d82d27c85fdc91a6dd4b4205e6959bf9a7
  RELEASE_TAG: v5.5.9
  VERSION_NAME: 5.5.9
  VERSION_CODE: '34'
  EXPECTED_CERT_SHA256: 5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for formal release and validate metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,name,isDraft,isPrerelease,url,targetCommitish,assets \
              > "$RUNNER_TEMP/release.json" 2>/dev/null; then
              found=1
              break
            fi
            sleep 20
          done
          test "$found" = 1
          test "$(jq -r '.tagName' "$RUNNER_TEMP/release.json")" = "$RELEASE_TAG"
          test "$(jq -r '.name' "$RUNNER_TEMP/release.json")" = '天机 v5.5.9'
          test "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" = 'false'
          test "$(jq -r '.isPrerelease' "$RUNNER_TEMP/release.json")" = 'false'
          for asset in \
            Tianji-v5.5.9-release.apk \
            Tianji-v5.5.9-release.aab \
            Tianji-v5.5.9-SHA256.txt \
            Tianji-v5.5.9-VERIFY.txt; do
            jq -e --arg asset "$asset" '.assets | any(.name == $asset)' \
              "$RUNNER_TEMP/release.json" >/dev/null
          done
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"

      - name: Download published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tianji-v5.5.9-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/tianji-v5.5.9-release" \
            --pattern 'Tianji-v5.5.9-*'
          test -s "$RUNNER_TEMP/tianji-v5.5.9-release/Tianji-v5.5.9-release.apk"
          test -s "$RUNNER_TEMP/tianji-v5.5.9-release/Tianji-v5.5.9-release.aab"
          test -s "$RUNNER_TEMP/tianji-v5.5.9-release/Tianji-v5.5.9-SHA256.txt"
          test -s "$RUNNER_TEMP/tianji-v5.5.9-release/Tianji-v5.5.9-VERIFY.txt"

      - name: Verify published hashes
        id: hashes
        shell: bash
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tianji-v5.5.9-release"
          APK="$DIR/Tianji-v5.5.9-release.apk"
          AAB="$DIR/Tianji-v5.5.9-release.aab"
          LIST="$DIR/Tianji-v5.5.9-SHA256.txt"
          EXPECTED_APK="$(grep 'Tianji-v5.5.9-release.apk' "$LIST" | awk '{print $1}')"
          EXPECTED_AAB="$(grep 'Tianji-v5.5.9-release.aab' "$LIST" | awk '{print $1}')"
          ACTUAL_APK="$(sha256sum "$APK" | awk '{print $1}')"
          ACTUAL_AAB="$(sha256sum "$AAB" | awk '{print $1}')"
          test "$ACTUAL_APK" = "$EXPECTED_APK"
          test "$ACTUAL_AAB" = "$EXPECTED_AAB"
          echo "apk=$ACTUAL_APK" >> "$GITHUB_OUTPUT"
          echo "aab=$ACTUAL_AAB" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Re-verify published APK certificate and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/tianji-v5.5.9-release/Tianji-v5.5.9-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-release.txt"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-release.txt" | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$($APKANALYZER manifest version-name "$APK" | tr -d '\r\n')" = "$VERSION_NAME"
          test "$($APKANALYZER manifest version-code "$APK" | tr -d '\r\n')" = "$VERSION_CODE"

      - name: Record successful verification and remove temporary workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.hashes.outputs.apk }}
          AAB_SHA256: ${{ steps.hashes.outputs.aab }}
        run: |
          set -euo pipefail
          mkdir -p .release
          RELEASE_URL="$(jq -r '.url' "$RUNNER_TEMP/release.json")"
          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > .release/v5.5.9-verified.txt <<EOF
          Tianji formal release verification
          tag=$RELEASE_TAG
          source_commit=$SOURCE_SHA
          version_name=$VERSION_NAME
          version_code=$VERSION_CODE
          certificate_sha256=$EXPECTED_CERT_SHA256
          apk_sha256=$APK_SHA256
          aab_sha256=$AAB_SHA256
          release_url=$RELEASE_URL
          verified_at=$VERIFIED_AT
          assets=Tianji-v5.5.9-release.apk,Tianji-v5.5.9-release.aab,Tianji-v5.5.9-SHA256.txt,Tianji-v5.5.9-VERIFY.txt
          EOF
          rm -f \
            .github/workflows/publish-v5.5.9-once.yml \
            .github/workflows/verify-v5.5.9-release-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .release/v5.5.9-verified.txt \
            .github/workflows/publish-v5.5.9-once.yml \
            .github/workflows/verify-v5.5.9-release-once.yml
          git commit -m 'chore: record verified Tianji v5.5.9 formal release'
          git push origin HEAD:main
