name: Publish Tianji v5.7.2 nativev5

on:
  push:
    branches: [main]
    paths: [PUBLISH_NATIVEV5_V572_TRIGGER.txt]

permissions:
  contents: write
  actions: write

concurrency:
  group: tianji-nativev5-v5.7.2-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin and validate release source
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SOURCE_SHA='1a19b17dd361e4fc2fc4a0347bc2322c844d7ee4'
          git cat-file -e "${RELEASE_SOURCE_SHA}^{commit}"
          git checkout --detach "$RELEASE_SOURCE_SHA"
          grep -Fq 'applicationId = "com.tianji.probabilitylab.nativev5"' app/build.gradle.kts
          grep -Fq 'namespace = "com.tianji.probabilitylab.nativev4"' app/build.gradle.kts
          grep -Fq 'versionCode = 39' app/build.gradle.kts
          grep -Fq 'versionName = "5.7.2"' app/build.gradle.kts
          grep -Fq 'https://tianji-xgl.duckdns.org' app/build.gradle.kts
          grep -Fq '<string name="app_name">天机·新正式版</string>' app/src/main/res/values/strings.xml
          test -s RELEASE_NOTES_v5.7.2.md
          echo "RELEASE_SOURCE_SHA=$RELEASE_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Generate permanent nativev5 signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing private-backup dist
          STORE_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          KEY_PASSWORD="$(openssl rand -base64 48 | tr -d '\n')"
          BACKUP_PASSWORD="$(openssl rand -base64 64 | tr -d '\n')"
          BACKUP_ID="$(openssl rand -hex 12)"
          KEY_ALIAS='tianji-nativev5-release'
          for value in "$STORE_PASSWORD" "$KEY_PASSWORD" "$BACKUP_PASSWORD"; do
            echo "::add-mask::$value"
          done
          cat >> "$GITHUB_ENV" <<EOF
          TIANJI_KEYSTORE_FILE=${GITHUB_WORKSPACE}/.signing/tianji-nativev5-release.jks
          TIANJI_KEYSTORE_PASSWORD=${STORE_PASSWORD}
          TIANJI_KEY_ALIAS=${KEY_ALIAS}
          TIANJI_KEY_PASSWORD=${KEY_PASSWORD}
          BACKUP_ARTIFACT_NAME=tianji-nativev5-key-${BACKUP_ID}
          PASSWORD_ARTIFACT_NAME=tianji-nativev5-recovery-${BACKUP_ID}
          APK_ARTIFACT_NAME=tianji-nativev5-apk-${BACKUP_ID}
          EOF
          keytool -genkeypair \
            -storetype JKS \
            -keystore .signing/tianji-nativev5-release.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname 'CN=Tianji NativeV5, OU=Android Release, O=Xiguli, L=Private, ST=Private, C=CN'
          keytool -list \
            -keystore .signing/tianji-nativev5-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -rfc \
            -keystore .signing/tianji-nativev5-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file .signing/tianji-nativev5-release-cert.pem
          CERT_SHA256="$(openssl x509 -in .signing/tianji-nativev5-release-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          printf 'SHA256 certificate digest: %s\n' "$CERT_SHA256" > dist/SIGNING_CERT_SHA256.txt
          cp .signing/tianji-nativev5-release.jks private-backup/
          cat > private-backup/SIGNING-CREDENTIALS.txt <<EOF
          PACKAGE_NAME=com.tianji.probabilitylab.nativev5
          VERSION_NAME=5.7.2
          VERSION_CODE=39
          KEYSTORE_FILE=tianji-nativev5-release.jks
          KEYSTORE_PASSWORD=${STORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASSWORD}
          CERT_SHA256=${CERT_SHA256}
          GENERATED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat > private-backup/RECOVERY-README.txt <<'EOF'
          这是天机 nativev5 永久正式签名的唯一恢复资料。
          必须同时保存加密备份文件和恢复密码。
          后续所有 com.tianji.probabilitylab.nativev5 正式版本都必须使用此 JKS、别名和密码签名。
          不要把解密后的 JKS 或 SIGNING-CREDENTIALS.txt 上传到公开仓库。
          EOF
          tar -C private-backup -czf .signing/tianji-nativev5-signing-backup.tar.gz .
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in .signing/tianji-nativev5-signing-backup.tar.gz \
            -out .signing/Tianji-nativev5-signing-backup-PRIVATE.enc \
            -pass pass:"$BACKUP_PASSWORD"
          cat > .signing/Tianji-nativev5-signing-backup-PASSWORD.txt <<EOF
          BACKUP_FILE=Tianji-nativev5-signing-backup-PRIVATE.enc
          BACKUP_PASSWORD=${BACKUP_PASSWORD}
          DECRYPT_COMMAND=openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in Tianji-nativev5-signing-backup-PRIVATE.enc -out Tianji-nativev5-signing-backup.tar.gz -pass pass:'${BACKUP_PASSWORD}'
          EOF
          rm -rf private-backup .signing/tianji-nativev5-signing-backup.tar.gz

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build signed release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease
          APK='dist/Tianji-v5.7.2-nativev5-release.apk'
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK_VERIFY.txt
          grep -q 'Verified using v2 scheme.*true' dist/APK_VERIFY.txt
          grep -q 'Verified using v3 scheme.*true' dist/APK_VERIFY.txt
          grep -qi "$CERT_SHA256" dist/APK_VERIFY.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.tianji.probabilitylab.nativev5'" dist/APK_BADGING.txt
          grep -q "versionCode='39'" dist/APK_BADGING.txt
          grep -q "versionName='5.7.2'" dist/APK_BADGING.txt
          sha256sum "$APK" > dist/Tianji-v5.7.2-nativev5-SHA256.txt
          printf '%s\n' "$RELEASE_SOURCE_SHA" > dist/RELEASE_SOURCE_SHA.txt
          cat > dist/PACKAGE_MIGRATION.txt <<'EOF'
          新包名：com.tianji.probabilitylab.nativev5
          旧包名：com.tianji.probabilitylab.nativev4
          两者可同时安装；新版继续连接原天机云端，但旧版本地设置、API Key、对话和本地档案不会自动迁移。
          EOF
          unzip -t "$APK" >/dev/null

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_ARTIFACT_NAME }}
          path: .signing/Tianji-nativev5-signing-backup-PRIVATE.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload signing recovery password
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PASSWORD_ARTIFACT_NAME }}
          path: .signing/Tianji-nativev5-signing-backup-PASSWORD.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload verified APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Create immutable tag and formal GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse --verify refs/tags/v5.7.2 >/dev/null 2>&1; then
            test "$(git rev-list -n1 v5.7.2)" = "$RELEASE_SOURCE_SHA"
          else
            git tag -a v5.7.2 "$RELEASE_SOURCE_SHA" -m '天机 v5.7.2 · nativev5 新永久签名版'
            git push origin refs/tags/v5.7.2
          fi
          if gh release view v5.7.2 >/dev/null 2>&1; then
            gh release upload v5.7.2 dist/* --clobber
            gh release edit v5.7.2 \
              --title '天机 v5.7.2 · 新正式签名版' \
              --notes-file RELEASE_NOTES_v5.7.2.md \
              --draft=false \
              --prerelease=false
          else
            gh release create v5.7.2 \
              --verify-tag \
              --title '天机 v5.7.2 · 新正式签名版' \
              --notes-file RELEASE_NOTES_v5.7.2.md \
              dist/*
          fi
          ASSETS="$(gh release view v5.7.2 --json assets --jq '.assets[].name')"
          grep -Fxq 'Tianji-v5.7.2-nativev5-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.7.2-nativev5-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'PACKAGE_MIGRATION.txt' <<<"$ASSETS"
          grep -Fxq 'RELEASE_SOURCE_SHA.txt' <<<"$ASSETS"

      - name: Record verified release and remove one-shot automation
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          mkdir -p ci-nativev5
          cat > ci-nativev5/RELEASE_STATUS.txt <<EOF
          status=success
          version_name=5.7.2
          version_code=39
          package_name=com.tianji.probabilitylab.nativev5
          tag=v5.7.2
          source_sha=${RELEASE_SOURCE_SHA}
          signing_cert_sha256=${CERT_SHA256}
          apk=Tianji-v5.7.2-nativev5-release.apk
          workflow_run_id=${GITHUB_RUN_ID}
          backup_artifact_name=${BACKUP_ARTIFACT_NAME}
          password_artifact_name=${PASSWORD_ARTIFACT_NAME}
          apk_artifact_name=${APK_ARTIFACT_NAME}
          cloud_base_url=https://tianji-xgl.duckdns.org
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-nativev5/RELEASE_STATUS.txt
          git rm --ignore-unmatch \
            PUBLISH_NATIVEV5_V572_TRIGGER.txt \
            .github/workflows/publish-nativev5-v5.7.2.yml \
            DIAG_NATIVEV5_V572_TRIGGER.txt \
            .github/workflows/diag-nativev5-v5.7.2.yml \
            ci-nativev5/PUBLISH_RUNS.json \
            ci-nativev5/PUBLISH_DETAIL.json \
            ci-nativev5/PUBLISH_FAILED_LOG.txt \
            ci-v572/RELEASE_BLOCKED.txt
          git commit -m 'chore: record verified Tianji v5.7.2 nativev5 release'
          git push origin HEAD:main
