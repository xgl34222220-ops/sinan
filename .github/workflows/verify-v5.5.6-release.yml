name: Verify published v5.5.6 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v5.5.6-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release, assets and repository state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release-check
          gh release view v5.5.6 --json tagName,isDraft,isPrerelease,publishedAt,url,assets > .release-check/release.json
          test "$(jq -r '.tagName' .release-check/release.json)" = 'v5.5.6'
          test "$(jq -r '.isDraft' .release-check/release.json)" = 'false'
          test "$(jq -r '.isPrerelease' .release-check/release.json)" = 'false'
          ASSETS="$(jq -r '.assets[].name' .release-check/release.json)"
          grep -Fxq 'Tianji-v5.5.6-release.apk' <<<"$ASSETS"
          grep -Fxq 'Tianji-v5.5.6-SHA256.txt' <<<"$ASSETS"
          grep -Fxq 'APK_VERIFY.txt' <<<"$ASSETS"
          grep -Fxq 'APK_BADGING.txt' <<<"$ASSETS"
          grep -Fxq 'SIGNING_CERT_SHA256.txt' <<<"$ASSETS"
          gh release download v5.5.6 --pattern 'Tianji-v5.5.6-SHA256.txt' --pattern 'SIGNING_CERT_SHA256.txt' --dir .release-check
          grep -qi '5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed' .release-check/SIGNING_CERT_SHA256.txt
          RELEASE_COUNT="$(gh release list --limit 1000 --json tagName --jq 'length')"
          TAG_COUNT="$(git ls-remote --tags --refs origin | wc -l | tr -d ' ')"
          BRANCH_COUNT="$(git ls-remote --heads origin | wc -l | tr -d ' ')"
          test "$RELEASE_COUNT" = '1'
          test "$TAG_COUNT" = '1'
          test "$BRANCH_COUNT" = '1'
          {
            echo '# 天机 v5.5.6 发布核验'
            echo
            echo "- Release: $(jq -r '.tagName' .release-check/release.json)"
            echo "- 正式发布: 是"
            echo "- 发布时间: $(jq -r '.publishedAt' .release-check/release.json)"
            echo "- Release 数量: $RELEASE_COUNT"
            echo "- 标签数量: $TAG_COUNT"
            echo "- 分支数量: $BRANCH_COUNT"
            echo "- 唯一分支: main"
            echo "- 唯一标签: v5.5.6"
            echo "- 签名证书 SHA-256: 5f55572fa29f204edac1886aa71ec48cdbe59bd6ace90a49bef1cb090fff66ed"
            echo "- APK SHA-256: $(awk '{print $1}' .release-check/Tianji-v5.5.6-SHA256.txt)"
            echo
            echo '## Release 资产'
            while IFS= read -r ASSET; do echo "- $ASSET"; done <<<"$ASSETS"
          } > PUBLISH_STATUS_v5.5.6.md

      - name: Commit verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- PUBLISH_STATUS_v5.5.6.md
          git commit -m 'docs: record v5.5.6 formal release verification'
          git push origin HEAD:main
