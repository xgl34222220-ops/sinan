name: Apply scoped UI padding fix

on:
  push:
    branches: [feature/ui-polish-v68-20260808]
    paths:
      - '.github/workflows/ui-polish-fix-20260808.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/ui-polish-v68-20260808
          fetch-depth: 0

      - name: Fix settings section padding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt')
          text = path.read_text(encoding='utf-8')
          old_top2 = 'Modifier.padding(horizontal = 4.dp, top = 2.dp)'
          old_top4 = 'Modifier.padding(horizontal = 4.dp, top = 4.dp)'
          if text.count(old_top2) != 1:
              raise SystemExit(f'expected one top=2 padding, got {text.count(old_top2)}')
          if text.count(old_top4) != 2:
              raise SystemExit(f'expected two top=4 paddings, got {text.count(old_top4)}')
          text = text.replace(old_top2, 'Modifier.padding(start = 4.dp, end = 4.dp, top = 2.dp)')
          text = text.replace(old_top4, 'Modifier.padding(start = 4.dp, end = 4.dp, top = 4.dp)')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit padding fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add -- app/src/main/java/com/tianji/probabilitylab/nativev4/ui/SettingsHubV2.kt
          git diff --cached --check
          git commit -m 'fix(ui): correct settings section padding'
          git push origin HEAD:feature/ui-polish-v68-20260808
