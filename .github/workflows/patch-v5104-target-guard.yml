name: Patch v5.10.4 target guard

on:
  push:
    branches: ['fix/v5.10.4-target-guard']

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[target-guard-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/v5.10.4-target-guard
          fetch-depth: 0

      - name: Apply target guard patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_target_guard_v5104.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tianji/probabilitylab/nativev4/ai/AiChatController.kt app/build.gradle.kts RELEASE_NOTES_v5.10.4.md
          git commit -m 'fix(ai): always reconcile explicit prediction target [target-guard-patched]'
          git push origin HEAD:fix/v5.10.4-target-guard
